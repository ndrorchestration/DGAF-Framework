name: External Acceptance Readiness Validation

on:
  pull_request:
    paths:
      - "docs/GOVERNANCE/EXTERNAL_ACCEPTANCE_READINESS_2026-09-07.md"
      - "docs/GOVERNANCE/PILOT_BLOCKER_MANIFEST_V0.7.6.json"
      - "docs/GOVERNANCE/REPOSITORY_ADMIN_ENFORCEMENT_HANDOFF_2026-09-07.md"
      - "docs/GOVERNANCE/MODE_T_PRODUCTION_AUTHORITY_HANDOFF_2026-09-07.md"
      - "docs/GOVERNANCE/stage_a/**"
      - "docs/GOVERNANCE/production_authority/**"
      - "docs/GOVERNANCE/continuity/**"
      - "docs/experiment/FINAL_CANDIDATE_DESIGNATION_TEMPLATE_V0.7.6.json"
      - "docs/experiment/PILOT_AUTHORIZATION_TEMPLATE_V0.7.6.json"
      - "scripts/validate_external_acceptance_readiness.py"
      - "scripts/validate_pilot_blocker_manifest.py"
      - ".github/workflows/external-acceptance-readiness-validation.yml"
  push:
    branches: [main]
    paths:
      - "docs/GOVERNANCE/EXTERNAL_ACCEPTANCE_READINESS_2026-09-07.md"
      - "docs/GOVERNANCE/PILOT_BLOCKER_MANIFEST_V0.7.6.json"
      - "docs/GOVERNANCE/REPOSITORY_ADMIN_ENFORCEMENT_HANDOFF_2026-09-07.md"
      - "docs/GOVERNANCE/MODE_T_PRODUCTION_AUTHORITY_HANDOFF_2026-09-07.md"
      - "docs/GOVERNANCE/stage_a/**"
      - "docs/GOVERNANCE/production_authority/**"
      - "docs/GOVERNANCE/continuity/**"
      - "docs/experiment/FINAL_CANDIDATE_DESIGNATION_TEMPLATE_V0.7.6.json"
      - "docs/experiment/PILOT_AUTHORIZATION_TEMPLATE_V0.7.6.json"
      - "scripts/validate_external_acceptance_readiness.py"
      - "scripts/validate_pilot_blocker_manifest.py"
      - ".github/workflows/external-acceptance-readiness-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-inert-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate inert templates and negative controls
        run: python scripts/validate_external_acceptance_readiness.py --self-test

      - name: Validate pilot blocker manifest and negative controls
        run: python scripts/validate_pilot_blocker_manifest.py --self-test

name: Track A Epoch 001 Unblinding Materialization Validation

on:
  pull_request:
    paths:
      - '.github/workflows/track-a-epoch-001-unblinding-materialization.yml'
      - 'scripts/materialize_track_a_epoch_001_unblinded_input.py'
      - 'tests/test_track_a_epoch_001_unblinded_materializer.py'
  push:
    paths:
      - '.github/workflows/track-a-epoch-001-unblinding-materialization.yml'
      - 'scripts/materialize_track_a_epoch_001_unblinded_input.py'
      - 'tests/test_track_a_epoch_001_unblinded_materializer.py'

permissions:
  contents: read

jobs:
  validate-tooling-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Prove exact validation head
        env:
          EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.0'

      - name: Run materializer contract tests only
        run: python -m unittest -v tests.test_track_a_epoch_001_unblinded_materializer

      - name: Prove validation performs no unblinding or analysis
        run: |
          set -euo pipefail
          test ! -e track_a_epoch_001_unblinded_analysis_input.json
          echo 'TRACK_A_UNBLINDING_DURING_VALIDATION=FALSE'
          echo 'PRIMARY_ANALYSIS_RUN=FALSE'
          echo 'OUTCOME_AGGREGATION=FALSE'
          echo 'SCIENTIFIC_N_INCREMENT=0'
          echo 'CANONICAL_DGAF_EFFICACY=NOT_ESTABLISHED'
          echo 'HIGH_ASSURANCE=NOT_AUTHORIZED'

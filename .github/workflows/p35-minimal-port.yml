name: P-35 Minimal Mainline Port
on:
  push:
    branches:
      - remediation/p35-minimal-mainline-2026-09-02
permissions:
  contents: write
jobs:
  port:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remediation/p35-minimal-mainline-2026-09-02
      - name: Apply minimal P-35 production and test delta
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('experiments/pdmal_pilot/runtime_characterization.py'); s=p.read_text()
          s=s.replace('import hashlib\nimport json', 'import hashlib\nimport importlib\nimport json', 1)
          s=s.replace('from time import monotonic\n\nfrom task_engine', 'from time import monotonic\nfrom typing import Any, Callable\n\nfrom task_engine', 1)
          s=s.replace('DEFAULT_CONDITIONS = ("null", "simple", "static", "dgaf")', 'DEFAULT_CONDITIONS = ("null", "simple", "static")', 1)
          marker='def _stats(values: list[float]) -> dict[str, float | None]:\n'
          fn='def _load_explicit_checker() -> Callable[[str, Any], bool]:\n    spec = os.getenv("PDMAL_PREMISE_CHECKER", "").strip()\n    if not spec or ":" not in spec:\n        raise SystemExit("runtime characterization prohibited: DGAF characterization requires PDMAL_PREMISE_CHECKER=module:attribute")\n    module_name, attribute_name = spec.split(":", 1)\n    if not module_name or not attribute_name or ":" in attribute_name:\n        raise SystemExit("runtime characterization prohibited: malformed PDMAL_PREMISE_CHECKER")\n    try:\n        module = importlib.import_module(module_name); checker = getattr(module, attribute_name)\n    except (ImportError, AttributeError) as exc:\n        raise SystemExit(f"runtime characterization prohibited: unable to load P-35 checker {spec}: {exc}") from exc\n    if not callable(checker):\n        raise SystemExit(f"runtime characterization prohibited: configured P-35 checker is not callable: {spec}")\n    return checker\n\n\n'
          if marker in s and 'def _load_explicit_checker' not in s: s=s.replace(marker,fn+marker,1)
          s=s.replace('    output_dir.mkdir(parents=True, exist_ok=True)', '    premise_check_fn = _load_explicit_checker() if "dgaf" in conditions else None\n\n    output_dir.mkdir(parents=True, exist_ok=True)', 1)
          old='''                    task = ConsensusTask(\n                        topology=topology,\n                        failure_count=failure_count,\n                        condition=condition,\n                    )'''
          new='''                    task_kwargs = {"topology": topology, "failure_count": failure_count, "condition": condition}\n                    if condition == "dgaf":\n                        task_kwargs["premise_check_fn"] = premise_check_fn\n                    task = ConsensusTask(**task_kwargs)'''
          if old in s: s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('experiments/pdmal_pilot/test_dgaf_tgl_adapter.py'); s=p.read_text()
          s=s.replace('def test_canonical_serialization_is_deterministic(state: ConsensusState) -> None:', 'def allow_all_premises(_text, _invariant) -> bool:\n    return True\n\n\ndef test_canonical_serialization_is_deterministic(state: ConsensusState) -> None:', 1)
          s=s.replace('DGAF_TGLAdapter(session_id="contract-test")', 'DGAF_TGLAdapter(session_id="contract-test", premise_check_fn=allow_all_premises)', 1)
          s=s.replace('DGAF_TGLAdapter(session_id="provenance-test")', 'DGAF_TGLAdapter(session_id="provenance-test", premise_check_fn=allow_all_premises)', 1)
          p.write_text(s)

          p=Path('experiments/pdmal_pilot/test_task_engine.py'); s=p.read_text()
          s=s.replace('def test_first_attempt_success():', 'def allow_all_premises(_text, _invariant) -> bool:\n    return True\n\n\ndef test_first_attempt_success():', 1)
          old='''def test_consensus_task_is_deterministic_across_attempts():\n    for condition in ("null", "simple", "static", "dgaf"):\n        task = ConsensusTask(topology="ring", failure_count=2, condition=condition)'''
          new='''def test_consensus_task_is_deterministic_across_attempts():\n    for condition in ("null", "simple", "static"):\n        task = ConsensusTask(topology="ring", failure_count=2, condition=condition)'''
          if old in s: s=s.replace(old,new,1)
          insert='''\n\ndef test_dgaf_consensus_task_requires_explicit_premise_checker():\n    with pytest.raises(ValueError, match="explicit P-35 premise_check_fn"):\n        ConsensusTask(topology="ring", failure_count=2, condition="dgaf")\n\n\ndef test_dgaf_consensus_task_is_deterministic_across_attempts_with_explicit_checker():\n    task = ConsensusTask(topology="ring", failure_count=2, condition="dgaf", premise_check_fn=allow_all_premises)\n    first = task.run_detailed(seed=20260817, attempt=1)\n    second = task.run_detailed(seed=20260817, attempt=2)\n    assert first.trial_key == second.trial_key\n    assert first.failure_nodes == second.failure_nodes\n    assert first.initial_values == second.initial_values\n    assert first.final_values == second.final_values\n    assert first.final_std == second.final_std\n    assert first.topology_fingerprint == second.topology_fingerprint\n    assert first.iterations_completed == second.iterations_completed\n    assert first.attempt_status is second.attempt_status\n'''
          marker='def test_consensus_task_is_deterministic_across_attempts():'
          if 'test_dgaf_consensus_task_requires_explicit_premise_checker' not in s: s=s.replace(marker,insert+'\n\n'+marker,1)
          old='''    for condition in ("null", "simple", "static", "dgaf"):\n        task = ConsensusTask(topology="ring", failure_count=0, condition=condition)\n        assert task.condition == condition'''
          new='''    for condition in ("null", "simple", "static"):\n        task = ConsensusTask(topology="ring", failure_count=0, condition=condition)\n        assert task.condition == condition\n    task = ConsensusTask(topology="ring", failure_count=0, condition="dgaf", premise_check_fn=allow_all_premises)\n    assert task.condition == "dgaf"'''
          if old in s: s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('experiments/pdmal_pilot/test_governance_trace.py'); s=p.read_text()
          s=s.replace('from task_engine import AttemptStatus, ConsensusTask', 'from task_engine import AttemptStatus, ConsensusTask\n\n\ndef allow_all_premises(_text, _invariant) -> bool:\n    return True',1)
          s=s.replace('ConsensusTask(topology="ring", failure_count=0, condition="dgaf")', 'ConsensusTask(topology="ring", failure_count=0, condition="dgaf", premise_check_fn=allow_all_premises)',1)
          p.write_text(s)

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/pdmal_pilot/runtime_characterization.py experiments/pdmal_pilot/test_dgaf_tgl_adapter.py experiments/pdmal_pilot/test_task_engine.py experiments/pdmal_pilot/test_governance_trace.py
          git commit -m 'test: align P-35 dependents with explicit checker'
          git push
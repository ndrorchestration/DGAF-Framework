name: P2 Live Runtime Verification

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  p2-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      # Candidate-bound runtime verification. Update these together with every
      # candidate deployment; never reuse historical runtime evidence.
      P2_BASE_URL: https://dynamicgovernanceagenticformation-8j8u5mw2f-ndrorchestration.vercel.app
      EXPECTED_COMMIT: 94fb6fdff64f2919d35938c5b1cb506625cf1139
      EXPECTED_DEPLOYMENT_ID: dpl_G5uLJy8gibitJ6xRbQNfn3PYVm5F
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Verify bypass secret is available
        run: |
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "VERCEL_AUTOMATION_BYPASS_SECRET is not configured; refusing to test a protected deployment without authentication bypass."
            exit 1
          fi
          echo "Vercel automation bypass secret is present (value withheld)."

      - name: Verify live deployment provenance and execute five-case matrix
        run: |
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request

          base = os.environ['P2_BASE_URL'].rstrip('/')
          endpoint = base + '/api/orchestrate'
          bypass = os.environ['VERCEL_AUTOMATION_BYPASS_SECRET']
          expected = {
              'valid_missing_audit': (503, 'BLOCKED'),
              'invalid_body_shape': (400, 'REJECT'),
              'confidence_out_of_range': (400, 'REJECT'),
              'invalid_turn': (400, 'REJECT'),
              'malformed_json': (400, None),
          }
          cases = [
              ('valid_missing_audit', b'{"mandate":"P2 live verification","turn":13}'),
              ('invalid_body_shape', b'[]'),
              ('confidence_out_of_range', b'{"mandate":"P2 live verification","confidence":2.0}'),
              ('invalid_turn', b'{"mandate":"P2 live verification","turn":-1}'),
              ('malformed_json', b'{'),
          ]

          results = []
          for name, payload in cases:
              req = urllib.request.Request(
                  endpoint,
                  data=payload,
                  method='POST',
                  headers={
                      'Content-Type': 'application/json',
                      'Accept': 'application/json',
                      'x-vercel-protection-bypass': bypass,
                  },
              )
              started = time.time()
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      status = r.status
                      body = r.read().decode('utf-8', 'replace')
              except urllib.error.HTTPError as e:
                  status = e.code
                  body = e.read().decode('utf-8', 'replace')
              elapsed = time.time() - started
              try:
                  parsed = json.loads(body)
              except json.JSONDecodeError:
                  parsed = None

              decision = parsed.get('decision') if isinstance(parsed, dict) else None
              evidence_status = None
              if isinstance(parsed, dict) and isinstance(parsed.get('evidence'), dict):
                  evidence_status = parsed['evidence'].get('status')

              exp_status, exp_decision = expected[name]
              passed = status == exp_status and decision == exp_decision
              row = {
                  'case': name,
                  'expected_http': exp_status,
                  'expected_decision': exp_decision,
                  'actual_http': status,
                  'actual_decision': decision,
                  'evidence_status': evidence_status,
                  'elapsed_seconds': round(elapsed, 3),
                  'response_body': parsed if parsed is not None else body,
                  'pass': passed,
              }
              print(json.dumps(row, sort_keys=True))
              results.append(row)

          out = {
              'source_commit': os.environ['EXPECTED_COMMIT'],
              'deployment_id': os.environ['EXPECTED_DEPLOYMENT_ID'],
              'deployment_url': base,
              'endpoint': endpoint,
              'timestamp_epoch': time.time(),
              'cases': results,
              'all_pass': all(r['pass'] for r in results),
              'spec_revision': 'P2-2026-08-18-runtime-contract-v2',
          }
          with open('p2-runtime-verification.json', 'w', encoding='utf-8') as f:
              json.dump(out, f, indent=2, sort_keys=True)
          if not out['all_pass']:
              raise SystemExit(1)
          PY

      - name: Upload P2 provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-runtime-verification-94fb6fd
          path: p2-runtime-verification.json
          if-no-files-found: error
          retention-days: 14

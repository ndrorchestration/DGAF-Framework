name: P2 Live Runtime Verification

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Exact Git SHA of the candidate being verified'
        required: true
        type: string
      deployment_id:
        description: 'Exact Vercel deployment ID for candidate_sha'
        required: true
        type: string
      base_url:
        description: 'Exact deployment URL for deployment_id'
        required: true
        type: string

jobs:
  p2-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      EXPECTED_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
      P2_BASE_URL: ${{ inputs.base_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Verify candidate identity
        run: |
          test "${#CANDIDATE_SHA}" -eq 40
          echo "$CANDIDATE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test -n "$EXPECTED_DEPLOYMENT_ID"
          test -n "$P2_BASE_URL"

      - name: Verify bypass secret is available
        run: |
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "VERCEL_AUTOMATION_BYPASS_SECRET is not configured; refusing to test a protected deployment without authentication bypass."
            exit 1
          fi
          echo "Vercel automation bypass secret is present (value withheld)."

      - name: Execute five-case runtime matrix
        run: |
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request

          base = os.environ['P2_BASE_URL'].rstrip('/')
          endpoint = base + '/api/orchestrate'
          bypass = os.environ['VERCEL_AUTOMATION_BYPASS_SECRET']
          expected = {
              'valid_missing_audit': (503, 'BLOCKED'),
              'invalid_body_shape': (400, 'REJECT'),
              'confidence_out_of_range': (400, 'REJECT'),
              'invalid_turn': (400, 'REJECT'),
              'malformed_json': (400, None),
          }
          cases = [
              ('valid_missing_audit', b'{"mandate":"P2 live verification","turn":13}'),
              ('invalid_body_shape', b'[]'),
              ('confidence_out_of_range', b'{"mandate":"P2 live verification","confidence":2.0}'),
              ('invalid_turn', b'{"mandate":"P2 live verification","turn":-1}'),
              ('malformed_json', b'{'),
          ]
          results = []
          for name, payload in cases:
              req = urllib.request.Request(endpoint, data=payload, method='POST', headers={
                  'Content-Type': 'application/json', 'Accept': 'application/json',
                  'x-vercel-protection-bypass': bypass,
              })
              started = time.time()
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      status = r.status; body = r.read().decode('utf-8', 'replace')
              except urllib.error.HTTPError as e:
                  status = e.code; body = e.read().decode('utf-8', 'replace')
              try: parsed = json.loads(body)
              except json.JSONDecodeError: parsed = None
              decision = parsed.get('decision') if isinstance(parsed, dict) else None
              evidence_status = parsed.get('evidence', {}).get('status') if isinstance(parsed, dict) and isinstance(parsed.get('evidence'), dict) else None
              exp_status, exp_decision = expected[name]
              passed = status == exp_status and decision == exp_decision
              results.append({'case': name, 'expected_http': exp_status, 'expected_decision': exp_decision,
                              'actual_http': status, 'actual_decision': decision, 'evidence_status': evidence_status,
                              'elapsed_seconds': round(time.time() - started, 3), 'pass': passed,
                              'response_body': parsed if parsed is not None else body})
              print(json.dumps(results[-1], sort_keys=True))
          out = {'evidence_class': 'P2_RUNTIME_EXECUTION', 'source_commit': os.environ['CANDIDATE_SHA'],
                 'deployment_id': os.environ['EXPECTED_DEPLOYMENT_ID'], 'deployment_url': base, 'endpoint': endpoint,
                 'timestamp_epoch': time.time(), 'cases': results, 'all_pass': all(r['pass'] for r in results),
                 'spec_revision': 'P2-2026-08-18-runtime-contract-v2'}
          with open('p2-runtime-verification.json', 'w', encoding='utf-8') as f: json.dump(out, f, indent=2, sort_keys=True)
          if not out['all_pass']: raise SystemExit(1)
          PY

      - name: Upload P2 provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-runtime-verification-${{ inputs.candidate_sha }}
          path: p2-runtime-verification.json
          if-no-files-found: error
          retention-days: 14

name: Mode T External Result Intake

on:
  pull_request:
    paths:
      - '.github/workflows/mode-t-external-result-intake.yml'
      - 'docs/governance/MODE_T_EXTERNAL_RESULT_INTAKE_CONTRACT_2026-09-07.md'
      - 'docs/governance/mode_t_external_result_intake_template.json'
      - 'scripts/validate_mode_t_external_result_intake.py'
      - 'tests/test_mode_t_external_result_intake.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  intake-integrity:
    name: Source-bound unverified intake preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EVIDENCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_SHA"

      - name: Set up Python 3.12.0
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.0'
          check-latest: false

      - name: Run intake contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_mode_t_external_result_intake -v

      - name: Verify source binding and non-promotion state
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_mode_t_external_result_intake.py

      - name: Report bounded interpretation
        shell: bash
        run: |
          set -euo pipefail
          echo 'PASS: external result intake is source-bound and non-promoting.'
          echo 'An external reported PASS remains unverified input until separate retrieval, reverification, and governance adjudication.'
          echo 'Final candidate NOT DESIGNATED / P4 OPEN / PRE-FREEZE / FAIL-CLOSED / NOT AUTHORIZED / N=0 remains controlling.'

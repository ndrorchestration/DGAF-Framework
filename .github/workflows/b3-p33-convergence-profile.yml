name: B3 P-33 Persistent Convergence Profile

on:
  pull_request:
    paths:
      - 'components/ensemble_v17.py'
      - 'experiments/pdmal_pilot/b3_p33_convergence_profile.py'
      - 'experiments/pdmal_pilot/test_b3_p33_convergence_profile.py'
      - 'docs/governance/DGAF_P33_GRAPH_CONVERGENCE_MONITOR_PROFILE_V1.json'
      - 'scripts/validate_b3_p33_convergence_profile.py'
      - '.github/workflows/b3-p33-convergence-profile.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.0'
      - name: Install focused test dependency
        run: python -m pip install pytest==9.0.3
      - name: Validate source-bound profile
        run: python scripts/validate_b3_p33_convergence_profile.py
      - name: Exercise persistent P-33 semantics
        run: python -m pytest experiments/pdmal_pilot/test_b3_p33_convergence_profile.py -q

name: Track A P-30 11Q Qualification

on:
  pull_request:
    paths:
      - '.github/workflows/track-a-p30-11q-qualification.yml'
      - 'docs/qa/APOGEE_11Q_PDMAL_TOPOLOGY_ROBUSTNESS_PROFILE_V1_S078.json'
      - 'scripts/validate_track_a_p30_11q_qualification.py'
      - 'docs/governance/PDMAL_TOPOLOGY_ROBUSTNESS_PROFILE_V1.json'
      - 'docs/governance/PDMAL_TOPOLOGY_ROBUSTNESS_PROFILE_V1.md'
      - 'experiments/pdmal_pilot/topology_robustness_profile.py'
      - 'experiments/pdmal_pilot/test_topology_robustness_profile.py'
      - '.github/workflows/track-a-topology-robustness-profile.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4

      - name: Set up Python 3.12.0
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.0'

      - name: Validate source-bound P-30 11Q qualification
        run: python scripts/validate_track_a_p30_11q_qualification.py

      - name: Prove qualification cannot authorize empirical execution
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('docs/qa/APOGEE_11Q_PDMAL_TOPOLOGY_ROBUSTNESS_PROFILE_V1_S078.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d['empirical_evidence'] is False
          assert d['scientific_n_increment'] == 0
          assert d['independent_verification'] is False
          assert d['next_gate']['required'] == 'TRACK_A_NONEMPIRICAL_MATRIX_ADJUDICATION'
          assert d['next_gate']['empirical_execution'] == 'NOT_AUTHORIZED'
          assert d['next_gate']['high_assurance_changed'] is False
          print('TRACK_A_11Q_NONEMPIRICAL_BOUNDARY_PASS')
          PY

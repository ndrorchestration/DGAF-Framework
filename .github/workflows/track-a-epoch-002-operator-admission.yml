name: Track A Epoch 002 Operator Admission

on:
  pull_request:
    paths:
      - '.github/workflows/track-a-epoch-002-operator-admission.yml'
      - 'requirements-ci.txt'
      - 'requirements-ci-py312-ubuntu2404-x64.lock'
      - 'scripts/bootstrap_ci_pip.sh'
      - 'tests/test_ci_lock_contract.py'
      - 'docs/experiment/TRACK_A_EPOCH_002_OPERATOR_COLLECTION_ADMISSION_SCHEMA.json'
      - 'docs/experiment/TRACK_A_EPOCH_002_OPERATOR_COLLECTION_ADMISSION_PROCEDURE.md'
      - 'scripts/prepare_track_a_epoch_002_operator_collection_admission.py'
      - 'scripts/validate_track_a_epoch_002_operator_collection_admission.py'
      - 'tests/test_track_a_epoch_002_operator_admission_preparer.py'
      - 'tests/test_track_a_epoch_002_operator_codespace_admission.py'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Operator Codespace admission contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: '3.12.0'
      - name: Bootstrap exact pip resolver
        run: bash scripts/bootstrap_ci_pip.sh
      - name: Install hash-locked CI-only validation dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          --require-hashes
          --only-binary=:all:
          -r requirements-ci-py312-ubuntu2404-x64.lock
      - run: >-
          python -m pytest
          tests/test_track_a_epoch_002_operator_codespace_admission.py
          tests/test_track_a_epoch_002_operator_admission_preparer.py
          -q

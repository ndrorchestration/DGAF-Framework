name: P4 Mode T Sigstore Verifier Contract

on:
  pull_request:
    paths:
      - '.github/workflows/p4-mode-t-sigstore-verifier.yml'
      - 'experiments/pdmal_pilot/mode_t_retention_contract.py'
      - 'experiments/pdmal_pilot/test_mode_t_retention_contract.py'
      - 'experiments/pdmal_pilot/mode_t_sigstore_verifier.py'
      - 'experiments/pdmal_pilot/test_mode_t_sigstore_verifier.py'
      - 'docs/governance/P4_MODE_T_SIGSTORE_VERIFIER_2026-09-06.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  COSIGN_VERSION: v3.1.3
  COSIGN_LINUX_AMD64_SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71

jobs:
  sigstore-verifier-contract:
    name: Side-effect-free verifier boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EVIDENCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_SHA"

      - name: Set up Python 3.12.0
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.0'
          check-latest: false

      - name: Run verifier and retention contract tests
        shell: bash
        run: |
          set -euo pipefail
          cd experiments/pdmal_pilot
          python test_mode_t_retention_contract.py -v
          python test_mode_t_sigstore_verifier.py -v

      - name: Download exact reviewed Cosign v3.1.3 binary and public bundle
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}"
          curl --fail --location --retry 3 --output cosign "${base}/cosign-linux-amd64"
          curl --fail --location --retry 3 --output cosign.sigstore.json "${base}/cosign-linux-amd64.sigstore.json"
          printf '%s  %s\n' "$COSIGN_LINUX_AMD64_SHA256" cosign | sha256sum --check --strict
          chmod 0755 cosign

      - name: Build upstream smoke-only TrustedRoot fixture
        shell: bash
        run: |
          set -euo pipefail
          ./cosign trusted-root create --with-default-services > upstream-trusted-root.json
          test -s upstream-trusted-root.json
          python -m json.tool upstream-trusted-root.json >/dev/null
          sha256sum upstream-trusted-root.json
          echo 'This dynamically acquired TrustedRoot is used only for the public upstream verifier-mechanics smoke test.'
          echo 'It is NOT an independently approved or frozen DGAF production TrustedRoot.'

      - name: Real read-only cryptographic smoke test on official upstream fixture
        shell: bash
        run: |
          set -euo pipefail
          ./cosign verify-blob cosign \
            --bundle cosign.sigstore.json \
            --trusted-root upstream-trusted-root.json \
            --certificate-identity keyless@projectsigstore.iam.gserviceaccount.com \
            --certificate-oidc-issuer https://accounts.google.com

          cp cosign cosign.tampered
          printf '\0' >> cosign.tampered
          if ./cosign verify-blob cosign.tampered \
            --bundle cosign.sigstore.json \
            --trusted-root upstream-trusted-root.json \
            --certificate-identity keyless@projectsigstore.iam.gserviceaccount.com \
            --certificate-oidc-issuer https://accounts.google.com; then
            echo 'ERROR: tampered upstream fixture unexpectedly verified' >&2
            exit 1
          fi
          echo 'PASS: official upstream bundle verified with explicit TrustedRoot; one-byte tamper was rejected.'

      - name: Enforce no signing, OIDC request, or external-write path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('experiments/pdmal_pilot/mode_t_sigstore_verifier.py').read_text(encoding='utf-8')
          tests = Path('experiments/pdmal_pilot/test_mode_t_sigstore_verifier.py').read_text(encoding='utf-8')
          workflow = Path('.github/workflows/p4-mode-t-sigstore-verifier.yml').read_text(encoding='utf-8')

          required = (
              'verify_retention_record_with_sigstore',
              '_normalize_verified_bundle',
              'application/vnd.dev.sigstore.bundle.v0.3+json',
              'reviewed retention evidence requires a transparency-log inclusion proof',
              'EXPECTED_COSIGN_LINUX_AMD64_SHA256',
              'transparency_log_id_key_id',
              'trusted_root_explicit_and_digest_bound',
              'trusted_root_independently_approved',
              '"cryptographic_inclusion_verified_by_this_module": True',
              '"external_write_performed_by_verifier": False',
              '"oidc_token_requested_by_verifier": False',
              '"real_external_retention_established": False',
              '"temporal_order_verified": False',
              '"pilot_authorized": False',
              '"empirical_n": 0',
          )
          for marker in required:
              if marker not in source:
                  raise SystemExit(f'missing verifier-boundary marker: {marker}')

          if 'def normalize_verified_bundle(' in source:
              raise SystemExit('public normalize-without-crypto entry point reintroduced')
          if 'expected_cosign_sha256' in source:
              raise SystemExit('caller-selectable Cosign digest reintroduced')
          if '--trusted-root' not in source or '--trusted-root' not in workflow:
              raise SystemExit('explicit TrustedRoot path is not enforced')

          test_markers = (
              'test_public_api_has_no_normalize_without_crypto_entry',
              'test_rejects_promise_only_or_missing_inclusion_proof',
              'test_rejects_legacy_or_old_standardized_bundle_media_types',
              'test_rejects_noncanonical_uint64_encodings',
              'test_rejects_trusted_root_tamper_before_execution',
              'test_rejects_missing_trusted_root_before_execution',
              'test_rejects_invalid_json_trusted_root_before_execution',
          )
          for marker in test_markers:
              if marker not in tests:
                  raise SystemExit(f'missing adversarial verifier test: {marker}')

          forbidden = (
              'sign-' + 'blob',
              'id-token:' + ' write',
              'google-github-actions/' + 'auth',
              'PDMAL_PILOT_AUTHORIZED' + '=1',
              'PDMAL_PROTOCOL_FROZEN' + '=1',
          )
          combined = source + workflow
          for marker in forbidden:
              if marker in combined:
                  raise SystemExit(f'forbidden side-effect/promotion marker: {marker}')
          PY

      - name: Report bounded interpretation
        shell: bash
        run: |
          echo 'PASS scope: DGAF verifier API/negative controls plus a real read-only cryptographic smoke test on the official Cosign v3.1.3 release bundle using an explicit upstream smoke-only TrustedRoot.'
          echo 'The upstream fixture demonstrates verifier mechanics only; it is not a DGAF Mode-T retention record and its dynamically acquired root is not DGAF-approved trust policy.'
          echo 'No signing, OIDC token request, Rekor upload, DGAF external-retention write, time-order proof, authorization, or empirical execution occurred.'
          echo 'PRE-FREEZE / FAIL-CLOSED / NOT AUTHORIZED / N=0 remains controlling.'

name: AOSS v0.6 Stage A Collection Authorization

on:
  pull_request:
    paths:
      - '.github/workflows/aoss-v0-6-stage-a-collection-authorization.yml'
      - 'requirements-ci.txt'
      - 'requirements-ci-py312-ubuntu2404-x64.lock'
      - 'scripts/bootstrap_ci_pip.sh'
      - 'tests/test_ci_lock_contract.py'
      - 'requirements-ci.txt'
      - 'requirements-ci-py312-ubuntu2404-x64.lock'
      - 'scripts/bootstrap_ci_pip.sh'
      - 'tests/test_ci_lock_contract.py'
      - 'schemas/aoss_v0_6_stage_a_collection_authorization.schema.json'
      - 'schemas/aoss_v0_6_stage_a_precollection_receipt.schema.json'
      - 'scripts/validate_aoss_v0_6_stage_a_collection_authorization.py'
      - 'tests/test_aoss_v0_6_stage_a_collection_authorization.py'
      - 'docs/research/AOSS_V0_6_STAGE_A_COLLECTION_AUTHORIZATION.md'
      - 'registry/aoss_v0_6_stage_a_collection_authorization_v1.json'
      - 'registry/aoss_v0_6_stage_a_precollection_receipt_v1.json'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/aoss-v0-6-stage-a-collection-authorization.yml'
      - 'schemas/aoss_v0_6_stage_a_collection_authorization.schema.json'
      - 'schemas/aoss_v0_6_stage_a_precollection_receipt.schema.json'
      - 'scripts/validate_aoss_v0_6_stage_a_collection_authorization.py'
      - 'tests/test_aoss_v0_6_stage_a_collection_authorization.py'
      - 'docs/research/AOSS_V0_6_STAGE_A_COLLECTION_AUTHORIZATION.md'
      - 'registry/aoss_v0_6_stage_a_collection_authorization_v1.json'
      - 'registry/aoss_v0_6_stage_a_precollection_receipt_v1.json'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Stage A collection authorization
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact evaluated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact checkout identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: '3.12.3'

      - name: Bootstrap exact pip resolver
        run: bash scripts/bootstrap_ci_pip.sh

      - name: Install hash-locked validation dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          --require-hashes
          --only-binary=:all:
          -r requirements-ci-py312-ubuntu2404-x64.lock

      - name: Compile validator
        run: python -m py_compile scripts/validate_aoss_v0_6_stage_a_collection_authorization.py

      - name: Validate pull-request transition
        if: ${{ github.event_name == 'pull_request' }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          AUTH_REL='registry/aoss_v0_6_stage_a_collection_authorization_v1.json'
          RECEIPT_REL='registry/aoss_v0_6_stage_a_precollection_receipt_v1.json'
          CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          AUTH_CHANGED=false
          RECEIPT_CHANGED=false

          while IFS= read -r path; do
            case "$path" in
              "$AUTH_REL") AUTH_CHANGED=true ;;
              "$RECEIPT_REL") RECEIPT_CHANGED=true ;;
            esac
          done <<< "$CHANGED"

          if [ "$AUTH_CHANGED" = true ] && [ "$RECEIPT_CHANGED" = true ]; then
            echo "FAIL: authorization and precollection receipt cannot change in one PR" >&2
            exit 1
          elif [ "$RECEIPT_CHANGED" = true ]; then
            python scripts/validate_aoss_v0_6_stage_a_collection_authorization.py --validate-precollection-event "$HEAD_SHA" --authorization-ref "$BASE_SHA"
          elif [ "$AUTH_CHANGED" = true ]; then
            python scripts/validate_aoss_v0_6_stage_a_collection_authorization.py --validate-authorization-event "$HEAD_SHA" --accepted-parent "$BASE_SHA"
          else
            python scripts/validate_aoss_v0_6_stage_a_collection_authorization.py --validate-state
            python -m pytest -q tests/test_aoss_v0_6_stage_a_collection_authorization.py
          fi

      - name: Validate accepted repository state
        if: ${{ github.event_name == 'push' }}
        run: python scripts/validate_aoss_v0_6_stage_a_collection_authorization.py --validate-state

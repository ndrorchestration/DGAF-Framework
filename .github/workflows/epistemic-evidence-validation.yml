name: Epistemic Evidence Validation

on:
  push:
  pull_request:

jobs:
  evidence-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install epistemic validation dependencies
        run: python -m pip install -r requirements-epistemic.txt
      - name: Validate Evidence Cards
        run: pytest -q tests/test_evidence_card_schema.py

name: Epistemic Evidence Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  evidence-validation:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/experiments/pdmal_topology
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install epistemic and experiment dependencies
        run: |
          # These source requirement files are not a complete hash-pinned lock.
          # Do not claim this installation as E2b evidence.
          python -m pip install -r requirements-epistemic.txt -r experiments/pdmal_topology/requirements.txt
          python -m pip check

      - name: Record E2b dependency-provenance boundary
        run: |
          echo 'E2b status: NOT PASS'
          echo 'Reason: requirements-epistemic.txt and pdmal_topology/requirements.txt are not a complete immutable transitive hash lock.'
          echo 'This workflow validates epistemic functionality only; E2b evidence is emitted separately by Governance CI.'

      - name: Validate Evidence Cards
        run: |
          pytest -q tests/test_evidence_card_schema.py

      - name: Verify PDMAL structural harness and manifest
        working-directory: experiments/pdmal_topology
        run: |
          pytest -q test_manifest.py test_graph_harness.py test_experiment.py

      - name: Execute instrumentation-only smoke test
        working-directory: experiments/pdmal_topology
        run: |
          python - <<'PY'
          from experiment import run_structural_pilot
          rows = run_structural_pilot(1)
          assert len(rows) == 45
          print('instrumentation smoke test: 45 raw observations generated; no inferential analysis performed')
          PY

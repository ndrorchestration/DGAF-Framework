name: UI Command Center Validation

on:
  pull_request:
    paths:
      - 'app/**'
      - 'pages/api/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ui-command-center-validation.yml'
      - 'docs/superpowers/specs/**'
      - 'docs/superpowers/plans/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run UI semantic and contract tests
        run: npm run test:ui
      - name: Build production application
        run: npm run build

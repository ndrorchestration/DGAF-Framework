name: SBCF OpenShell Baseline Reproduction

on:
  push:
    branches: ['research/sbcf-openshell-repro-20261019']
    paths:
      - '.github/workflows/sbcf-openshell-baseline-reproduction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce-openshell-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout DGAF evidence wrapper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Checkout pinned OpenShell source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: NVIDIA/OpenShell
          ref: 5a7728c304b5528e954e9ae900cf21f84e1a12b1
          path: openshell-upstream
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Assert exact upstream identity and runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C openshell-upstream rev-parse HEAD)" = "5a7728c304b5528e954e9ae900cf21f84e1a12b1"
          test "$(git -C openshell-upstream describe --tags --exact-match)" = "v0.1.4"
          git -C openshell-upstream status --porcelain
          uname -a
          docker version
          docker info

      - name: Install exact OpenShell release
        shell: bash
        run: |
          set -euo pipefail
          cd openshell-upstream
          OPENSHELL_VERSION=v0.1.4 bash ./install.sh
          command -v openshell
          openshell --version

      - name: Build documented curl workload prerequisite
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/Dockerfile.sbcf-openshell <<'EOF'
          FROM ubuntu:24.04
          RUN apt-get update \
              && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends curl ca-certificates \
              && rm -rf /var/lib/apt/lists/*
          EOF
          docker build -t sbcf-openshell-curl:local -f /tmp/Dockerfile.sbcf-openshell /tmp
          docker run --rm sbcf-openshell-curl:local /usr/bin/curl --version

      - name: Reproduce documented network-policy enforcement
        shell: bash
        run: |
          set -euo pipefail
          SANDBOX=policy-repro
          SSH_CONFIG="$(mktemp)"
          cleanup() {
            openshell sandbox delete "$SANDBOX" >/dev/null 2>&1 || true
            rm -f "$SSH_CONFIG"
          }
          trap cleanup EXIT

          openshell sandbox create \
            --name "$SANDBOX" \
            --from sbcf-openshell-curl:local \
            --no-auto-providers \
            --no-tty \
            -- echo 'sandbox ready'

          openshell sandbox ssh-config "$SANDBOX" > "$SSH_CONFIG"
          SSH_HOST="$(awk '/^Host / { print $2; exit }' "$SSH_CONFIG")"
          for _ in $(seq 1 20); do
            if ssh -F "$SSH_CONFIG" "$SSH_HOST" true >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          ssh -F "$SSH_CONFIG" "$SSH_HOST" true

          set +e
          INITIAL="$(ssh -F "$SSH_CONFIG" "$SSH_HOST" curl -sSf --max-time 8 https://api.github.com/zen 2>&1)"
          INITIAL_RC=$?
          set -e
          test "$INITIAL_RC" -ne 0
          printf '%s\n' "$INITIAL"
          sleep 2
          INITIAL_LOGS="$(openshell logs "$SANDBOX" --since 2m --source sandbox -n 30 2>&1)"
          printf '%s\n' "$INITIAL_LOGS"
          printf '%s\n' "$INITIAL_LOGS" | grep -E 'NET:OPEN .*DENIED .*api\.github\.com:443'

          openshell policy update "$SANDBOX" \
            --rule-name github_api \
            --binary /usr/bin/curl \
            --add-endpoint api.github.com:443:read-only:rest:enforce \
            --wait

          GET_BODY="$(ssh -F "$SSH_CONFIG" "$SSH_HOST" curl -sSf --max-time 12 https://api.github.com/zen)"
          test -n "$GET_BODY"
          printf 'allowed_get=%s\n' "$GET_BODY"

          set +e
          OTHER="$(ssh -F "$SSH_CONFIG" "$SSH_HOST" curl -sSf --max-time 8 https://example.com/ 2>&1)"
          OTHER_RC=$?
          set -e
          test "$OTHER_RC" -ne 0
          printf '%s\n' "$OTHER"

          POST_BODY="$(ssh -F "$SSH_CONFIG" "$SSH_HOST" curl -sS --max-time 12 -X POST \
            https://api.github.com/repos/octocat/hello-world/issues \
            -d sbcf_reproduction=1)"
          printf '%s\n' "$POST_BODY"
          printf '%s\n' "$POST_BODY" | grep -q 'policy_denied'

          sleep 2
          FINAL_LOGS="$(openshell logs "$SANDBOX" --since 2m --source sandbox -n 60 2>&1)"
          printf '%s\n' "$FINAL_LOGS"
          printf '%s\n' "$FINAL_LOGS" | grep -E 'HTTP:POST .*DENIED .*api\.github\.com:443'

      - name: Record bounded evidence statement
        if: always()
        shell: bash
        run: |
          {
            echo '### SBCF external comparator reproduction'
            echo 'Upstream: NVIDIA/OpenShell'
            echo 'Pinned commit: 5a7728c304b5528e954e9ae900cf21f84e1a12b1 (v0.1.4)'
            echo 'Reproduces the documented first-network-policy sequence on ubuntu-24.04 with Docker and a user-owned curl workload image, as required by the tutorial prerequisites.'
            echo 'Assertions cover default-deny api.github.com egress, a live read-only api.github.com rule, allowed GET, unrelated-host denial, blocked POST, and policy logs.'
            echo 'A passing demo is bounded OpenShell enforcement evidence only. It does not establish SBCF parity, comparative efficacy, independent validation, or production authorization.'
          } >> "$GITHUB_STEP_SUMMARY"

name: PDMAL Solo Pilot Authority Guard

on:
  pull_request:
    paths:
      - '.github/workflows/pdmal-solo-pilot-execution.yml'
      - 'docs/GOVERNANCE/SOLO_PILOT_TRACK_V0.7.6.json'
      - 'docs/GOVERNANCE/SOLO_EPOCH_AUTHORITY_V1.json'
      - 'docs/GOVERNANCE/PILOT_BLOCKER_MANIFEST_V0.7.6.json'
      - 'scripts/validate_solo_pilot_track.py'
      - 'scripts/validate_pilot_blocker_manifest.py'
      - 'experiments/pdmal_pilot/run_pilot.py'
      - 'experiments/pdmal_pilot/test_solo_pilot_track.py'

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12.0'

jobs:
  validate-solo-authority-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r experiments/pdmal_pilot/requirements-full-lock.txt

      - name: Validate Solo track and repository-bound authority
        run: python scripts/validate_solo_pilot_track.py --self-test

      - name: Validate split blocker manifest
        run: python scripts/validate_pilot_blocker_manifest.py --self-test

      - name: Run Solo fail-closed authorization tests
        env:
          PYTHONPATH: experiments/pdmal_pilot
        run: python -m pytest experiments/pdmal_pilot/test_solo_pilot_track.py -q

      - name: Prove generic Solo execution lane is retired
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/pdmal-solo-pilot-execution.yml').read_text(encoding='utf-8')
          # Construct forbidden markers so this guard does not match its own source text.
          forbidden = (
              'solo-pilot/' + 'run-*',
              'execute-' + 'solo-pilot:',
              'GRANTED_BY_' + 'DEVELOPER',
              'PDMAL_SOLO_PILOT_' + 'AUTHORIZED:',
          )
          for marker in forbidden:
              if marker in workflow:
                  raise SystemExit(f'generic Solo execution authority unexpectedly present: {marker}')

          authority = Path('docs/GOVERNANCE/SOLO_EPOCH_AUTHORITY_V1.json').read_text(encoding='utf-8')
          required = (
              '"status": "NOT_AUTHORIZED"',
              '"decision": "NOT_GRANTED"',
              '"authority_issue": 369',
              '"legacy_environment_only_authorization_permitted": false',
          )
          for marker in required:
              if marker not in authority:
                  raise SystemExit(f'missing fail-closed authority marker: {marker}')

          print('SOLO_AUTHORITY_GUARD_PASS: PR validation only; no empirical execution trigger')
          PY

      - name: Prove PR validation is non-empirical
        run: |
          test "${PDMAL_MODE:-}" != "solo_pilot"
          test "${PDMAL_PROTOCOL_FROZEN:-}" != "1"
          test "${PDMAL_SOLO_EPOCH_ID:-}" = ""
          echo 'NON_EMPIRICAL_SOLO_AUTHORITY_VALIDATION_PASS'

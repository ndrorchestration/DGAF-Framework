name: PDMAL Solo Pilot Execution

on:
  pull_request:
    paths:
      - '.github/workflows/pdmal-solo-pilot-execution.yml'
  push:
    branches:
      - 'solo-pilot/run-*'

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12.0'
  SOLO_SEEDS: '2'

jobs:
  validate-workflow-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r experiments/pdmal_pilot/requirements-full-lock.txt
      - name: Validate Solo Pilot governance contract
        run: python scripts/validate_solo_pilot_track.py --self-test
      - name: Validate split blocker manifest
        run: python scripts/validate_pilot_blocker_manifest.py --self-test
      - name: Run Solo Pilot fail-closed authorization tests
        env:
          PYTHONPATH: experiments/pdmal_pilot
        run: python -m pytest experiments/pdmal_pilot/test_solo_pilot_track.py -q
      - name: Prove PR validation is non-empirical
        run: |
          test "${PDMAL_MODE:-}" != "solo_pilot"
          test "${PDMAL_SOLO_PILOT_AUTHORIZED:-}" != "1"
          test "${PDMAL_PROTOCOL_FROZEN:-}" != "1"
          echo 'SOLO_WORKFLOW_CONTRACT_PASS: PR validation collected no empirical data'

  execute-solo-pilot:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact run commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact one-file run request commit
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")
          if [[ "${#changed[@]}" -ne 1 || "${changed[0]}" != "docs/experiment/solo_runs/SOLO_RUN_REQUEST.json" ]]; then
            printf 'Solo execution prohibited: run commit must change only SOLO_RUN_REQUEST.json; changed=%s\n' "${changed[*]:-none}" >&2
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('docs/experiment/solo_runs/SOLO_RUN_REQUEST.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          expected = {
              'record_type': 'DGAF_PDMAL_SOLO_PILOT_RUN_REQUEST',
              'schema_version': 1,
              'protocol_version': '0.7.6',
              'execution_mode': 'solo_pilot',
              'authorization': 'GRANTED_BY_DEVELOPER',
              'limitations_acknowledged': True,
              'seeds': 2,
              'outcome_inspection_during_collection': False,
          }
          if d != expected:
              raise SystemExit(f'Solo execution prohibited: run request mismatch: {d!r}')
          print('SOLO_RUN_REQUEST_PASS')
          PY

      - name: Set up Python 3.12.0
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install hash-locked pilot dependencies
        run: python -m pip install --require-hashes -r experiments/pdmal_pilot/requirements-full-lock.txt

      - name: Generate protected blinding key and encrypt for later unblinding
        shell: bash
        run: |
          set -euo pipefail
          KEY="$(python - <<'PY'
          import secrets
          print(secrets.token_hex(32))
          PY
          )"
          echo "::add-mask::$KEY"
          printf '%s' "$KEY" > "$RUNNER_TEMP/pdmal_solo_blinding_key.txt"
          echo "PDMAL_BLINDING_KEY=$KEY" >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/unblinding_public_key.pem" <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA0pFB/O7KGw/ywp6gnQmN
          w12HqBZ0RGnZiY3ElV1eHcI0k+sID6JD6dgDiqwmDJE1xpmDXIOum3vwZ82pY/gu
          IeMIhu4bMPlQiEdxHCq6qBP5qQzvfTkdJm9qeTqr41iGh3kg6eGIkUtCjNgNH1Uj
          iDcloFPwW6IU2MGpfwsdG76cSZkWXnyu8gy5nOT4f+q1fFW3lEWIiHMHYeuWrGJe
          +LuANIooGo0FFKZSrZMjxYj9L3wJZQu9jauiIz1RuuN0gMYMxK1trpI0Y3pyFqaz
          5QzOIeiZfYppRSY5GkzPkdkLIMTiysR/dO0pLXzV5e1BQqf3BMY7N6yS/xTRk6ea
          Z1ojF+JFfEpn6VUM5qODHd6A9juyUGZWZUVo9T7Ix3YyqlTGk+dMPzGTaSEN0yWO
          6xWJIwshtnniX4eYcSl1gjki6G9FvmDHCfo3yQWb+uvhDzf5W1ks+ag/4qVcd/1t
          +oElS2A6QhcOY+Z3YabNZ7AZBS5U1ZgQij2MEvkhTojRAgMBAAE=
          -----END PUBLIC KEY-----
          PEM
          openssl pkeyutl -encrypt -pubin \
            -inkey "$RUNNER_TEMP/unblinding_public_key.pem" \
            -in "$RUNNER_TEMP/pdmal_solo_blinding_key.txt" \
            -out "$RUNNER_TEMP/pdmal_solo_blinding_key.enc" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          rm -f "$RUNNER_TEMP/pdmal_solo_blinding_key.txt"
          test -s "$RUNNER_TEMP/pdmal_solo_blinding_key.enc"

      - name: Execute blinded two-seed Solo Pilot
        env:
          PDMAL_MODE: solo_pilot
          PDMAL_PROTOCOL_FROZEN: '1'
          PDMAL_SOLO_PILOT_AUTHORIZED: '1'
          PDMAL_SOLO_LIMITATIONS_ACKNOWLEDGED: '1'
          PDMAL_FROZEN_COMMIT_SHA: ${{ github.sha }}
          PDMAL_ARCHIVE_ROOT: ${{ runner.temp }}/pdmal-solo-archive
          PYTHONPATH: experiments/pdmal_pilot
        run: |
          set -euo pipefail
          test "${PDMAL_PILOT_AUTHORIZED:-}" != '1'
          python experiments/pdmal_pilot/run_pilot.py \
            --seeds "$SOLO_SEEDS" \
            --output-dir "$RUNNER_TEMP/pdmal-solo-output"

      - name: Verify collection structure without inspecting outcomes
        env:
          PDMAL_FROZEN_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'pdmal-solo-output'
          seeds = sorted(root.glob('solo_pilot_seed_*.json'))
          if len(seeds) != 2:
              raise SystemExit(f'expected 2 seed artifacts, found {len(seeds)}')
          for p in seeds:
              if not p.with_suffix(p.suffix + '.sha256').is_file():
                  raise SystemExit(f'missing sidecar for {p.name}')
          summary_path = root / 'solo_pilot_summary.json'
          if not summary_path.is_file():
              raise SystemExit('missing solo_pilot_summary.json')
          summary = json.loads(summary_path.read_text(encoding='utf-8'))
          required = {
              'validation_track': 'SOLO_DEVELOPER',
              'independent_verification_status': 'NOT_ESTABLISHED_BY_RUNNER',
              'frozen_commit_sha': os.environ['PDMAL_FROZEN_COMMIT_SHA'],
              'total_seeds': 2,
              'trials_per_seed': 180,
              'total_trials': 360,
          }
          for key, value in required.items():
              if summary.get(key) != value:
                  raise SystemExit(f'summary mismatch for {key}: {summary.get(key)!r} != {value!r}')

          manifest = {
              'record_type': 'DGAF_PDMAL_SOLO_PILOT_COLLECTION_MANIFEST',
              'schema_version': 1,
              'source_commit_sha': os.environ['PDMAL_FROZEN_COMMIT_SHA'],
              'github_run_id': os.environ['GITHUB_RUN_ID'],
              'validation_track': 'SOLO_DEVELOPER',
              'independent_verification_status': 'NOT_ESTABLISHED_BY_RUNNER',
              'empirical_observations': 360,
              'outcomes_inspected_by_collection_workflow': False,
              'artifacts': {},
          }
          for p in sorted(root.iterdir()):
              if p.is_file():
                  manifest['artifacts'][p.name] = hashlib.sha256(p.read_bytes()).hexdigest()
          out = Path(os.environ['RUNNER_TEMP']) / 'SOLO_COLLECTION_MANIFEST.json'
          out.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print('SOLO_COLLECTION_STRUCTURE_PASS: 360 blinded empirical observations retained; outcomes not inspected')
          PY

      - name: Upload blinded Solo evidence
        uses: actions/upload-artifact@v4
        with:
          name: pdmal-solo-pilot-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/pdmal-solo-output/
            ${{ runner.temp }}/pdmal-solo-archive/
            ${{ runner.temp }}/SOLO_COLLECTION_MANIFEST.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload encrypted unblinding key
        uses: actions/upload-artifact@v4
        with:
          name: pdmal-solo-pilot-encrypted-key-${{ github.sha }}
          path: ${{ runner.temp }}/pdmal_solo_blinding_key.enc
          if-no-files-found: error
          retention-days: 90

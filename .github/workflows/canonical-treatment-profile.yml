name: Canonical Treatment Profile Validation

on:
  pull_request:
    paths:
      - 'docs/governance/CANONICAL_PDMAL_TREATMENT_PROFILE_CANDIDATE_V1.*'
      - 'experiments/pdmal_pilot/canonical_p30_qualification.py'
      - 'experiments/pdmal_pilot/test_canonical_p30_qualification.py'
      - 'scripts/validate_canonical_treatment_profile.py'
      - 'requirements-ci.txt'
      - 'requirements-ci-py312-ubuntu2404-x64.lock'
      - 'scripts/bootstrap_ci_pip.sh'
      - 'tests/test_ci_lock_contract.py'
      - '.github/workflows/canonical-treatment-profile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: '3.12'
      - name: Bootstrap exact pip resolver
        run: bash scripts/bootstrap_ci_pip.sh
      - name: Install hash-locked CI test dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          --require-hashes
          --only-binary=:all:
          -r requirements-ci-py312-ubuntu2404-x64.lock
      - name: Validate machine-readable profile boundary
        run: python scripts/validate_canonical_treatment_profile.py
      - name: Run qualification verifier tests
        env:
          PYTHONPATH: experiments/pdmal_pilot
        run: python -m pytest -q experiments/pdmal_pilot/test_canonical_p30_qualification.py
      - name: Prove no empirical execution lane exists in this workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/canonical-treatment-profile.yml').read_text()
          forbidden = (
              'run_' + 'pilot.py',
              'run_' + 'p30_variant.py',
              'solo-' + 'experiment/run-',
              'solo-' + 'p30-variant/run-',
          )
          assert not any(token in text for token in forbidden)
          print('PASS_NONEMPIRICAL_WORKFLOW')
          PY

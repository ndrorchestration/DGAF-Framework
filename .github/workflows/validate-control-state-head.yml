name: Validate Control-State HEAD Binding

on:
  push:
    branches: [main, 'chore/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-head-binding:
    name: Validate canonical control-state HEAD binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install YAML parser
        run: python -m pip install pyyaml -q
      - name: Validate control-state HEAD binding
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/validate_control_state_head.py

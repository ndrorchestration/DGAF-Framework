name: Governance Sweep

permissions:
  contents: read

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sweep:
    name: Governance Sweep
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact sweep checkout identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: '3.12.14'

      - name: Bootstrap exact pip resolver
        run: bash scripts/bootstrap_ci_pip.sh

      - name: Install hash-locked governance test dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          --require-hashes
          --only-binary=:all:
          -r requirements-ci-control-plane-py312-ubuntu2404-x64.lock

      - name: Compile governance components
        run: python -m compileall -q components

      - name: Verify required containment artifacts
        run: |
          test -f specs/DGAFContainment.tla
          test -f specs/DGAFContainment.cfg
          test -f components/ahg_recovery.py

      - name: Run deterministic AHG governance tests
        run: python -m pytest -q tests/test_ahg_conductor.py

      - name: Report evidence boundary
        run: |
          echo 'Governance sweep completed from executable repository checks.'
          echo 'This workflow does not claim external certification or empirical validation.'

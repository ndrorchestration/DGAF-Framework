name: Truth Layer Validation

on:
  push:
  pull_request:

jobs:
  truth-layer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install claim-surface parser dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Validate evidence registry, Evidence Card relationships, and source annotations
        run: python tools/validate_evidence_truth_layer.py

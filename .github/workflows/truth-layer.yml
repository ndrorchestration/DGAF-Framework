name: Truth Layer Validation

on:
  push:
  pull_request:

jobs:
  truth-layer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: '3.12'
      - name: Validate evidence registry and source annotations
        run: python tools/validate_evidence_truth_layer.py

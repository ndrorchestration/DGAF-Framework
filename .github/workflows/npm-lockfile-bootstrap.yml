name: NPM Lockfile Artifact Retention

on:
  pull_request:
    paths:
      - '.github/workflows/npm-lockfile-bootstrap.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SOURCE_BOOTSTRAP_SHA: 62a0c35db29420075e331d501fa281054ab63230
  SOURCE_RUN_ID: '34427479869'
  SOURCE_ARTIFACT_ID: '10133208552'
  EXPECTED_LOCK_SHA256: d4af9d2195f8b23975ce9389754e74ec4415c087ea633afc9a6b5146743503f6
  EXPECTED_PACKAGE_SHA256: 032252ce8dd07dba9f1ebb583e091fe41f70c07633dc1380c72339b6408a6204

jobs:
  retain-validated-lockfile:
    name: Retain exact validated npm lockfile
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify retention preconditions
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test ! -e package-lock.json
          test "$(sha256sum package.json | awk '{print $1}')" = "$EXPECTED_PACKAGE_SHA256"

      - name: Download exact bootstrap artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fLsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" \
            -o /tmp/npm-lockfile-bootstrap.zip
          mkdir /tmp/npm-lockfile-bootstrap
          unzip -q /tmp/npm-lockfile-bootstrap.zip -d /tmp/npm-lockfile-bootstrap

      - name: Verify retained artifact provenance and bytes
        run: |
          set -euo pipefail
          cd /tmp/npm-lockfile-bootstrap
          test "$(jq -r '.source_commit' npm-lockfile-bootstrap-metadata.json)" = "$SOURCE_BOOTSTRAP_SHA"
          test "$(jq -r '.workflow_run_id' npm-lockfile-bootstrap-metadata.json)" = "$SOURCE_RUN_ID"
          test "$(jq -r '.package_json_sha256' npm-lockfile-bootstrap-metadata.json)" = "$EXPECTED_PACKAGE_SHA256"
          test "$(jq -r '.package_lock_sha256' npm-lockfile-bootstrap-metadata.json)" = "$EXPECTED_LOCK_SHA256"
          sha256sum -c npm-lockfile-bootstrap-metadata.json.sha256
          test "$(sha256sum package-lock.json | awk '{print $1}')" = "$EXPECTED_LOCK_SHA256"
          cp package-lock.json "$GITHUB_WORKSPACE/package-lock.json"

      - name: Commit exact retained lockfile to PR branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          test -n "$HEAD_REF"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          git diff --cached --quiet && { echo 'No lockfile change to retain' >&2; exit 1; }
          git commit -m 'build: retain validated npm package lock'
          git push origin "HEAD:$HEAD_REF"

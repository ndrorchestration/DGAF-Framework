name: DGAF Completion Controller

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "PDMAL Instrumentation Dry Run"
      - "P9 Independent Verification"
    types: [completed]

jobs:
  completion-controller:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Test controller invariants
        env:
          GITHUB_SHA: ${{ env.CANDIDATE_SHA }}
        run: pytest -q tests/test_completion_controller.py
      - name: Retrieve exact-candidate evidence registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/evidence-registry
          runs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${CANDIDATE_SHA}&status=success&per_page=100")"
          registry_run_id="$(printf '%s' "$runs_json" | jq -r '.workflow_runs[] | select(.name == "PDMAL Instrumentation Dry Run") | .id' | head -n1)"
          if [ -n "$registry_run_id" ] && [ "$registry_run_id" != "null" ]; then
            if gh run download "$registry_run_id" --repo "$GITHUB_REPOSITORY" --name "dgaf-evidence-registry" --dir /tmp/evidence-registry; then
              test -f /tmp/evidence-registry/dgaf-evidence-registry.json
              echo "registry_source_run=$registry_run_id" >> "$GITHUB_STEP_SUMMARY"
            else
              registry_run_id=""
            fi
          fi
          if [ -z "$registry_run_id" ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          import os
          p = Path('/tmp/evidence-registry/dgaf-evidence-registry.json')
          predicates = []
          for pid, name, status in [
              ('P2','runtime verification','OPEN'),('P3','artifact contract','OPEN'),
              ('P4','blinding/security','OPEN'),('P5','provenance/reproducibility','OPEN'),
              ('P6','durable evidence custody','OPEN'),('P7','scientific decision','OPEN'),
              ('P8','analysis lock','FAIL_CLOSED'),('P9','independent verification','NOT_EXECUTED')]:
              predicates.append({'id':pid,'name':name,'required':True,'status':status,'candidate_sha':None,'notes':'No exact-candidate workflow evidence registry artifact was available to the controller.'})
          p.write_text(json.dumps({'schema_version':1,'candidate_sha':os.environ['CANDIDATE_SHA'],'controls':{'freeze_authorized':False,'pilot_authorized':False},'predicates':predicates},indent=2,sort_keys=True)+'\n')
          PY
            echo "registry_source=missing" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retrieve exact-candidate P9 evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          p9_dir=/tmp/p9-evidence
          mkdir -p "$p9_dir"
          runs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${CANDIDATE_SHA}&status=success&per_page=100")"
          p9_run_id="$(printf '%s' "$runs_json" | jq -r '.workflow_runs[] | select(.name == "P9 Independent Verification") | .id' | head -n1)"
          if [ -n "$p9_run_id" ] && [ "$p9_run_id" != "null" ]; then
            if gh run download "$p9_run_id" --repo "$GITHUB_REPOSITORY" --name "dgaf-p9-independent-evidence" --dir "$p9_dir"; then
              test -f "$p9_dir/p9-independent-evidence.json"
              test -f "$p9_dir/p9-independent-evidence.sha256"
              p9_payload_candidate="$(jq -r '.candidate_sha' "$p9_dir/p9-independent-evidence.json")"
              p9_payload_run="$(jq -r '.run_id' "$p9_dir/p9-independent-evidence.json")"
              test "$p9_payload_candidate" = "$CANDIDATE_SHA"
              test "$p9_payload_run" = "$p9_run_id"
              sha256sum -c <(sed "s#^#$p9_dir/#" /dev/null) 2>/dev/null || true
              actual_p9_sha="$(sha256sum "$p9_dir/p9-independent-evidence.json" | awk '{print $1}')"
              recorded_p9_sha="$(cat "$p9_dir/p9-independent-evidence.sha256")"
              test "$actual_p9_sha" = "$recorded_p9_sha"
              p9_artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${p9_run_id}/artifacts?per_page=100" | jq -r '.artifacts[] | select(.name == "dgaf-p9-independent-evidence") | .id' | head -n1)"
              p9_artifact_digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${p9_run_id}/artifacts?per_page=100" | jq -r '.artifacts[] | select(.name == "dgaf-p9-independent-evidence") | .digest' | head -n1)"
              test -n "$p9_artifact_id"
              test "$p9_artifact_id" != "null"
              test -n "$p9_artifact_digest"
              test "$p9_artifact_digest" != "null"
              python - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/evidence-registry/dgaf-evidence-registry.json')
          payload = json.loads(p.read_text(encoding='utf-8'))
          candidate = payload['candidate_sha']
          p9 = {
              'id':'P9', 'name':'independent verification', 'required':True, 'status':'VERIFIED',
              'candidate_sha':candidate, 'run_id':__import__('os').environ['P9_RUN_ID'],
              'artifact_id':__import__('os').environ['P9_ARTIFACT_ID'],
              'artifact_sha256':__import__('os').environ['P9_ARTIFACT_DIGEST'],
              'source_workflow':'P9 Independent Verification',
              'notes':'Independent candidate identity, jq canonicalization/hash equality, and authority identity regression passed; evidence JSON checksum was revalidated after retrieval.',
          }
          payload['predicates'] = [x for x in payload.get('predicates', []) if x.get('id') != 'P9'] + [p9]
          p.write_text(json.dumps(payload, indent=2, sort_keys=True)+'\n', encoding='utf-8')
          PY
              echo "p9_source_run=$p9_run_id" >> "$GITHUB_STEP_SUMMARY"
              echo "p9_artifact_id=$p9_artifact_id" >> "$GITHUB_STEP_SUMMARY"
              echo "p9_artifact_digest=$p9_artifact_digest" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
        env:
          P9_RUN_ID: ${{ env.CANDIDATE_SHA }}
          P9_ARTIFACT_ID: ""
          P9_ARTIFACT_DIGEST: ""
      - name: Rebind P9 metadata from discovered run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          runs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${CANDIDATE_SHA}&status=success&per_page=100")"
          p9_run_id="$(printf '%s' "$runs_json" | jq -r '.workflow_runs[] | select(.name == "P9 Independent Verification") | .id' | head -n1)"
          if [ -n "$p9_run_id" ] && [ "$p9_run_id" != "null" ]; then
            p9_artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${p9_run_id}/artifacts?per_page=100" | jq -r '.artifacts[] | select(.name == "dgaf-p9-independent-evidence") | .id' | head -n1)"
            p9_artifact_digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${p9_run_id}/artifacts?per_page=100" | jq -r '.artifacts[] | select(.name == "dgaf-p9-independent-evidence") | .digest' | head -n1)"
            if [ -n "$p9_artifact_id" ] && [ "$p9_artifact_id" != "null" ] && [ -n "$p9_artifact_digest" ] && [ "$p9_artifact_digest" != "null" ]; then
              python - <<'PY'
          import json
          from pathlib import Path
          import os
          p = Path('/tmp/evidence-registry/dgaf-evidence-registry.json')
          payload = json.loads(p.read_text(encoding='utf-8'))
          for predicate in payload.get('predicates', []):
              if predicate.get('id') == 'P9':
                  predicate.update({'run_id':os.environ['P9_RUN_ID'],'artifact_id':os.environ['P9_ARTIFACT_ID'],'artifact_sha256':os.environ['P9_ARTIFACT_DIGEST']})
          p.write_text(json.dumps(payload, indent=2, sort_keys=True)+'\n', encoding='utf-8')
          PY
            fi
          fi
        env:
          P9_RUN_ID: ${{ github.event.workflow_run.id }}
          P9_ARTIFACT_ID: ${{ steps.none.outputs.none }}
          P9_ARTIFACT_DIGEST: ${{ steps.none.outputs.none }}
      - name: Evaluate actual workflow/artifact evidence registry
        shell: bash
        run: |
          set +e
          python scripts/completion_controller.py /tmp/evidence-registry/dgaf-evidence-registry.json --actual-candidate-sha "$CANDIDATE_SHA" --output /tmp/completion-report.json
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            exit "$rc"
          fi
          cat /tmp/completion-report.json
          echo "controller_exit=$rc" >> "$GITHUB_STEP_SUMMARY"
          echo "Exit 2 is an expected gap signal while required predicates remain open."
      - name: Upload completion report
        uses: actions/upload-artifact@v4
        with:
          name: dgaf-completion-controller-report
          path: /tmp/completion-report.json
          if-no-files-found: error
          retention-days: 14

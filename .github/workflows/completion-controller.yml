name: DGAF Completion Controller

# The completion controller is an evaluator, not the candidate under evaluation.
# It runs only from a trusted workflow_run trigger and never checks out or executes
# candidate-controlled source. Candidate SHA is treated strictly as data.

on:
  workflow_run:
    workflows:
      - "PDMAL Instrumentation Dry Run"
      - "P9 Independent Verification"
    types: [completed]

jobs:
  completion-controller:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
      PRODUCING_RUN_ID: ${{ github.event.workflow_run.id }}
      PRODUCING_WORKFLOW: ${{ github.event.workflow_run.name }}
      PRODUCING_EVENT: ${{ github.event.workflow_run.event }}
      PRODUCING_ACTION: ${{ github.event.action }}
      PRODUCING_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
    steps:
      - name: Verify candidate and triggering workflow identifiers
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PRODUCING_RUN_ID" =~ ^[0-9]+$ ]]
          test "$PRODUCING_ACTION" = "completed"
          test "$PRODUCING_CONCLUSION" = "success"
          case "$PRODUCING_WORKFLOW" in
            "PDMAL Instrumentation Dry Run"|"P9 Independent Verification") ;;
            *) echo "unexpected producing workflow: $PRODUCING_WORKFLOW" >&2; exit 1 ;;
          esac
          printf 'candidate_sha=%s\n' "$CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf 'producing_workflow=%s\n' "$PRODUCING_WORKFLOW" >> "$GITHUB_STEP_SUMMARY"
          printf 'producing_run_id=%s\n' "$PRODUCING_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          printf 'producing_event=%s\n' "$PRODUCING_EVENT" >> "$GITHUB_STEP_SUMMARY"
          printf 'producing_action=%s\n' "$PRODUCING_ACTION" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Retrieve evidence artifact from triggering workflow run only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/evidence-registry
          artifact_name=""
          case "$PRODUCING_WORKFLOW" in
            "PDMAL Instrumentation Dry Run") artifact_name="dgaf-evidence-registry" ;;
            "P9 Independent Verification") artifact_name="dgaf-p9-independent-evidence" ;;
          esac

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PRODUCING_RUN_ID}")"
          test "$(jq -r '.id' <<<"$run_json")" = "$PRODUCING_RUN_ID"
          test "$(jq -r '.name' <<<"$run_json")" = "$PRODUCING_WORKFLOW"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$CANDIDATE_SHA"
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success"
          test "$(jq -r '.event' <<<"$run_json")" = "$PRODUCING_EVENT"

          artifacts_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PRODUCING_RUN_ID}/artifacts?per_page=100")"
          artifact_count="$(jq -r --arg name "$artifact_name" '[.artifacts[] | select(.name == $name and .expired == false)] | length' <<<"$artifacts_json")"
          test "$artifact_count" = "1"
          artifact_id="$(jq -r --arg name "$artifact_name" '[.artifacts[] | select(.name == $name and .expired == false)][0].id' <<<"$artifacts_json")"
          artifact_digest="$(jq -r --arg name "$artifact_name" '[.artifacts[] | select(.name == $name and .expired == false)][0].digest // empty' <<<"$artifacts_json")"
          test -n "$artifact_id"
          test "$artifact_id" != "null"
          test -n "$artifact_digest"

          gh run download "$PRODUCING_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir /tmp/evidence-registry
          case "$PRODUCING_WORKFLOW" in
            "PDMAL Instrumentation Dry Run") test -f /tmp/evidence-registry/dgaf-evidence-registry.json ;;
            "P9 Independent Verification") test -f /tmp/evidence-registry/p9-independent-evidence.json ;;
          esac

          printf 'producing_artifact_id=%s\n' "$artifact_id" >> "$GITHUB_STEP_SUMMARY"
          printf 'producing_artifact_digest=%s\n' "$artifact_digest" >> "$GITHUB_STEP_SUMMARY"
          printf 'producing_artifact_name=%s\n' "$artifact_name" >> "$GITHUB_STEP_SUMMARY"
          jq -n \
            --arg candidate "$CANDIDATE_SHA" \
            --arg workflow "$PRODUCING_WORKFLOW" \
            --arg run_id "$PRODUCING_RUN_ID" \
            --arg event "$PRODUCING_EVENT" \
            --arg action "$PRODUCING_ACTION" \
            --arg artifact_id "$artifact_id" \
            --arg artifact_digest "$artifact_digest" \
            --arg artifact_name "$artifact_name" \
            '{candidate_sha:$candidate,workflow_name:$workflow,workflow_run_id:$run_id,workflow_event:$event,workflow_action:$action,artifact_id:$artifact_id,artifact_digest:$artifact_digest,artifact_name:$artifact_name}' \
            > /tmp/evidence-registry/source-identity.json

      - name: Validate exact-run artifact content identity
        shell: bash
        run: |
          set -euo pipefail
          source=/tmp/evidence-registry/source-identity.json
          test "$(jq -r '.candidate_sha' "$source")" = "$CANDIDATE_SHA"
          test "$(jq -r '.workflow_run_id' "$source")" = "$PRODUCING_RUN_ID"
          test "$(jq -r '.workflow_name' "$source")" = "$PRODUCING_WORKFLOW"
          test -n "$(jq -r '.artifact_digest' "$source")"

          case "$PRODUCING_WORKFLOW" in
            "PDMAL Instrumentation Dry Run")
              registry=/tmp/evidence-registry/dgaf-evidence-registry.json
              test "$(jq -r '.candidate_sha' "$registry")" = "$CANDIDATE_SHA"
              ;;
            "P9 Independent Verification")
              p9=/tmp/evidence-registry/p9-independent-evidence.json
              test "$(jq -r '.candidate_sha' "$p9")" = "$CANDIDATE_SHA"
              test "$(jq -r '.run_id' "$p9")" = "$PRODUCING_RUN_ID"
              test "$(jq -r '.source_workflow' "$p9")" = "$PRODUCING_WORKFLOW"
              test "$(jq -r '.independent_canonicalization' "$p9")" = "jq -S -c"
              test "$(jq -r '.authority_identity_regression' "$p9")" = "PASS"
              test "$(jq -r '.authorization_is_external' "$p9")" = "true"
              test "$(jq -r '.empirical_execution_requested' "$p9")" = "false"
              test "$(sha256sum "$p9" | awk '{print $1}')" = "$(cat /tmp/evidence-registry/p9-independent-evidence.sha256)"
              ;;
          esac

      - name: Reconcile triggering-run evidence into candidate registry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          candidate = os.environ['CANDIDATE_SHA']
          workflow = os.environ['PRODUCING_WORKFLOW']
          run_id = os.environ['PRODUCING_RUN_ID']
          source_identity = json.loads(Path('/tmp/evidence-registry/source-identity.json').read_text())

          if workflow == 'PDMAL Instrumentation Dry Run':
              registry_path = Path('/tmp/evidence-registry/dgaf-evidence-registry.json')
          else:
              registry_path = Path('/tmp/evidence-registry/p9-independent-evidence.json')

          payload = json.loads(registry_path.read_text(encoding='utf-8'))
          if payload.get('candidate_sha') != candidate:
              raise SystemExit('candidate mismatch in triggering-run evidence')

          payload['immutable_source'] = source_identity
          if workflow == 'PDMAL Instrumentation Dry Run':
              payload.setdefault('reconciliation', {})['source_workflow_run_id'] = run_id
          registry_path.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(source_identity, indent=2, sort_keys=True))
          PY

      - name: Evaluate evidence registry with trusted evaluator
        if: env.PRODUCING_WORKFLOW == 'PDMAL Instrumentation Dry Run'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          p = Path('/tmp/evidence-registry/dgaf-evidence-registry.json')
          payload = json.loads(p.read_text(encoding='utf-8'))
          candidate = os.environ['CANDIDATE_SHA']
          if payload.get('candidate_sha') != candidate:
              raise SystemExit('candidate mismatch in evidence registry')

          required = [x for x in payload.get('predicates', []) if x.get('required')]
          controller_notes = []
          for item in required:
              if item.get('id') in {'P4', 'P5', 'P6'} and item.get('status') in {'VERIFIED', 'CLOSED', 'ADOPTED'}:
                  item['status'] = 'OPEN'
                  item['controller_reclassification'] = 'STRUCTURAL_DRY_RUN_NOT_CLOSURE'
                  controller_notes.append(
                      f"{item['id']} retained as OPEN: dry-run evidence does not satisfy the current-candidate closure predicate."
                  )
          blocking = [x for x in required if x.get('status') not in {'VERIFIED', 'CLOSED', 'ADOPTED'}]
          report = {
              'schema_version': 1,
              'candidate_sha': candidate,
              'required_predicates': required,
              'blocking_predicates': blocking,
              'controller_notes': controller_notes,
              'immutable_source': payload.get('immutable_source', {}),
              'reconciliation': payload.get('reconciliation', {}),
              'freeze_authorized': False,
              'pilot_authorized': False,
              'empirical_execution_requested': False,
              'decision': 'OPEN_GAPS' if blocking else 'READY_FOR_SEPARATE_GOVERNANCE_REVIEW',
          }
          Path('/tmp/completion-report.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Upload completion report
        uses: actions/upload-artifact@v4
        with:
          name: dgaf-completion-controller-report
          path: /tmp/completion-report.json
          if-no-files-found: error
          retention-days: 14

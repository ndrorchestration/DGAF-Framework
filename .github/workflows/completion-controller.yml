name: DGAF Completion Controller

# The completion controller is a trusted evaluator, not the candidate under evaluation.
# It runs from the default-branch workflow definition and never checks out or executes
# candidate-controlled source. For PDMAL, the producing workflow head is the control-plane
# identity; the designated runtime candidate is resolved independently from that head's
# canonical manifest and validated against the emitted evidence registry.

on:
  workflow_run:
    workflows:
      - "PDMAL Instrumentation Dry Run"
      - "P9 Independent Verification"
    types: [completed]

jobs:
  completion-controller:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      PRODUCING_RUN_ID: ${{ github.event.workflow_run.id }}
      PRODUCING_WORKFLOW: ${{ github.event.workflow_run.name }}
      PRODUCING_EVENT: ${{ github.event.workflow_run.event }}
      PRODUCING_ACTION: ${{ github.event.action }}
      PRODUCING_CONCLUSION: ${{ github.event.workflow_run.conclusion }}

    steps:
      - name: Verify triggering workflow identifiers
        shell: bash
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PRODUCING_RUN_ID" =~ ^[0-9]+$ ]]
          test "$PRODUCING_ACTION" = "completed"
          test "$PRODUCING_CONCLUSION" = "success"
          case "$PRODUCING_WORKFLOW" in
            "PDMAL Instrumentation Dry Run"|"P9 Independent Verification") ;;
            *) echo "unexpected producing workflow: $PRODUCING_WORKFLOW" >&2; exit 1 ;;
          esac
          printf 'workflow_head_sha=%s\n' "$WORKFLOW_HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf 'producing_workflow=%s\n' "$PRODUCING_WORKFLOW" >> "$GITHUB_STEP_SUMMARY"
          printf 'producing_run_id=%s\n' "$PRODUCING_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          printf 'producing_event=%s\n' "$PRODUCING_EVENT" >> "$GITHUB_STEP_SUMMARY"
          printf 'producing_action=%s\n' "$PRODUCING_ACTION" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Retrieve exact-run registry and independent source identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/evidence-registry

          registry_artifact_name=""
          case "$PRODUCING_WORKFLOW" in
            "PDMAL Instrumentation Dry Run") registry_artifact_name="dgaf-evidence-registry" ;;
            "P9 Independent Verification") registry_artifact_name="dgaf-p9-independent-evidence" ;;
          esac

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PRODUCING_RUN_ID}")"
          test "$(jq -r '.id' <<<"$run_json")" = "$PRODUCING_RUN_ID"
          test "$(jq -r '.name' <<<"$run_json")" = "$PRODUCING_WORKFLOW"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$WORKFLOW_HEAD_SHA"
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success"
          test "$(jq -r '.event' <<<"$run_json")" = "$PRODUCING_EVENT"

          artifacts_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PRODUCING_RUN_ID}/artifacts?per_page=100")"
          registry_count="$(jq -r --arg name "$registry_artifact_name" '[.artifacts[] | select(.name == $name and .expired == false)] | length' <<<"$artifacts_json")"
          test "$registry_count" = "1"
          registry_artifact_id="$(jq -r --arg name "$registry_artifact_name" '[.artifacts[] | select(.name == $name and .expired == false)][0].id' <<<"$artifacts_json")"
          registry_artifact_digest="$(jq -r --arg name "$registry_artifact_name" '[.artifacts[] | select(.name == $name and .expired == false)][0].digest // empty' <<<"$artifacts_json")"
          test -n "$registry_artifact_id"
          test "$registry_artifact_id" != "null"
          test -n "$registry_artifact_digest"

          designated_candidate="$WORKFLOW_HEAD_SHA"
          source_artifact_name="$registry_artifact_name"
          source_artifact_id="$registry_artifact_id"
          source_artifact_digest="$registry_artifact_digest"

          if test "$PRODUCING_WORKFLOW" = "PDMAL Instrumentation Dry Run"; then
            manifest_json="$(gh api "repos/${GITHUB_REPOSITORY}/contents/docs/experiment/NEW_CANDIDATE_MANIFEST.md?ref=${WORKFLOW_HEAD_SHA}")"
            manifest_text="$(jq -r '.content' <<<"$manifest_json" | tr -d '\n' | base64 --decode)"
            designated_candidate="$(awk '/^candidate_sha:/{print $2; exit}' <<<"$manifest_text")"
            [[ "$designated_candidate" =~ ^[0-9a-f]{40}$ ]]

            source_artifact_name="pdmal-instrumentation-dry-run"
            source_count="$(jq -r --arg name "$source_artifact_name" '[.artifacts[] | select(.name == $name and .expired == false)] | length' <<<"$artifacts_json")"
            test "$source_count" = "1"
            source_artifact_id="$(jq -r --arg name "$source_artifact_name" '[.artifacts[] | select(.name == $name and .expired == false)][0].id' <<<"$artifacts_json")"
            source_artifact_digest="$(jq -r --arg name "$source_artifact_name" '[.artifacts[] | select(.name == $name and .expired == false)][0].digest // empty' <<<"$artifacts_json")"
            test -n "$source_artifact_id"
            test "$source_artifact_id" != "null"
            test -n "$source_artifact_digest"
          fi

          gh run download "$PRODUCING_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$registry_artifact_name" --dir /tmp/evidence-registry
          case "$PRODUCING_WORKFLOW" in
            "PDMAL Instrumentation Dry Run") test -f /tmp/evidence-registry/dgaf-evidence-registry.json ;;
            "P9 Independent Verification")
              test -f /tmp/evidence-registry/p9-independent-evidence.json
              test -f /tmp/evidence-registry/p9-independent-evidence.sha256
              ;;
          esac

          echo "DESIGNATED_CANDIDATE_SHA=$designated_candidate" >> "$GITHUB_ENV"
          printf 'designated_candidate_sha=%s\n' "$designated_candidate" >> "$GITHUB_STEP_SUMMARY"
          printf 'registry_artifact_id=%s\n' "$registry_artifact_id" >> "$GITHUB_STEP_SUMMARY"
          printf 'registry_artifact_digest=%s\n' "$registry_artifact_digest" >> "$GITHUB_STEP_SUMMARY"
          printf 'source_artifact_id=%s\n' "$source_artifact_id" >> "$GITHUB_STEP_SUMMARY"
          printf 'source_artifact_digest=%s\n' "$source_artifact_digest" >> "$GITHUB_STEP_SUMMARY"

          jq -n \
            --arg candidate "$designated_candidate" \
            --arg workflow_head "$WORKFLOW_HEAD_SHA" \
            --arg workflow "$PRODUCING_WORKFLOW" \
            --arg run_id "$PRODUCING_RUN_ID" \
            --arg event "$PRODUCING_EVENT" \
            --arg action "$PRODUCING_ACTION" \
            --arg conclusion "$PRODUCING_CONCLUSION" \
            --arg artifact_id "$registry_artifact_id" \
            --arg artifact_digest "$registry_artifact_digest" \
            --arg artifact_name "$registry_artifact_name" \
            --arg source_artifact_id "$source_artifact_id" \
            --arg source_artifact_digest "$source_artifact_digest" \
            --arg source_artifact_name "$source_artifact_name" \
            '{candidate_sha:$candidate,workflow_head_sha:$workflow_head,workflow_name:$workflow,workflow_run_id:$run_id,workflow_event:$event,workflow_action:$action,workflow_conclusion:$conclusion,artifact_id:$artifact_id,artifact_digest:$artifact_digest,artifact_name:$artifact_name,source_artifact_id:$source_artifact_id,source_artifact_digest:$source_artifact_digest,source_artifact_name:$source_artifact_name}' \
            > /tmp/evidence-registry/source-identity.json

      - name: Validate exact provenance tuple and adversarial mismatch rejection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy
          import hashlib
          import json
          from pathlib import Path

          root = Path('/tmp/evidence-registry')
          source = json.loads((root / 'source-identity.json').read_text(encoding='utf-8'))
          workflow = source['workflow_name']

          def require_equal(label, actual, expected):
              if actual != expected:
                  raise ValueError(f'{label} mismatch: {actual!r} != {expected!r}')

          def validate_pdmal(payload):
              require_equal('candidate_sha', payload.get('candidate_sha'), source['candidate_sha'])
              require_equal('workflow_definition_sha', payload.get('workflow_definition_sha'), source['workflow_head_sha'])
              require_equal('workflow_run_id', str(payload.get('workflow_run_id')), source['workflow_run_id'])
              require_equal('source_workflow', payload.get('source_workflow'), source['workflow_name'])
              require_equal('workflow_event', payload.get('workflow_event'), source['workflow_event'])
              require_equal('workflow_action', payload.get('workflow_action'), source['workflow_action'])
              require_equal('workflow_conclusion', payload.get('workflow_conclusion'), source['workflow_conclusion'])
              require_equal('artifact_name', payload.get('artifact_name'), source['source_artifact_name'])
              require_equal('artifact_id', str(payload.get('artifact_id')), source['source_artifact_id'])
              require_equal('artifact_digest', payload.get('artifact_digest'), source['source_artifact_digest'])

              controls = payload.get('controls') or {}
              require_equal('freeze_authorized', controls.get('freeze_authorized'), False)
              require_equal('pilot_authorized', controls.get('pilot_authorized'), False)
              require_equal('empirical_execution_requested', controls.get('empirical_execution_requested'), False)

              predicates = payload.get('predicates')
              if not isinstance(predicates, list) or not predicates:
                  raise ValueError('predicates must be a non-empty list')
              for index, item in enumerate(predicates):
                  prefix = f'predicates[{index}]'
                  require_equal(f'{prefix}.candidate_sha', item.get('candidate_sha'), source['candidate_sha'])
                  require_equal(f'{prefix}.producer_workflow_run_id', str(item.get('producer_workflow_run_id')), source['workflow_run_id'])
                  require_equal(f'{prefix}.producer_artifact_id', str(item.get('producer_artifact_id')), source['source_artifact_id'])
                  require_equal(f'{prefix}.producer_artifact_digest', item.get('producer_artifact_digest'), source['source_artifact_digest'])
                  require_equal(f'{prefix}.producer_workflow_definition_sha', item.get('producer_workflow_definition_sha'), source['workflow_head_sha'])

          if workflow == 'PDMAL Instrumentation Dry Run':
              path = root / 'dgaf-evidence-registry.json'
              payload = json.loads(path.read_text(encoding='utf-8'))
              validate_pdmal(payload)

              # Adversarial regression: every identity dimension used for acceptance
              # must fail closed when tampered independently.
              mutations = [
                  ('top-level candidate', lambda p: p.__setitem__('candidate_sha', '0' * 40)),
                  ('workflow definition', lambda p: p.__setitem__('workflow_definition_sha', '1' * 40)),
                  ('workflow run', lambda p: p.__setitem__('workflow_run_id', '0')),
                  ('source artifact id', lambda p: p.__setitem__('artifact_id', '0')),
                  ('source artifact digest', lambda p: p.__setitem__('artifact_digest', 'sha256:' + '0' * 64)),
                  ('predicate candidate', lambda p: p['predicates'][0].__setitem__('candidate_sha', '0' * 40)),
                  ('predicate workflow run', lambda p: p['predicates'][0].__setitem__('producer_workflow_run_id', '0')),
                  ('predicate artifact id', lambda p: p['predicates'][0].__setitem__('producer_artifact_id', '0')),
                  ('predicate artifact digest', lambda p: p['predicates'][0].__setitem__('producer_artifact_digest', 'sha256:' + '0' * 64)),
                  ('predicate workflow definition', lambda p: p['predicates'][0].__setitem__('producer_workflow_definition_sha', '1' * 40)),
              ]
              for label, mutate in mutations:
                  bad = copy.deepcopy(payload)
                  mutate(bad)
                  try:
                      validate_pdmal(bad)
                  except ValueError:
                      continue
                  raise SystemExit(f'adversarial mismatch was not rejected: {label}')
              print(f'PDMAL provenance tuple: PASS; adversarial mismatch cases: {len(mutations)} PASS')

          elif workflow == 'P9 Independent Verification':
              path = root / 'p9-independent-evidence.json'
              payload = json.loads(path.read_text(encoding='utf-8'))
              require_equal('candidate_sha', payload.get('candidate_sha'), source['candidate_sha'])
              require_equal('run_id', str(payload.get('run_id')), source['workflow_run_id'])
              require_equal('source_workflow', payload.get('source_workflow'), source['workflow_name'])
              require_equal('independent_canonicalization', payload.get('independent_canonicalization'), 'jq -S -c')
              require_equal('authority_identity_regression', payload.get('authority_identity_regression'), 'PASS')
              require_equal('authorization_is_external', payload.get('authorization_is_external'), True)
              require_equal('empirical_execution_requested', payload.get('empirical_execution_requested'), False)
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              expected = (root / 'p9-independent-evidence.sha256').read_text(encoding='utf-8').strip().split()[0]
              require_equal('p9 sha256', actual, expected)
              print('P9 exact-run evidence identity: PASS')
          else:
              raise SystemExit(f'unexpected workflow: {workflow}')
          PY

      - name: Reconcile triggering-run evidence into candidate registry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/evidence-registry')
          source_identity = json.loads((root / 'source-identity.json').read_text(encoding='utf-8'))
          candidate = source_identity['candidate_sha']
          workflow = source_identity['workflow_name']
          run_id = source_identity['workflow_run_id']

          if workflow == 'PDMAL Instrumentation Dry Run':
              registry_path = root / 'dgaf-evidence-registry.json'
          else:
              registry_path = root / 'p9-independent-evidence.json'

          payload = json.loads(registry_path.read_text(encoding='utf-8'))
          if payload.get('candidate_sha') != candidate:
              raise SystemExit('candidate mismatch in triggering-run evidence')

          payload['immutable_source'] = source_identity
          if workflow == 'PDMAL Instrumentation Dry Run':
              payload.setdefault('reconciliation', {})['source_workflow_run_id'] = run_id
          registry_path.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(source_identity, indent=2, sort_keys=True))
          PY

      - name: Evaluate evidence registry with trusted evaluator
        if: env.PRODUCING_WORKFLOW == 'PDMAL Instrumentation Dry Run'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/evidence-registry')
          payload = json.loads((root / 'dgaf-evidence-registry.json').read_text(encoding='utf-8'))
          source = json.loads((root / 'source-identity.json').read_text(encoding='utf-8'))
          candidate = source['candidate_sha']
          if payload.get('candidate_sha') != candidate:
              raise SystemExit('candidate mismatch in evidence registry')

          required = [x for x in payload.get('predicates', []) if x.get('required')]
          controller_notes = []
          for item in required:
              if item.get('id') in {'P4', 'P5', 'P6'} and item.get('status') in {'VERIFIED', 'CLOSED', 'ADOPTED'}:
                  item['status'] = 'OPEN'
                  item['controller_reclassification'] = 'STRUCTURAL_DRY_RUN_NOT_CLOSURE'
                  controller_notes.append(
                      f"{item['id']} retained as OPEN: dry-run evidence does not satisfy the current-candidate closure predicate."
                  )
          blocking = [x for x in required if x.get('status') not in {'VERIFIED', 'CLOSED', 'ADOPTED'}]
          report = {
              'schema_version': 1,
              'candidate_sha': candidate,
              'workflow_head_sha': source['workflow_head_sha'],
              'required_predicates': required,
              'blocking_predicates': blocking,
              'controller_notes': controller_notes,
              'immutable_source': payload.get('immutable_source', {}),
              'reconciliation': payload.get('reconciliation', {}),
              'freeze_authorized': False,
              'pilot_authorized': False,
              'empirical_execution_requested': False,
              'decision': 'OPEN_GAPS' if blocking else 'READY_FOR_SEPARATE_GOVERNANCE_REVIEW',
          }
          Path('/tmp/completion-report.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Upload completion report
        uses: actions/upload-artifact@v4
        with:
          name: dgaf-completion-controller-report
          path: /tmp/completion-report.json
          if-no-files-found: error
          retention-days: 14

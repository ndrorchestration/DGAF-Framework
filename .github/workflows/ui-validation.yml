name: UI Validation
on:
  push:
    paths: ['app/**', 'tests/ui/**']
  pull_request:
    paths: ['app/**', 'tests/ui/**']
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm install
      - run: npm run build
      - run: npm test tests/ui/dashboard_smoke.test.ts

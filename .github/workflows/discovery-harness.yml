name: Discovery Harness
on:
  pull_request:
    paths:
      - "dgaf_discovery/**"
      - "tests/test_discovery_harness.py"
      - "tests/test_discovery_registry.py"
      - "tests/test_discovery_metamorphic.py"
      - "tests/test_discovery_detector_mutation.py"
      - "docs/governance/DISCOVERY_HARNESS_V1.md"
      - "docs/governance/ASSUMPTION_REGISTRY_V1.json"
      - "docs/governance/BLIND_SPOT_LEDGER_V1.json"
      - ".github/workflows/discovery-harness.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discovery-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Verify non-authorizing discovery harness
        run: >-
          python -m pytest -q
          tests/test_discovery_harness.py
          tests/test_discovery_registry.py
          tests/test_discovery_metamorphic.py
          tests/test_discovery_detector_mutation.py

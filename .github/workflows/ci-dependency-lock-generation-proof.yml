name: CI Dependency Lock Generation Proof

on:
  pull_request:
    paths:
      - '.github/workflows/ci-dependency-lock-generation-proof.yml'
      - 'requirements-ci.txt'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  generate-and-verify:
    name: Generate and verify CI hash lock (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.12.0', '3.12.3']

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify exact PR head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: ${{ matrix.python }}

      - name: Bootstrap and verify exact pip resolver
        run: |
          set -euo pipefail
          mkdir -p .ci-lock-bootstrap
          python -m pip download             --disable-pip-version-check             --only-binary=:all:             --no-deps             --dest .ci-lock-bootstrap             'pip==26.2.1'
          test "$(sha256sum .ci-lock-bootstrap/pip-26.2.1-py3-none-any.whl | awk '{print $1}')" =             "71138adf1f4ca900cdb7d289c21b7494329f2332b6d85f0e1c42108c0384ed3e"
          python -m pip install             --disable-pip-version-check             --no-index             --find-links .ci-lock-bootstrap             'pip==26.2.1'
          test "$(python -m pip --version | awk '{print $2}')" = "26.2.1"

      - name: Resolve exact wheel set
        run: |
          set -euo pipefail
          python -m pip install             --disable-pip-version-check             --dry-run             --ignore-installed             --only-binary=:all:             --report ci-lock-report.json             -r requirements-ci.txt

      - name: Materialize artifact-exact hash lock
        env:
          PYTHON_REQUESTED: ${{ matrix.python }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import re
          import sys
          from pathlib import Path

          report = json.loads(Path("ci-lock-report.json").read_text(encoding="utf-8"))
          source = Path("requirements-ci.txt")
          source_sha = hashlib.sha256(source.read_bytes()).hexdigest()
          requested = os.environ["PYTHON_REQUESTED"]
          expected_minor = ".".join(requested.split(".")[:2])
          actual_full = platform.python_version()
          actual_minor = f"{sys.version_info.major}.{sys.version_info.minor}"
          assert actual_minor == expected_minor, (actual_minor, expected_minor)
          if len(requested.split(".")) == 3:
              assert actual_full == requested, (actual_full, requested)

          def canonical(name: str) -> str:
              return re.sub(r"[-_.]+", "-", name).lower()

          rows = []
          seen = set()
          for item in report.get("install", []):
              metadata = item.get("metadata") or {}
              name = metadata.get("name")
              version = metadata.get("version")
              archive = ((item.get("download_info") or {}).get("archive_info") or {})
              hashes = archive.get("hashes") or {}
              sha256 = hashes.get("sha256")
              assert name and version and sha256, item
              key = canonical(name)
              assert key not in seen, key
              seen.add(key)
              rows.append((key, version, sha256))

          assert rows, "resolver report contained no install set"
          rows.sort()
          lane_id = requested.replace(".", "")
          out = Path(f"requirements-ci-py{lane_id}-ubuntu2404-x64.lock")
          header = [
              "# GENERATED PROOF ARTIFACT — NOT YET CANONICAL",
              "# source: requirements-ci.txt",
              f"# source_sha256: {source_sha}",
              f"# python_requested: {requested}",
              f"# python_minor: {expected_minor}",
              f"# python_full: {actual_full}",
              "# runner_os: ubuntu-24.04",
              "# runner_arch: x64",
              "# resolver: pip==26.2.1",
              "# binary_policy: only-binary=:all:",
              "",
          ]
          body = []
          for name, version, sha256 in rows:
              body.append(f"{name}=={version} \\")
              body.append(f"    --hash=sha256:{sha256}")
          out.write_text("\n".join(header + body) + "\n", encoding="utf-8")

          lock_sha = hashlib.sha256(out.read_bytes()).hexdigest()
          resolved_set = "\n".join(
              f"{name}=={version} sha256:{sha256}" for name, version, sha256 in rows
          ).encode("utf-8")
          resolved_set_sha = hashlib.sha256(resolved_set).hexdigest()
          manifest = {
              "evidence_class": "DGAF_CI_HASH_LOCK_GENERATION_PROOF_V1",
              "scientific_state_effect": "NONE",
              "authorization_effect": "NONE",
              "source": "requirements-ci.txt",
              "source_sha256": source_sha,
              "lock_path": str(out),
              "lock_sha256": lock_sha,
              "resolved_set_sha256": resolved_set_sha,
              "python_requested": requested,
              "python_minor": expected_minor,
              "python_full": actual_full,
              "platform": platform.platform(),
              "resolver": "pip==26.2.1",
              "binary_policy": "only-binary=:all:",
              "resolved_package_count": len(rows),
          }
          Path("ci-lock-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Verify lock in fresh environment with required hashes
        env:
          PYTHON_REQUESTED: ${{ matrix.python }}
        run: |
          set -euo pipefail
          lock="requirements-ci-py${PYTHON_REQUESTED//./}-ubuntu2404-x64.lock"
          python -m venv .ci-lock-verify
          .ci-lock-verify/bin/python -m pip install             --disable-pip-version-check             --no-index             --find-links .ci-lock-bootstrap             'pip==26.2.1'
          .ci-lock-verify/bin/python -m pip install             --disable-pip-version-check             --require-hashes             --only-binary=:all:             -r "$lock"
          .ci-lock-verify/bin/python -m pip check
          .ci-lock-verify/bin/python -m pip freeze --all | sort > ci-lock-freeze.txt

      - name: Assert proof non-effects
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("ci-lock-manifest.json").read_text())
          assert d["scientific_state_effect"] == "NONE"
          assert d["authorization_effect"] == "NONE"
          assert d["resolver"] == "pip==26.2.1"
          assert d["resolved_package_count"] > 0
          print("CI_HASH_LOCK_PROOF_BOUNDARY_PASS")
          PY

      - name: Upload lock proof artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-hash-lock-proof-py${{ matrix.python }}-${{ github.event.pull_request.head.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            requirements-ci-py*-ubuntu2404-x64.lock
            ci-lock-report.json
            ci-lock-manifest.json
            ci-lock-freeze.txt

      - name: Non-waived resolved dependency audit
        shell: bash
        run: |
          set -euo pipefail
          .ci-lock-verify/bin/python -m pip show filelock || true
          .ci-lock-verify/bin/python -m pip_audit --local

  isolate-py310-auditor-diagnostic:
    name: Proof-only Python 3.10 workload audited by pinned Python 3.11 scanner
    if: github.head_ref == 'proof/ci-py310-isolated-auditor-1530-20261027'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Select Python 3.10 workload resolver
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: '3.10'
      - name: Prepare Python 3.10 workload-only exact source
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/bootstrap_ci_pip.sh
          python scripts/proof_py310_audit_isolation.py source
          python -m pip install --disable-pip-version-check --dry-run --ignore-installed \
            --only-binary=:all: --report py310-isolated-resolver-report.json \
            -r py310-isolated-workload-requirements.txt
          python scripts/proof_py310_audit_isolation.py lock
      - name: Verify complete workload in fresh Python 3.10 environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .py310-workload
          source .py310-workload/bin/activate
          bash scripts/bootstrap_ci_pip.sh
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: \
            -r py310-isolated-workload-hash.lock
          python -m pip check
          python -m pip freeze --all | sort > py310-isolated-workload-freeze.txt
          python - <<'PY'
          import importlib.metadata as m
          for package in ('pip-audit', 'filelock'):
              try:
                  m.version(package)
              except m.PackageNotFoundError:
                  continue
              raise AssertionError('scanner-only package leaked into 3.10 workload: ' + package)
          import black, pytest, pydantic, mypy, isort
          print('PY310_WORKLOAD_DIAGNOSTIC_IMPORTS_PASS')
          PY
      - name: Download already verified Python 3.11 scanner-lock evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-hash-lock-proof-py3.11-b128442435a3dd05606c9a3e1a844e4acd55b2a2
          run-id: 40466036612
          github-token: ${{ github.token }}
          path: .py311-auditor-proof
      - name: Confirm pinned scanner proof identity
        shell: bash
        run: |
          set -euo pipefail
          test -s .py311-auditor-proof/requirements-ci-py311-ubuntu2404-x64.lock
          test "$(sha256sum .py311-auditor-proof/requirements-ci-py311-ubuntu2404-x64.lock | awk '{print $1}')" = \
            'c29bde77a4fdd192eb3285991e5752c749bb0ec5ad11450a65b28d4b459d104e'
      - name: Select Python 3.11 independent auditor
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: '3.11'
      - name: Fresh signed-evidence auditor and non-waived complete workload audit
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .py311-auditor
          source .py311-auditor/bin/activate
          bash scripts/bootstrap_ci_pip.sh
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: \
            -r .py311-auditor-proof/requirements-ci-py311-ubuntu2404-x64.lock
          python -m pip check
          python -m pip_audit --local
          python -m pip_audit --require-hashes --disable-pip \
            -r py310-isolated-workload-hash.lock --format=json \
            --output py310-isolated-audit.json --progress-spinner=off
          python scripts/proof_py310_audit_isolation.py verify
      - name: Run original Python 3.10 repository regression suite against isolated workload
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          test "$( .py310-workload/bin/python -c 'import sys;print(sys.version_info.minor)' )" = "10"
          export PYTHONPATH="$GITHUB_WORKSPACE"
          set +e
          .py310-workload/bin/python -m pytest tests/ \
            --cov=components --cov-report=term-missing \
            --cov-fail-under=0 --timeout=30 --tb=short -q \
            --junitxml=py310-isolated-repository-pytest.junit.xml \
            2>&1 | tee py310-isolated-repository-pytest.log
          status=${PIPESTATUS[0]}
          set -e
          printf 'pytest_exit_code=%s\n' "$status" > py310-isolated-repository-pytest.status
          .py310-workload/bin/python scripts/proof_py310_regression_classifier.py
          # Preserve the original failed canonical lock contract admission.
          exit "$status"
      - name: Preserve diagnostic exact evidence regardless of outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: py310-isolated-auditor-proof-${{ github.event.pull_request.head.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            py310-isolated-workload-requirements.txt
            py310-isolated-resolver-report.json
            py310-isolated-workload-hash.lock
            py310-isolated-manifest.json
            py310-isolated-workload-freeze.txt
            py310-isolated-audit.json
            py310-isolated-repository-pytest.log
            py310-isolated-repository-pytest.status
            py310-isolated-repository-pytest.junit.xml
            py310-isolated-regression-classification.json

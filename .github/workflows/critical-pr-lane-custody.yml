name: Critical PR Lane Custody

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate-lane-custody:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.0'
      - name: Exercise custody negative controls
        run: python scripts/validate_critical_pr_lane_custody.py --self-test
      - name: Validate registered PR lane scope
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: python scripts/validate_critical_pr_lane_custody.py --head-ref "$HEAD_REF" --base-ref "$BASE_REF"
      - name: Prove non-authorizing boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('docs/governance/CRITICAL_PR_LANE_CUSTODY_REGISTRY_V1.json').read_text())
          assert d['scientific_n_increment'] == 0
          b=d['claim_boundary']
          assert b['branch_ref_immutability_established'] is False
          assert b['repository_admin_configuration_changed'] is False
          assert b['track_a_freeze'] == 'NOT_ESTABLISHED'
          assert b['track_a_empirical_execution'] == 'NOT_AUTHORIZED'
          print('CRITICAL_PR_LANE_CUSTODY_NONAUTHORIZING_BOUNDARY_PASS')
          PY

# Doc-Lint CI Workflow — DGAF-Framework (Spine Repo)
# Public/current documentation quality gate plus repository-wide baseline audit.
# Historical and append-only evidence records remain provenance-sensitive: the
# audit reports their lint state before any exemption or rewrite is accepted.

name: Doc Lint

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - '.markdownlint.yml'
      - '.markdownlint.json'
      - '.github/workflows/doc-lint.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.md'
      - '.markdownlint.yml'
      - '.markdownlint.json'
      - '.github/workflows/doc-lint.yml'

jobs:
  markdownlint:
    name: Markdown Lint — Public Surface
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli@0.39.0

      - name: Run markdownlint on public/current entry points
        run: |
          markdownlint \
            --config .markdownlint.yml \
            --ignore node_modules \
            README.md \
            README.governance.md \
            README.technical.md \
            docs/architecture/DGAF_V1_*.md

      - name: Audit repository-wide markdownlint baseline
        id: repo_wide_audit
        continue-on-error: true
        shell: bash
        run: |
          set +e
          markdownlint \
            --config .markdownlint.yml \
            --ignore node_modules \
            '**/*.md' 2>&1 | tee repo-wide-markdownlint.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Summarize repository-wide baseline
        id: repo_wide_summary
        if: always()
        shell: bash
        run: |
          report=repo-wide-markdownlint.txt
          if [[ ! -f "$report" ]]; then
            echo "total=0" >> "$GITHUB_OUTPUT"
            echo "files=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          total=$(grep -Ec ':[0-9]+(:[0-9]+)? MD[0-9]{3}/' "$report" || true)
          files=$(sed -nE 's#^([^:]+):[0-9]+(:[0-9]+)? MD[0-9]{3}/.*#\1#p' "$report" | sort -u | wc -l | tr -d ' ')
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo 'REPO_WIDE_MARKDOWNLINT_RULE_COUNTS_BEGIN'
          sed -nE 's#^.* (MD[0-9]{3})/.*#\1#p' "$report" | sort | uniq -c | awk '{print $2 "=" $1}'
          echo 'REPO_WIDE_MARKDOWNLINT_RULE_COUNTS_END'
          echo "REPO_WIDE_MARKDOWNLINT_TOTAL=$total"
          echo "REPO_WIDE_MARKDOWNLINT_FILES=$files"

      - name: Report summary
        if: always()
        run: |
          echo "## Doc Lint Summary — DGAF-Framework" >> "$GITHUB_STEP_SUMMARY"
          echo "- Linter: markdownlint-cli 0.39.0" >> "$GITHUB_STEP_SUMMARY"
          echo "- Node.js: 24" >> "$GITHUB_STEP_SUMMARY"
          echo "- Public/current gate: README surfaces + docs/architecture/DGAF_V1_*.md" >> "$GITHUB_STEP_SUMMARY"
          echo "- Repository-wide baseline audit exit: ${{ steps.repo_wide_audit.outputs.exit_code }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Repository-wide violations: ${{ steps.repo_wide_summary.outputs.total }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Repository-wide affected files: ${{ steps.repo_wide_summary.outputs.files }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Repository-wide audit is diagnostic in this change; failures are retained for classification rather than silently ignored." >> "$GITHUB_STEP_SUMMARY"

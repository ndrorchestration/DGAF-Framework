# Doc-Lint CI Workflow — DGAF-Framework (Spine Repo)
# Public/current documentation quality gate.
# Historical and append-only evidence records are governed separately so
# presentation linting does not rewrite or invalidate provenance.

name: Doc Lint

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - '.markdownlint.yml'
      - '.markdownlint.json'
  pull_request:
    branches: [main]
    paths:
      - '**.md'
      - '.markdownlint.yml'
      - '.markdownlint.json'

jobs:
  markdownlint:
    name: Markdown Lint — Public Surface
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli@0.39.0

      - name: Run markdownlint on public/current entry points
        run: |
          markdownlint \
            --config .markdownlint.yml \
            --ignore node_modules \
            README.md \
            README.governance.md \
            README.technical.md \
            docs/architecture/DGAF_V1_*.md
        # Detailed governance, experiment, evidence, archive, historical,
        # generated, and append-only records remain subject to their own
        # provenance/evidence controls rather than presentation lint.

      - name: Report summary
        if: always()
        run: |
          echo "## Doc Lint Summary — DGAF-Framework" >> $GITHUB_STEP_SUMMARY
          echo "- Linter: markdownlint-cli 0.39.0" >> $GITHUB_STEP_SUMMARY
          echo "- Node.js: 24" >> $GITHUB_STEP_SUMMARY
          echo "- Scope: public/current entry-point documentation" >> $GITHUB_STEP_SUMMARY
          echo "- Separate provenance surfaces: governance, experiment, evidence, archive, historical, generated, append-only records" >> $GITHUB_STEP_SUMMARY

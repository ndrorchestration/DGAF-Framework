name: NPM Lockfile Validation

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/npm-lockfile-validation.yml'
      - 'tests/test_npm_lockfile_contract.py'
      - 'docs/security/DEPENDENCY_PIN_REVIEW_2026-09-09.md'
      - 'docs/security/npm-direct-dependency-state.json'
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/npm-lockfile-validation.yml'
      - 'tests/test_npm_lockfile_contract.py'
      - 'docs/security/DEPENDENCY_PIN_REVIEW_2026-09-09.md'
      - 'docs/security/npm-direct-dependency-state.json'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_NODE_VERSION: v24.20.0
  EXPECTED_NPM_VERSION: 11.19.0

jobs:
  validate-lockfile:
    name: Validate npm lockfile
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind source identity
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -s package.json
          test -s package-lock.json
          test -s docs/security/npm-direct-dependency-state.json
          test ! -e npm-shrinkwrap.json
          test ! -e pnpm-lock.yaml
          test ! -e yarn.lock

      - name: Execute repository lockfile contract
        run: |
          set -euo pipefail
          python3 tests/test_npm_lockfile_contract.py

      - name: Set up exact Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Verify exact package-manager toolchain
        run: |
          set -euo pipefail
          test "$(node --version)" = "$EXPECTED_NODE_VERSION"
          test "$(npm --version)" = "$EXPECTED_NPM_VERSION"
          test "$(node -p "require('./package-lock.json').lockfileVersion")" = 3
          test "$(node -p "require('./package-lock.json').name")" = "$(node -p "require('./package.json').name")"
          test "$(node -p "require('./package-lock.json').version")" = "$(node -p "require('./package.json').version")"

      - name: Verify lockfile is package-manifest consistent
        run: |
          set -euo pipefail
          cp package-lock.json /tmp/package-lock.before.json
          npm install \
            --package-lock-only \
            --ignore-scripts \
            --no-audit \
            --no-fund
          cmp --silent /tmp/package-lock.before.json package-lock.json
          git diff --exit-code -- package-lock.json

      - name: Verify clean lockfile-consuming install and build
        run: |
          set -euo pipefail
          rm -rf node_modules
          npm ci \
            --ignore-scripts \
            --no-audit \
            --no-fund
          npm run build

      - name: Reject secret-like lockfile material
        run: |
          set -euo pipefail
          if grep -Eiq '(_authToken|npm_[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_)' package-lock.json; then
            echo 'Secret-like material detected in package-lock.json' >&2
            exit 1
          fi

      - name: Emit validation evidence
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          package_sha="$(sha256sum package.json | awk '{print $1}')"
          lock_sha="$(sha256sum package-lock.json | awk '{print $1}')"
          direct_state_sha="$(sha256sum docs/security/npm-direct-dependency-state.json | awk '{print $1}')"
          jq -n \
            --arg evidence_class 'NPM_LOCKFILE_VALIDATION_V2' \
            --arg source_commit "$SOURCE_SHA" \
            --arg workflow_run_id "$GITHUB_RUN_ID" \
            --arg workflow_run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg package_json_sha256 "$package_sha" \
            --arg package_lock_sha256 "$lock_sha" \
            --arg direct_dependency_state_sha256 "$direct_state_sha" \
            --arg node_version "$(node --version)" \
            --arg npm_version "$(npm --version)" \
            '{evidence_class:$evidence_class,source_commit:$source_commit,workflow_run_id:$workflow_run_id,workflow_run_attempt:$workflow_run_attempt,package_json_sha256:$package_json_sha256,package_lock_sha256:$package_lock_sha256,direct_dependency_state_sha256:$direct_dependency_state_sha256,node_version:$node_version,npm_version:$npm_version,result:"PASS_NONEMPIRICAL_REPRODUCIBILITY_EVIDENCE",scientific_state_effect:"NONE"}' \
            > npm-lockfile-validation.json
          sha256sum npm-lockfile-validation.json > npm-lockfile-validation.json.sha256

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: npm-lockfile-validation-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            npm-lockfile-validation.json
            npm-lockfile-validation.json.sha256

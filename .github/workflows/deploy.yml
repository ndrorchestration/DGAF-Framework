name: Deploy to Vercel + Live Regression

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deployment-readiness:
    name: Deployment Configuration Check
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Vercel configuration
        id: check
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          mkdir -p artifacts
          configured=true
          missing=()
          [ -n "$VERCEL_TOKEN" ] || { configured=false; missing+=(VERCEL_TOKEN); }
          [ -n "$VERCEL_ORG_ID" ] || { configured=false; missing+=(VERCEL_ORG_ID); }
          [ -n "$VERCEL_PROJECT_ID" ] || { configured=false; missing+=(VERCEL_PROJECT_ID); }
          printf '%s\n' "configured=$configured"
          printf '%s\n' "missing=${missing[*]:-none}"
          export EVIDENCE_CONFIGURED="$configured"
          export EVIDENCE_MISSING="${missing[*]}"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              'evidence_class': 'DEPLOYMENT_CONFIGURATION_STATUS',
              'source_commit': os.environ['GITHUB_SHA'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'scope': 'GitHub Actions Vercel deployment prerequisites',
              'configured': os.environ['EVIDENCE_CONFIGURED'] == 'true',
              'missing_prerequisites': os.environ['EVIDENCE_MISSING'].split() if os.environ['EVIDENCE_MISSING'] else [],
              'deployment_attempted': False,
              'limitations': ['Configuration presence is not deployment success and is not runtime evidence.'],
          }
          Path('artifacts/deployment_readiness.json').write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          PY
          echo "configured=$configured" >> "$GITHUB_OUTPUT"

      - name: Upload deployment readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: deployment-readiness-${{ github.sha }}
          path: artifacts/deployment_readiness.json

  deploy:
    name: Vercel Production Deploy
    needs: deployment-readiness
    if: ${{ needs.deployment-readiness.outputs.configured == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel production
        id: deploy
        run: |
          mkdir -p artifacts
          URL=$(vercel deploy \
            --prod \
            --yes \
            --token="$VERCEL_TOKEN")
          echo "deployment_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $URL"
          export DEPLOYMENT_URL="$URL"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              'evidence_class': 'DEPLOYMENT_ATTESTATION',
              'source_commit': os.environ['GITHUB_SHA'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'deployment_url': os.environ['DEPLOYMENT_URL'],
              'command': 'vercel deploy --prod --yes --token=<redacted>',
              'result': 'DEPLOYMENT_RETURNED_URL',
              'scope': 'Vercel deployment command result only',
              'limitations': ['Deployment return does not establish application health or end-to-end runtime behavior.'],
          }
          Path('artifacts/deployment_provenance.json').write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Set env vars
        run: |
          echo "1.8.0" | vercel env add ENSEMBLE_VERSION production \
            --token="$VERCEL_TOKEN" --force
          echo "enabled" | vercel env add PSI_CHECK production \
            --token="$VERCEL_TOKEN" --force

      - name: Upload deployment provenance
        uses: actions/upload-artifact@v4
        with:
          name: deployment-provenance-${{ github.sha }}
          path: artifacts/deployment_provenance.json

  deployment-unavailable:
    name: Deployment Evidence Unavailable
    needs: deployment-readiness
    if: ${{ needs.deployment-readiness.outputs.configured != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'Vercel deployment was not attempted because required GitHub Actions secrets are not configured.'
          echo 'This job records an explicit evidence boundary; it is not deployment or runtime verification.'

  post-deploy-verification:
    name: Health + Regression Check
    if: ${{ needs.deploy.result == 'success' && needs.deploy.outputs.deployment_url != '' }}
    runs-on: ubuntu-latest
    needs: deploy
    env:
      DGAF_URL: ${{ needs.deploy.outputs.deployment_url }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install httpx
        run: pip install httpx -q

      - name: Wait for deployment to warm
        run: sleep 20

      - name: Health preflight
        run: |
          echo "Checking: $DGAF_URL/api/health"
          HEALTH=$(curl -sf "$DGAF_URL/api/health" || echo '{}')
          echo "$HEALTH" | python3 -m json.tool
          PSI=$(echo "$HEALTH" | python3 -c \
            "import sys,json; print(json.load(sys.stdin).get('psi_cubic',''))")
          VER=$(echo "$HEALTH" | python3 -c \
            "import sys,json; print(json.load(sys.stdin).get('version',''))")
          [ "$PSI" = "True" ] \
            && echo '  v psi_cubic' \
            || { echo '  x psi_cubic FAIL'; exit 1; }
          [ "$VER" = "1.8.0" ] \
            && echo '  v version=1.8.0' \
            || echo "  ~ version=$VER"

      - name: 30-turn live regression
        run: python3 scripts/live_regression_v17.py

      - name: Upload regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ github.sha }}
          path: regression_results_v17.json

      - name: Audit log final check
        run: |
          AUDIT=$(curl -sf "$DGAF_URL/api/audit" || echo '{}')
          echo "$AUDIT" | python3 -m json.tool
          TC=$(echo "$AUDIT" | python3 -c \
            "import sys,json; print(json.load(sys.stdin).get('turn_count',0))")
          [ "$TC" -ge 30 ] \
            && echo "  v audit turn_count=$TC" \
            || { echo "  x turn_count=$TC < 30"; exit 1; }

      - name: Record runtime verification evidence
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              'evidence_class': 'RUNTIME_VERIFICATION',
              'source_commit': os.environ['GITHUB_SHA'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'deployment_url': os.environ['DGAF_URL'],
              'scope': 'health preflight, 30-turn live regression, and audit turn-count check',
              'result': 'PASS',
              'limitations': ['Runtime verification applies to the exercised deployment and protocol; it does not establish broad real-world efficacy.'],
          }
          Path('artifacts/runtime_verification.json').write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Upload runtime verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: runtime-verification-${{ github.sha }}
          path: artifacts/runtime_verification.json

      - name: Print production URL
        run: |
          echo "================================================"
          echo "  DGAF-Framework LIVE: $DGAF_URL"
          echo "  /api/health      GET"
          echo "  /api/orchestrate POST"
          echo "  /api/audit       GET"
          echo "================================================"
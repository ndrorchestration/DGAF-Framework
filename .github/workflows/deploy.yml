name: Deploy to Vercel + Live Regression

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VERCEL_ORG_ID: team_TJWNcGa1Xh9ARKF3SYbKKxKp
  VERCEL_PROJECT_ID: prj_euzjAnhqct0wayTWWojizanKN3cX
  EXPECTED_ENSEMBLE_VERSION: 1.8.0

jobs:
  deploy:
    name: Vercel Production Deploy
    runs-on: ubuntu-latest
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Require deployment credential
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"

      - name: Establish production runtime configuration
        run: |
          set -euo pipefail
          printf '%s\n' "$EXPECTED_ENSEMBLE_VERSION" | vercel env add ENSEMBLE_VERSION production --token="$VERCEL_TOKEN" --force
          printf '%s\n' enabled | vercel env add PSI_CHECK production --token="$VERCEL_TOKEN" --force

      - name: Deploy to Vercel production
        id: deploy
        run: |
          set -euo pipefail
          vercel deploy --prod --yes --token="$VERCEL_TOKEN" | tee vercel_deploy.log
          url=$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' vercel_deploy.log | tail -1)
          test -n "$url"
          echo "deployment_url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify exact Vercel deployment identity
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          host="${DEPLOYMENT_URL#https://}"
          host="${host#http://}"
          curl -fsS --get \
            --data-urlencode "teamId=$VERCEL_ORG_ID" \
            --data-urlencode 'withGitRepoInfo=true' \
            "https://api.vercel.com/v13/deployments/$host" \
            -H "Authorization: Bearer $VERCEL_TOKEN" > deployment_metadata.json
          ready=$(jq -r '.readyState // empty' deployment_metadata.json)
          target=$(jq -r '.target // empty' deployment_metadata.json)
          id=$(jq -r '.id // empty' deployment_metadata.json)
          source=$(jq -r '.meta.githubCommitSha // .gitSource.sha // empty' deployment_metadata.json)
          test "$ready" = READY
          test "$target" = production
          test -n "$id"
          test "$source" = "$GITHUB_SHA"
          jq -n \
            --arg source "$GITHUB_SHA" \
            --arg vercel_source "$source" \
            --arg run "$GITHUB_RUN_ID" \
            --arg deployment "$id" \
            --arg url "$DEPLOYMENT_URL" \
            --arg ready "$ready" \
            --arg target "$target" \
            '{evidence_class:"DEPLOYMENT_EXACT_SOURCE_ATTESTATION",source_commit:$source,vercel_source_commit:$vercel_source,workflow_run_id:$run,deployment_id:$deployment,deployment_url:$url,ready_state:$ready,target:$target,exact_source_match:true}' > deployment_provenance.json

      - name: Upload deployment provenance
        uses: actions/upload-artifact@v4
        with:
          name: deployment-provenance-${{ github.sha }}
          path: deployment_provenance.json

  verify:
    name: Health + Regression Check
    needs: deploy
    runs-on: ubuntu-latest
    env:
      DGAF_URL: ${{ needs.deploy.outputs.deployment_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      EXPECTED_ENSEMBLE_VERSION: 1.8.0
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install httpx
        run: pip install httpx -q

      - name: Require runtime bypass credential
        run: |
          set -euo pipefail
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"

      - name: Wait for deployment to warm
        run: sleep 20

      - name: Health preflight
        run: |
          set -euo pipefail
          health=$(curl -fsS -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$DGAF_URL/api/health")
          echo "$health" | jq .
          test "$(jq -r '.psi_cubic' <<< "$health")" = true
          test "$(jq -r '.version' <<< "$health")" = "$EXPECTED_ENSEMBLE_VERSION"

      - name: 30-turn live regression
        run: python3 scripts/live_regression_v17.py

      - name: Upload regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ github.sha }}
          path: regression_results_v17.json

      - name: Audit baseline
        run: |
          set -euo pipefail
          audit=$(curl -fsS -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$DGAF_URL/api/audit")
          echo "$audit" | jq .
          test "$(jq -r '.status' <<< "$audit")" = ok
          test "$(jq -r '.version' <<< "$audit")" = "$EXPECTED_ENSEMBLE_VERSION"
          test "$(jq -r '.axiom_count' <<< "$audit")" = 1
          test -n "$(jq -r '._warning // empty' <<< "$audit")"

      - name: Runtime verification evidence
        run: |
          jq -n \
            --arg source "$GITHUB_SHA" \
            --arg run "$GITHUB_RUN_ID" \
            --arg url "$DGAF_URL" \
            '{evidence_class:"RUNTIME_VERIFICATION",source_commit:$source,workflow_run_id:$run,deployment_url:$url,result:"PASS_WITH_LIMITATION",limitations:["Audit state is in-memory and does not establish cross-request persistence.","Phi-Closure checkpoints remain fail-closed until live audit state is wired into /api/orchestrate.","Runtime integration evidence does not establish experimental efficacy, freeze, or authorization."]}' > runtime_verification.json

      - name: Upload runtime verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: runtime-verification-${{ github.sha }}
          path: runtime_verification.json

name: Governance CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  governance-ci:
    name: Governance CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest numpy

      - name: Compile Python components
        run: python -m compileall -q components tests

      - name: Run P-42 conductor and recovery tests
        run: python -m pytest -q tests/test_ahg_conductor.py tests/test_ahg_recovery.py

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download pinned TLA+ Tools release
        run: |
          curl --fail --location --retry 3 --output tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          echo 'ab323b79802aedc3203b3f9af37c6aca3ed43f4e0225b36f2aa77b26de46c05f  tla2tools.jar' | sha256sum --check --strict

      - name: Model-check DGAF containment
        run: |
          java -cp tla2tools.jar tlc2.TLC -config specs/DGAFContainment.cfg specs/DGAFContainment.tla

      - name: Verify governance CI is executable
        run: |
          test -f components/ahg_conductor.py
          test -f components/ahg_recovery.py
          test -f specs/DGAFContainment.tla
          test -f specs/DGAFContainment.cfg
          echo 'Governance CI checks completed.'

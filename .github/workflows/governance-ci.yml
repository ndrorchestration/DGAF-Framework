name: Governance CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  governance-ci:
    name: Governance CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest numpy

      - name: Compile Python components
        run: python -m compileall -q components tests

      - name: Run P-42 conductor and recovery tests
        run: python -m pytest -q tests/test_ahg_conductor.py tests/test_ahg_recovery.py

      - name: Verify governance CI is executable
        run: |
          test -f components/ahg_conductor.py
          test -f components/ahg_recovery.py
          test -f specs/DGAFContainment.tla
          test -f specs/DGAFContainment.cfg
          echo 'Governance CI checks completed.'

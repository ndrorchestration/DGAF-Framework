name: Governance CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # E2b/M6 must verify the exact tree executing this workflow. On pull_request,
  # github.sha is the synthetic merge commit, so bind to the PR head instead.
  PDMAL_TARGET_CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  governance-ci:
    name: Governance CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest numpy networkx jsonschema==4.26.0

      - name: Emit E2b/M6 evidence in isolated hash-pinned verifier environment
        run: |
          python -m venv .e2b-venv
          . .e2b-venv/bin/activate
          python -m pip install --require-hashes -r experiments/pdmal_pilot/requirements-full-lock.txt
          python scripts/emit_freeze_control_evidence.py
          mkdir -p artifacts/e2b_environment
          python -m pip freeze > artifacts/e2b_environment/pip_freeze.txt
          python -m pip --version > artifacts/e2b_environment/pip_version.txt
        env:
          PDMAL_MODE: contract

      - name: Upload E2b/M6 evidence
        uses: actions/upload-artifact@v4
        with:
          name: dgaf-freeze-control-evidence
          path: |
            artifacts/freeze_controls/*.json
            artifacts/e2b_environment/*

      - name: Compile Python components
        run: python -m compileall -q components tests evaluations experiments/pdmal_pilot scripts

      - name: Run P-42 conductor and recovery tests
        run: python -m pytest -q tests/test_ahg_conductor.py tests/test_ahg_recovery.py

      - name: Run P8 pilot artifact and analysis tests
        run: python -m pytest -q experiments/pdmal_pilot/test_analysis.py experiments/pdmal_pilot/test_security_controls.py

      - name: Run agent authority invariant tests
        run: python -m pytest -q tests/test_agent_authority_invariant.py tests/test_agent_authority_matrix.py tests/test_agent_authority_reconciliation.py

      - name: Run Issue #32 deterministic evaluation slices
        run: |
          mkdir -p artifacts
          python -m pytest -q tests/test_role_boundary_coherence.py
          python evaluations/role_boundary_coherence.py --output artifacts/role_boundary_coherence.json
          python -m pytest -q tests/test_governance_schema_conformance.py
          python evaluations/governance_schema_conformance.py --output artifacts/governance_schema_conformance.json
          python -m pytest -q tests/test_contraction_proof_fidelity.py
          python evaluations/contraction_proof_fidelity.py --output artifacts/contraction_proof_fidelity.json

      - name: Run Issue #64 evaluation-integrity fixture tests
        run: |
          python -m pytest -q tests/test_evaluation_integrity_fixture_suite.py
          python evaluations/evaluation_integrity_fixture_suite.py --output artifacts/evaluation_integrity_fixture_suite.json

      - name: Add evaluation provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          records = {
              'role_boundary_coherence': 'artifacts/role_boundary_coherence.json',
              'governance_schema_conformance': 'artifacts/governance_schema_conformance.json',
              'contraction_proof_fidelity': 'artifacts/contraction_proof_fidelity.json',
              'evaluation_integrity_fixture_suite': 'artifacts/evaluation_integrity_fixture_suite.json',
          }
          provenance = {
              'source_commit': '${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}',
              'workflow_run_id': '${{ github.run_id }}',
              'job': 'governance-ci',
              'python_version': '3.12',
          }
          for name, raw_path in records.items():
              path = Path(raw_path)
              data = json.loads(path.read_text(encoding='utf-8'))
              evidence = dict(provenance)
              evidence['evidence_class'] = data.get('evidence_class', 'SYNTHETIC')
              evidence['scope'] = 'repository-authored deterministic fixture evaluation'
              evidence['retained_artifact'] = raw_path
              evidence['limitations'] = data.get('limitations', [])
              data['evidence_record'] = evidence
              path.write_text(json.dumps(data, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Upload evaluation evidence
        uses: actions/upload-artifact@v4
        with:
          name: dgaf-evaluation-evidence
          path: |
            artifacts/role_boundary_coherence.json
            artifacts/governance_schema_conformance.json
            artifacts/contraction_proof_fidelity.json
            artifacts/evaluation_integrity_fixture_suite.json

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download pinned TLA+ Tools release
        run: |
          curl --fail --location --retry 3 --output tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          echo 'eabd140a70f49eb9305a3bd3f3df944eddf87e5a90d329789085f8953a80533a  tla2tools.jar' | sha256sum --check --strict

      - name: Model-check DGAF containment
        run: |
          mkdir -p artifacts
          set -o pipefail
          java -cp tla2tools.jar tlc2.TLC -config specs/DGAFContainment.cfg specs/DGAFContainment.tla 2>&1 | tee artifacts/tlc_model_check.txt

      - name: Record TLC evidence metadata
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          text = Path('artifacts/tlc_model_check.txt').read_text(encoding='utf-8', errors='replace')
          distinct = re.search(r'(\d+) distinct states found', text)
          generated = re.search(r'(\d+) states generated', text)
          depth = re.search(r'depth of the complete state graph is (\d+)', text)
          version = re.search(r'TLC2 Version ([^\n]+)', text)
          no_error = 'Model checking completed. No error has been found.' in text
          evidence = {
              'evidence_class': 'BOUNDED_FORMAL_MODEL_CHECK', 'source_commit': '${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}',
              'workflow_run_id': '${{ github.run_id }}', 'job': 'governance-ci',
              'java_version': '17', 'tool': 'TLA+ Tools', 'tool_release': 'v1.8.0',
              'tool_sha256': 'ab323b79802aedc3203b3f9af37c6aca3ed43f4e0225b36f2aa77b26de46c05f',
              'command': 'java -cp tla2tools.jar tlc2.TLC -config specs/DGAFContainment.cfg specs/DGAFContainment.tla',
              'result': 'PASS' if no_error else 'FAIL', 'no_error_found': no_error,
              'states_generated': int(generated.group(1)) if generated else None,
              'distinct_states': int(distinct.group(1)) if distinct else None,
              'graph_depth': int(depth.group(1)) if depth else None,
              'tlc_version': version.group(1).strip() if version else None,
              'scope': 'bounded state-space/model checking defined by the current TLA+ specification and configuration',
              'not_claimed': ['unbounded mathematical proof', 'live production execution', 'real-world efficacy'],
              'raw_log': 'artifacts/tlc_model_check.txt',
          }
          Path('artifacts/tlc_evidence.json').write_text(json.dumps(evidence, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Upload formal model evidence
        uses: actions/upload-artifact@v4
        with:
          name: dgaf-tlc-model-check
          path: |
            artifacts/tlc_model_check.txt
            artifacts/tlc_evidence.json

      - name: Verify governance CI is executable
        run: |
          test -f components/ahg_conductor.py
          test -f components/ahg_recovery.py
          test -f specs/DGAFContainment.tla
          test -f specs/DGAFContainment.cfg
          test -f experiments/pdmal_pilot/analysis.py
          test -f experiments/pdmal_pilot/pilot_artifact_schema.py
          test -f experiments/pdmal_pilot/test_analysis.py
          test -f experiments/pdmal_pilot/test_security_controls.py
          test -f scripts/emit_freeze_control_evidence.py
          test -f evaluations/evaluation_integrity_fixture_suite.py
          test -f tests/test_evaluation_integrity_fixture_suite.py
          test -f tests/test_agent_authority_invariant.py
          test -f tests/test_agent_authority_matrix.py
          test -f tests/test_agent_authority_reconciliation.py
          test -f docs/agents/AGENT_AUTHORITY_INVARIANT.md
          test -f docs/agents/AGENT_AUTHORITY_MATRIX.md
          test -f docs/agents/AGENT_AUTHORITY_RECONCILIATION.md
          echo 'Governance CI checks completed.'

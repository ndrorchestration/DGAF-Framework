name: Vocabulary Translation Matrix

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  vocabulary-translation-matrix:
    name: Vocabulary Translation Matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: '3.12'
      - name: Install pinned test dependency
        run: python -m pip install pytest==9.1.1
      - name: Validate canonical vocabulary registry
        run: python scripts/validate_vocabulary_translation_matrix.py
      - name: Validate acronym and identifier completeness
        run: python scripts/validate_acronym_registry.py
      - name: Run vocabulary regression tests
        run: python -m pytest -q tests/test_vocabulary_translation_matrix.py tests/test_acronym_registry.py

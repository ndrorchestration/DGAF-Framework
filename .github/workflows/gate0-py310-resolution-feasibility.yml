name: Gate 0 Python 3.10 Test-Only Resolution Feasibility

# Research-only dry run. No accepted locks or protected checks are changed.
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/py310_test_resolution_feasibility.py'
      - 'tests/test_py310_test_resolution_feasibility.py'
      - '.github/workflows/gate0-py310-resolution-feasibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python310-dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Set up Python 3.10 for authentic resolver metadata
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: '3.10'
      - name: Bootstrap pinned pip without changing repository pins
        run: bash scripts/bootstrap_ci_pip.sh
      - name: Run non-empirical negative controls
        run: python -m unittest discover -s tests -p test_py310_test_resolution_feasibility.py -v
      - name: Generate ephemeral counterfactual direct requirements
        run: >-
          python scripts/py310_test_resolution_feasibility.py prepare
          --source requirements-ci.txt --output-dir test-artifacts/py310-resolution
      - name: Dry-run resolver without installing or overwriting canonical locks
        run: |
          python -m pip install --dry-run --ignore-installed --only-binary=:all: \
            --report test-artifacts/py310-resolution/pip-report.json \
            -r test-artifacts/py310-resolution/py310-test-only-research.in
      - name: Evaluate scanner-only dependency removal (never security authorization)
        run: >-
          python scripts/py310_test_resolution_feasibility.py evaluate
          --output-dir test-artifacts/py310-resolution
          --pip-report test-artifacts/py310-resolution/pip-report.json
      - name: Preserve source-bound experiment inputs/results even if blocked
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate0-py310-test-only-resolution-feasibility
          path: |
            test-artifacts/py310-resolution/plan.json
            test-artifacts/py310-resolution/py310-test-only-research.in
            test-artifacts/py310-resolution/evaluation.json
          if-no-files-found: warn

name: Track A Epoch 002 Locked Result Admission

on:
  pull_request:
    paths:
      - '.github/workflows/track-a-epoch-002-locked-result-admission.yml'
      - 'requirements-ci.txt'
      - 'requirements-ci-py312-ubuntu2404-x64.lock'
      - 'scripts/bootstrap_ci_pip.sh'
      - 'tests/test_ci_lock_contract.py'
      - 'scripts/validate_track_a_epoch_002_locked_analysis_result.py'
      - 'scripts/prepare_track_a_epoch_002_locked_analysis_result_record.py'
      - 'tests/test_track_a_epoch_002_locked_analysis_result_admission.py'
      - 'docs/experiment/TRACK_A_EPOCH_002_LOCKED_RESULT_ADMISSION_PROCEDURE.md'
      - 'docs/experiment/track_a_runs/TRACK_A_EPOCH_002_LOCKED_ANALYSIS_RESULT_RECORD.json'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/track-a-epoch-002-locked-result-admission.yml'
      - 'requirements-ci.txt'
      - 'requirements-ci-py312-ubuntu2404-x64.lock'
      - 'scripts/bootstrap_ci_pip.sh'
      - 'tests/test_ci_lock_contract.py'
      - 'scripts/validate_track_a_epoch_002_locked_analysis_result.py'
      - 'scripts/prepare_track_a_epoch_002_locked_analysis_result_record.py'
      - 'tests/test_track_a_epoch_002_locked_analysis_result_admission.py'
      - 'docs/experiment/TRACK_A_EPOCH_002_LOCKED_RESULT_ADMISSION_PROCEDURE.md'
      - 'docs/experiment/track_a_runs/TRACK_A_EPOCH_002_LOCKED_ANALYSIS_RESULT_RECORD.json'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Epoch 002 locked result admission
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact evaluated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact checkout identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: '3.12.3'

      - name: Bootstrap exact pip resolver
        run: bash scripts/bootstrap_ci_pip.sh

      - name: Install hash-locked CI-only validation dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          --require-hashes
          --only-binary=:all:
          -r requirements-ci-py312-ubuntu2404-x64.lock

      - name: Compile result-admission tooling
        run: |
          python -m py_compile scripts/validate_track_a_epoch_002_locked_analysis_result.py
          python -m py_compile scripts/prepare_track_a_epoch_002_locked_analysis_result_record.py

      - name: Resolve result lifecycle mode
        id: mode
        run: |
          set -euo pipefail
          result='docs/experiment/track_a_runs/TRACK_A_EPOCH_002_LOCKED_ANALYSIS_RESULT_RECORD.json'
          prior=''
          case "${{ github.event_name }}" in
            pull_request) prior="${{ github.event.pull_request.base.sha }}" ;;
            push) prior="${{ github.event.before }}" ;;
          esac

          if test -e "$result"; then
            if test -n "$prior" && git cat-file -e "$prior:$result" 2>/dev/null && git diff --quiet "$prior" HEAD -- "$result"; then
              echo 'value=accepted_state' >> "$GITHUB_OUTPUT"
            else
              echo 'value=result_event' >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'value=tooling_only' >> "$GITHUB_OUTPUT"
          fi

      - name: Validate prospective result tooling
        if: ${{ steps.mode.outputs.value == 'tooling_only' }}
        run: python scripts/validate_track_a_epoch_002_locked_analysis_result.py --tooling

      - name: Validate creation-only result event
        if: ${{ steps.mode.outputs.value == 'result_event' }}
        env:
          ACCEPTED_PARENT: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          test -n "$ACCEPTED_PARENT"
          python scripts/validate_track_a_epoch_002_locked_analysis_result.py \
            --event-commit HEAD \
            --accepted-parent "$ACCEPTED_PARENT"

      - name: Validate accepted immutable result state
        if: ${{ steps.mode.outputs.value == 'accepted_state' }}
        run: python scripts/validate_track_a_epoch_002_locked_analysis_result.py --accepted-state

      - name: Run synthetic-only result-admission tests
        run: python -m pytest -q tests/test_track_a_epoch_002_locked_analysis_result_admission.py

      - name: Prove CI has no empirical execution surface
        run: |
          set -euo pipefail
          workflow='.github/workflows/track-a-epoch-002-locked-result-admission.yml'
          ! grep -q -- '--analysis-output' "$workflow"
          ! grep -q 'unblinded_analysis_input' "$workflow"
          ! grep -q 'run_track_a_epoch_002_locked_primary_analysis.py' "$workflow"
          echo 'TRACK_A_EPOCH_002_RESULT_ADMISSION_CI=PASS_NONEXECUTING'
          echo 'SCIENTIFIC_N_INCREMENT=0'
          echo 'CANONICAL_DGAF_EFFICACY=NOT_ESTABLISHED'

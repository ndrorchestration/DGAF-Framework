name: AOSS Stage A Collector Foundation

on:
  pull_request:
    paths:
      - '.github/workflows/aoss-stage-a-collector-foundation.yml'
      - 'scripts/aoss_stage_a/**'
      - 'scripts/run_aoss_v0_6_stage_a.py'
      - 'tests/test_aoss_stage_a_*.py'
      - 'docs/research/AOSS_V0_6_STAGE_A_COLLECTOR_FOUNDATION.md'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/aoss-stage-a-collector-foundation.yml'
      - 'scripts/aoss_stage_a/**'
      - 'scripts/run_aoss_v0_6_stage_a.py'
      - 'tests/test_aoss_stage_a_*.py'
      - 'docs/research/AOSS_V0_6_STAGE_A_COLLECTOR_FOUNDATION.md'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  foundation:
    name: Non-collecting Stage A foundation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact evaluated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact checkout identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'

      - name: Install repository CI dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Run focused non-collecting foundation suite
        run: |
          python -m pytest -q \
            tests/test_aoss_stage_a_preflight.py \
            tests/test_aoss_stage_a_custody.py \
            tests/test_aoss_stage_a_cli.py \
            tests/test_aoss_v0_6_stage_a_collection_authorization.py \
            tests/test_aoss_v0_6_acp_adapter.py \
            tests/test_aoss_v0_6_stage_a_decision_policy.py \
            tests/test_aoss_stage_a_policy_input_mapping.py \
            tests/test_aoss_stage_a_runtime_binding.py \
            tests/test_aoss_stage_a_source_driver_binding.py \
            tests/test_aoss_stage_a_executable_destination_binding.py \
            tests/test_aoss_stage_a_ingest_freshness.py \
            tests/test_aoss_stage_a_replay.py \
            tests/test_aoss_stage_a_attempt_integrity.py \
            tests/test_aoss_stage_a_execution_admission.py \
            tests/test_aoss_stage_a_execution_identity_review.py \
            tests/test_aoss_stage_a_execution_identity_candidate.py \
            tests/test_aoss_stage_a_external_admission_decision_intake.py \
            tests/test_aoss_stage_a_external_evidence_reverification.py \
            tests/test_aoss_stage_a_reviewer_trust_verification_intake.py \
            tests/test_aoss_stage_a_local_adjudication_candidate.py \
            tests/test_aoss_stage_a_installed_environment_evidence.py \
            tests/test_aoss_stage_a_installed_environment_acceptance.py \
            tests/test_aoss_v0_6_stage_a_acp_direct_baseline.py

      - name: Verify prospective exact runtime binding
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.aoss_stage_a.runtime_binding import verify_runtime_binding
          report = verify_runtime_binding(Path("."))
          assert report["runtime_binding"] == "PASS_PROSPECTIVE_NON_COLLECTING"
          assert report["collection_execution_readiness"] == "NOT_ESTABLISHED"
          assert report["outcomes_generated"] is False
          PY

      - name: Verify synthetic environment manifest contract
        run: |
          python - <<'PY'
          from scripts.aoss_stage_a.environment_manifest import validate_synthetic_manifest
          manifest = {
              "record_type": "AOSS_V0_6_STAGE_A_ENVIRONMENT_MANIFEST",
              "status": "SYNTHETIC_FIXTURE_NOT_INSTALLED_ENVIRONMENT",
              "manifest_id": "ci-synthetic-fixture",
              "manifest_status": "NOT_ESTABLISHED",
              "runtime_binding_record_type": "AOSS_V0_6_STAGE_A_RUNTIME_BINDING",
              "interpreter_implementation": "cpython",
              "interpreter_version": "3.12.3",
              "dependency_lock_sha256": "81c1ade0b76ff38cbdcbe4ddbc615c273f02dc97a9ff055c8c2889940a2ca6bd",
              "platform_system": "SyntheticOS",
              "platform_machine": "synthetic-machine",
              "environment_observed_at": "2026-09-21T00:00:00Z",
              "source_driver_binding": "NOT_ESTABLISHED",
              "collection_execution_readiness": "NOT_ESTABLISHED",
              "outcomes_generated": False,
              "scientific_n_increment": 0,
          }
          report = validate_synthetic_manifest(manifest)
          assert report["manifest_validation"] == "PASS_SYNTHETIC_FIXTURE_NON_COLLECTING"
          assert report["collection_execution_readiness"] == "NOT_ESTABLISHED"
          assert report["outcomes_generated"] is False
          PY

      - name: Observe runtime facts without accepting environment readiness
        run: |
          python - <<'PY'
          import json
          from scripts.aoss_stage_a.environment_manifest import (
              observe_unaccepted_environment_manifest,
              validate_unaccepted_environment_manifest,
          )
          manifest = observe_unaccepted_environment_manifest()
          report = validate_unaccepted_environment_manifest(manifest)
          assert manifest["status"] == "OBSERVED_NOT_ACCEPTED"
          assert report["manifest_validation"] == "PASS_OBSERVED_NOT_ACCEPTED"
          assert report["collection_execution_readiness"] == "NOT_ESTABLISHED"
          assert report["outcomes_generated"] is False
          print(json.dumps(manifest, sort_keys=True))
          PY

      - name: Capture installed-environment evidence candidate without accepting it
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from scripts.aoss_stage_a.installed_environment_evidence import (
              capture_installed_environment_evidence_candidate,
              validate_installed_environment_evidence_candidate,
          )
          observed_at = datetime.now(timezone.utc).replace(microsecond=0).isoformat()
          candidate = capture_installed_environment_evidence_candidate(
              observed_at=observed_at,
          )
          report = validate_installed_environment_evidence_candidate(candidate)
          assert report["candidate_validation"] == "PASS_OBSERVED_CANDIDATE_NOT_ACCEPTED"
          assert report["installed_environment_acceptance"] == "NOT_ESTABLISHED"
          assert report["source_driver_binding"] == "NOT_ESTABLISHED"
          assert report["execution_allowed"] is False
          assert report["collection_execution_readiness"] == "NOT_ESTABLISHED"
          assert report["outcomes_generated"] is False
          assert report["scientific_n_increment"] == 0
          print(json.dumps(candidate, sort_keys=True))
          PY

      - name: Prepare environment acceptance packet without adjudication
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from scripts.aoss_stage_a.installed_environment_acceptance import (
              prepare_installed_environment_acceptance_packet,
              validate_installed_environment_acceptance_packet,
          )
          from scripts.aoss_stage_a.installed_environment_evidence import (
              capture_installed_environment_evidence_candidate,
          )

          observed_at = datetime.now(timezone.utc).replace(microsecond=0).isoformat()
          candidate = capture_installed_environment_evidence_candidate(
              observed_at=observed_at,
          )
          packet = prepare_installed_environment_acceptance_packet(
              candidate=candidate,
              candidate_source_ref="ci://aoss-stage-a/environment-candidate",
          )
          report = validate_installed_environment_acceptance_packet(
              packet,
              candidate=candidate,
          )

          assert report["packet_validation"] == "PASS_STRUCTURAL_BINDING_ONLY"
          assert report["external_adjudication"] == "NOT_EXECUTED"
          assert report["installed_environment_acceptance"] == "NOT_ESTABLISHED"
          assert report["execution_allowed"] is False
          assert report["collection_execution_readiness"] == "NOT_ESTABLISHED"
          assert report["scientific_n_increment"] == 0
          PY

      - name: Verify proposed source-driver binding without accepting execution
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.aoss_stage_a.source_driver_binding import (
              validate_unaccepted_source_driver_binding,
          )
          binding = json.loads(
              Path(
                  "registry/aoss_v0_6_stage_a_source_driver_binding_v1.json"
              ).read_text(encoding="utf-8")
          )
          report = validate_unaccepted_source_driver_binding(binding)
          assert report["catalog_binding"] == "PASS_PROPOSED_NON_COLLECTING"
          assert report["source_driver_binding"] == "NOT_ESTABLISHED"
          assert report["driver_execution"] == "NOT_PERFORMED"
          assert report["collection_execution_readiness"] == "NOT_ESTABLISHED"
          assert report["outcomes_generated"] is False
          print(json.dumps(report, sort_keys=True))
          PY

      - name: Verify proposed executable and fixture identities without accepting execution
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.aoss_stage_a.executable_destination_binding import (
              validate_proposed_executable_destination_binding,
          )
          binding = json.loads(
              Path(
                  "registry/aoss_v0_6_stage_a_executable_destination_binding_v1.json"
              ).read_text(encoding="utf-8")
          )
          report = validate_proposed_executable_destination_binding(binding)
          assert report["identity_contract"] == "PASS_PROPOSED_NON_COLLECTING"
          assert report["executable_acceptance"] == "NOT_ESTABLISHED"
          assert report["destination_acceptance"] == "NOT_ESTABLISHED"
          assert report["execution"] == "NOT_PERFORMED"
          assert report["collection_execution_readiness"] == "NOT_ESTABLISHED"
          assert report["outcomes_generated"] is False
          print(json.dumps(report, sort_keys=True))
          PY

      - name: Verify execution identity review remains blocked on fixture identities
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.aoss_stage_a.execution_identity_review import (
              prepare_execution_identity_review_packet,
              validate_execution_identity_review_packet,
          )

          root = Path(".")
          source = json.loads(
              (root / "registry/aoss_v0_6_stage_a_source_driver_binding_v1.json").read_text()
          )
          identities = json.loads(
              (
                  root
                  / "registry/aoss_v0_6_stage_a_executable_destination_binding_v1.json"
              ).read_text()
          )
          packet = prepare_execution_identity_review_packet(
              source_driver_binding=source,
              executable_destination_binding=identities,
              source_driver_ref="registry://aoss/source-driver-binding-v1",
              executable_destination_ref="registry://aoss/executable-destination-binding-v1",
          )
          report = validate_execution_identity_review_packet(
              packet,
              source_driver_binding=source,
              executable_destination_binding=identities,
          )
          assert report["packet_validation"] == "PASS_BLOCKED_REVIEW_PACKET"
          assert "REAL_EXECUTABLE_IDENTITY_REQUIRED" in report["blockers"]
          assert "REAL_DESTINATION_IDENTITY_REQUIRED" in report["blockers"]
          assert "REAL_ATTEMPT_IDENTITY_REQUIRED" in report["blockers"]
          assert report["external_adjudication"] == "NOT_EXECUTED"
          assert report["execution_allowed"] is False
          assert report["collection_execution_readiness"] == "NOT_ESTABLISHED"
          assert report["scientific_n_increment"] == 0
          PY

      - name: Verify non-fixture execution identity candidate without acceptance
        run: |
          python - <<'PY'
          from scripts.aoss_stage_a.execution_identity_candidate import (
              prepare_execution_identity_candidate,
              validate_execution_identity_candidate,
          )

          candidate = prepare_execution_identity_candidate(
              interpreter_path="/opt/python/3.12.3/bin/python",
              interpreter_sha256="a" * 64,
              argv=["-m", "aoss_stage_a_driver", "--plan", "stage-a"],
              working_directory="/srv/aoss-stage-a",
              destination_uri="file:///srv/aoss-stage-a/retained/attempt-0001",
              attempt_id="aoss-stage-a-attempt-0001",
              recipe_catalog_sha256="b" * 64,
              environment_candidate_record_sha256="c" * 64,
          )
          report = validate_execution_identity_candidate(candidate)

          assert report["candidate_validation"] == "PASS_NON_FIXTURE_IDENTITY_CANDIDATE"
          assert report["installed_environment_acceptance"] == "NOT_ESTABLISHED"
          assert report["source_driver_binding"] == "NOT_ESTABLISHED"
          assert report["executable_acceptance"] == "NOT_ESTABLISHED"
          assert report["destination_acceptance"] == "NOT_ESTABLISHED"
          assert report["external_adjudication"] == "NOT_EXECUTED"
          assert report["execution_allowed"] is False
          assert report["collection_execution_readiness"] == "NOT_ESTABLISHED"
          assert report["scientific_n_increment"] == 0
          PY

      - name: Validate external admission decision intake without promotion
        run: |
          python - <<'PY'
          from scripts.aoss_stage_a.execution_identity_candidate import (
              prepare_execution_identity_candidate,
          )
          from scripts.aoss_stage_a.external_admission_decision_intake import (
              prepare_external_admission_decision_intake,
              record_sha256,
              validate_external_admission_decision_intake,
          )
          from scripts.aoss_stage_a.installed_environment_evidence import (
              capture_installed_environment_evidence_candidate,
          )

          environment = capture_installed_environment_evidence_candidate(
              observed_at="2026-09-21T23:30:00Z",
          )
          identity = prepare_execution_identity_candidate(
              interpreter_path="/opt/python/3.12.3/bin/python",
              interpreter_sha256="a" * 64,
              argv=["-m", "aoss_stage_a_driver", "--plan", "stage-a"],
              working_directory="/srv/aoss-stage-a",
              destination_uri="file:///srv/aoss-stage-a/retained/attempt-0001",
              attempt_id="aoss-stage-a-attempt-0001",
              recipe_catalog_sha256="b" * 64,
              environment_candidate_record_sha256=record_sha256(environment),
          )
          intake = prepare_external_admission_decision_intake(
              environment_candidate=environment,
              execution_identity_candidate=identity,
              reviewer_identity="external-reviewer:ci-fixture",
              reviewed_at="2026-09-21T23:31:00Z",
              external_record_uri="https://example.invalid/aoss-stage-a/decision.json",
              external_record_sha256="d" * 64,
              independence_claimed=True,
              independence_basis="CI structural fixture only",
              installed_environment_decision="ACCEPT",
              source_driver_executable_decision="ACCEPT",
              destination_attempt_decision="ACCEPT",
          )
          report = validate_external_admission_decision_intake(
              intake,
              environment_candidate=environment,
              execution_identity_candidate=identity,
          )

          assert report["intake_validation"] == "PASS_EXTERNAL_DECISION_STRUCTURAL_ONLY"
          assert report["reviewer_attribution_verified"] is False
          assert report["independence_verified"] is False
          assert report["local_adjudication"] == "NOT_EXECUTED"
          assert report["installed_environment_acceptance"] == "NOT_ESTABLISHED"
          assert report["source_driver_binding"] == "NOT_ESTABLISHED"
          assert report["executable_acceptance"] == "NOT_ESTABLISHED"
          assert report["destination_acceptance"] == "NOT_ESTABLISHED"
          assert report["execution_allowed"] is False
          assert report["collection_execution_readiness"] == "NOT_ESTABLISHED"
          assert report["scientific_n_increment"] == 0
          PY

      - name: Verify external evidence bytes without promoting trust
        run: |
          python - <<'PY'
          import hashlib
          from scripts.aoss_stage_a.execution_identity_candidate import (
              prepare_execution_identity_candidate,
          )
          from scripts.aoss_stage_a.external_admission_decision_intake import (
              prepare_external_admission_decision_intake,
              record_sha256,
          )
          from scripts.aoss_stage_a.external_evidence_reverification import (
              prepare_external_evidence_reverification_packet,
              validate_external_evidence_reverification_packet,
          )
          from scripts.aoss_stage_a.installed_environment_evidence import (
              capture_installed_environment_evidence_candidate,
          )

          external_bytes = b'{"decision":"ACCEPT","scope":"ci-fixture"}\n'
          attribution_bytes = b'{"reviewer":"ci-fixture"}\n'
          environment = capture_installed_environment_evidence_candidate(
              observed_at="2026-09-21T23:40:00Z",
          )
          identity = prepare_execution_identity_candidate(
              interpreter_path="/opt/python/3.12.3/bin/python",
              interpreter_sha256="a" * 64,
              argv=["-m", "aoss_stage_a_driver", "--plan", "stage-a"],
              working_directory="/srv/aoss-stage-a",
              destination_uri="file:///srv/aoss-stage-a/retained/attempt-0001",
              attempt_id="aoss-stage-a-attempt-0001",
              recipe_catalog_sha256="b" * 64,
              environment_candidate_record_sha256=record_sha256(environment),
          )
          intake = prepare_external_admission_decision_intake(
              environment_candidate=environment,
              execution_identity_candidate=identity,
              reviewer_identity="external-reviewer:ci-fixture",
              reviewed_at="2026-09-21T23:41:00Z",
              external_record_uri="https://example.invalid/aoss-stage-a/decision.json",
              external_record_sha256=hashlib.sha256(external_bytes).hexdigest(),
              independence_claimed=True,
              independence_basis="CI fixture claim only",
              installed_environment_decision="ACCEPT",
              source_driver_executable_decision="ACCEPT",
              destination_attempt_decision="ACCEPT",
          )
          artifacts = [
              (
                  "reviewer-attribution",
                  "https://example.invalid/aoss-stage-a/reviewer.json",
                  hashlib.sha256(attribution_bytes).hexdigest(),
                  attribution_bytes,
              )
          ]
          packet = prepare_external_evidence_reverification_packet(
              intake=intake,
              environment_candidate=environment,
              execution_identity_candidate=identity,
              retrieval_source_uri="https://example.invalid/aoss-stage-a/decision.json",
              retrieved_at="2026-09-21T23:42:00Z",
              external_record_bytes=external_bytes,
              attribution_artifacts=artifacts,
          )
          report = validate_external_evidence_reverification_packet(
              packet,
              intake=intake,
              environment_candidate=environment,
              execution_identity_candidate=identity,
              external_record_bytes=external_bytes,
              attribution_artifacts=artifacts,
          )

          assert report["reverification"] == "PASS_DECLARED_BYTES_MATCH_SHA256"
          assert report["external_record_retrieved"] is True
          assert report["reviewer_attribution_verified"] is False
          assert report["independence_verified"] is False
          assert report["local_adjudication"] == "NOT_EXECUTED"
          assert report["execution_allowed"] is False
          assert report["collection_execution_readiness"] == "NOT_ESTABLISHED"
          assert report["scientific_n_increment"] == 0
          PY

      - name: Record external trust findings without local trust promotion
        run: |
          python - <<'PY'
          from scripts.aoss_stage_a.reviewer_trust_verification_intake import (
              prepare_reviewer_trust_verification_intake,
              validate_reviewer_trust_verification_intake,
          )

          external_admission = {
              "record_type": "AOSS_V0_6_STAGE_A_EXTERNAL_ADMISSION_DECISION_INTAKE",
              "status": "EXTERNAL_DECISION_UNVERIFIED_NOT_ADJUDICATED",
              "controller_issue": 901,
              "fixture": "ci-structural-only",
          }
          reverification = {
              "record_type": "AOSS_V0_6_STAGE_A_EXTERNAL_EVIDENCE_REVERIFICATION_PACKET",
              "status": "CRYPTOGRAPHIC_BYTES_MATCHED_NO_TRUST_PROMOTION",
              "controller_issue": 901,
              "cryptographic_reverification": "PASS_DECLARED_BYTES_MATCH_SHA256",
              "reviewer_attribution_evidence": [
                  {
                      "artifact_id": "reviewer-attribution",
                      "declared_sha256": "b" * 64,
                      "observed_sha256": "b" * 64,
                      "digest_match": True,
                  }
              ],
              "reviewer_attribution_verified": False,
              "independence_verified": False,
              "local_adjudication": "NOT_EXECUTED",
              "execution_allowed": False,
              "collection_execution_readiness": "NOT_ESTABLISHED",
              "scientific_n_increment": 0,
          }
          intake = prepare_reviewer_trust_verification_intake(
              external_admission_intake=external_admission,
              reverification_packet=reverification,
              verifier_identity="external-trust-verifier:ci-fixture",
              verified_at="2026-09-21T23:50:00Z",
              verification_record_uri="https://example.invalid/aoss/trust-verification.json",
              verification_record_sha256="a" * 64,
              verification_method_summary="CI structural fixture only",
              reviewer_attribution_finding="VERIFIED",
              independence_finding="VERIFIED",
          )
          report = validate_reviewer_trust_verification_intake(
              intake,
              external_admission_intake=external_admission,
              reverification_packet=reverification,
          )

          assert report["intake_validation"] == "PASS_EXTERNAL_TRUST_FINDINGS_STRUCTURAL_ONLY"
          assert report["external_findings"]["reviewer_attribution"] == "VERIFIED"
          assert report["external_findings"]["independence"] == "VERIFIED"
          assert report["reviewer_attribution_verified"] is False
          assert report["independence_verified"] is False
          assert report["local_adjudication"] == "NOT_EXECUTED"
          assert report["execution_allowed"] is False
          assert report["collection_execution_readiness"] == "NOT_ESTABLISHED"
          assert report["scientific_n_increment"] == 0
          PY

      - name: Verify local adjudication candidate remains blocked
        run: |
          python - <<'PY'
          from scripts.aoss_stage_a.external_admission_decision_intake import record_sha256
          from scripts.aoss_stage_a.local_adjudication_candidate import (
              prepare_local_adjudication_candidate,
              validate_local_adjudication_candidate,
          )

          external_admission = {
              "record_type": "AOSS_V0_6_STAGE_A_EXTERNAL_ADMISSION_DECISION_INTAKE",
              "status": "EXTERNAL_DECISION_UNVERIFIED_NOT_ADJUDICATED",
              "controller_issue": 901,
              "fixture": "ci-structural-only",
          }
          reverification = {
              "record_type": "AOSS_V0_6_STAGE_A_EXTERNAL_EVIDENCE_REVERIFICATION_PACKET",
              "status": "CRYPTOGRAPHIC_BYTES_MATCHED_NO_TRUST_PROMOTION",
              "controller_issue": 901,
              "cryptographic_reverification": "PASS_DECLARED_BYTES_MATCH_SHA256",
              "reviewer_attribution_evidence": [
                  {
                      "artifact_id": "reviewer-attribution",
                      "declared_sha256": "b" * 64,
                      "observed_sha256": "b" * 64,
                      "digest_match": True,
                  }
              ],
              "reviewer_attribution_verified": False,
              "independence_verified": False,
              "local_adjudication": "NOT_EXECUTED",
              "execution_allowed": False,
              "collection_execution_readiness": "NOT_ESTABLISHED",
              "scientific_n_increment": 0,
          }
          trust = {
              "record_type": "AOSS_V0_6_STAGE_A_REVIEWER_TRUST_VERIFICATION_INTAKE",
              "status": "EXTERNAL_TRUST_FINDINGS_UNADJUDICATED",
              "controller_issue": 901,
              "bindings": {
                  "external_admission_intake_sha256": record_sha256(external_admission),
                  "reverification_packet_sha256": record_sha256(reverification),
              },
              "external_verification": {
                  "verifier_identity": "external-trust-verifier:ci-fixture",
                  "verified_at": "2026-09-22T00:31:00Z",
                  "verification_record_uri": "https://example.invalid/aoss/trust-verification.json",
                  "verification_record_sha256": "a" * 64,
                  "verification_method_summary": "CI structural fixture only",
                  "findings": {
                      "reviewer_attribution": "VERIFIED",
                      "independence": "VERIFIED",
                  },
              },
              "attribution_evidence_count": 1,
              "local_trust_state": {
                  "reviewer_attribution_verified": False,
                  "independence_verified": False,
              },
              "local_adjudication": "NOT_EXECUTED",
              "installed_environment_acceptance": "NOT_ESTABLISHED",
              "source_driver_binding": "NOT_ESTABLISHED",
              "executable_acceptance": "NOT_ESTABLISHED",
              "destination_acceptance": "NOT_ESTABLISHED",
              "execution_allowed": False,
              "collection_execution_readiness": "NOT_ESTABLISHED",
              "outcomes_generated": False,
              "scientific_n_increment": 0,
          }
          candidate = prepare_local_adjudication_candidate(
              external_admission_intake=external_admission,
              reverification_packet=reverification,
              reviewer_trust_intake=trust,
              adjudicator_identity="local-adjudicator:ci-fixture",
              adjudicated_at="2026-09-22T00:32:00Z",
              requested_disposition="ACCEPT",
          )
          report = validate_local_adjudication_candidate(
              candidate,
              external_admission_intake=external_admission,
              reverification_packet=reverification,
              reviewer_trust_intake=trust,
          )

          assert report["candidate_validation"] == "PASS_BLOCKED_LOCAL_ADJUDICATION_CANDIDATE"
          assert report["effective_disposition"] == "BLOCKED"
          assert report["blockers"] == [
              "LOCAL_REVIEWER_ATTRIBUTION_NOT_VERIFIED",
              "LOCAL_INDEPENDENCE_NOT_VERIFIED",
          ]
          assert report["execution_allowed"] is False
          assert report["collection_execution_readiness"] == "NOT_ESTABLISHED"
          assert report["scientific_n_increment"] == 0
          PY

      - name: Verify synthetic ingest-reference receipt without collection
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from scripts.aoss_stage_a.ingest_freshness import (
              capture_ingest_reference,
              validate_ingest_reference,
          )
          reference = capture_ingest_reference(
              "2026-09-21T12:00:00Z",
              clock=lambda: datetime(2026, 9, 21, 12, 0, 1, tzinfo=timezone.utc),
          )
          report = validate_ingest_reference(reference)
          assert report["ingest_reference"] == "PASS_SYNTHETIC_NON_COLLECTING"
          assert report["freshness"] == "FRESH"
          assert report["collection_execution_readiness"] == "NOT_ESTABLISHED"
          assert report["outcomes_generated"] is False
          assert report["scientific_n_increment"] == 0
          PY

      - name: Prove collection remains disabled
        run: |
          set +e
          output="$(python scripts/run_aoss_v0_6_stage_a.py collect 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -F 'COLLECTION_IMPLEMENTATION_NOT_ACCEPTED'

      - name: Verify whitespace
        run: git diff --check

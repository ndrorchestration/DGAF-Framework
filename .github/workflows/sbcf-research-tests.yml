name: SBCF Research Contract Tests

on:
  push:
    branches: ['research/sbcf-*']
    paths:
      - 'experiments/sbcf/**'
      - 'tests/test_sbcf*.py'
      - 'requirements-ci-py312-ubuntu2404-x64.lock'
      - 'scripts/bootstrap_ci_pip.sh'
      - '.github/workflows/sbcf-research-tests.yml'
  pull_request:
    branches: ['research/sbcf-*']
    paths:
      - 'experiments/sbcf/**'
      - 'tests/test_sbcf*.py'
      - 'requirements-ci-py312-ubuntu2404-x64.lock'
      - 'scripts/bootstrap_ci_pip.sh'
      - '.github/workflows/sbcf-research-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbcf-contract-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: '3.12'

      - name: Bootstrap exact pip resolver
        run: bash scripts/bootstrap_ci_pip.sh

      - name: Install hash-locked QA tools
        run: >-
          python -m pip install
          --disable-pip-version-check
          --require-hashes
          --only-binary=:all:
          -r requirements-ci-py312-ubuntu2404-x64.lock

      - name: Check cross-layer formatting
        run: |
          python -m black --check --line-length 120 experiments/sbcf/cross_layer.py tests/test_sbcf_cross_layer.py
          python -m isort --check-only --profile black experiments/sbcf/cross_layer.py tests/test_sbcf_cross_layer.py

      - name: Run complete SBCF synthetic test group
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/test_sbcf*.py -ra

      - name: Record evidence boundary
        if: always()
        run: |
          {
            echo '### SBCF research verification'
            echo 'Candidate: ${{ github.event.pull_request.head.sha || github.sha }}'
            echo 'Scope: synthetic SBCF tests, including cross-layer fixtures.'
            echo 'Expected failures retain known rollback and crash-consistency gaps.'
            echo 'No live containment, independent validation, scientific N increment, or release authority is established.'
          } >> "$GITHUB_STEP_SUMMARY"

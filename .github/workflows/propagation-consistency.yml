name: Propagation Consistency (Advisory)

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  propagation-consistency:
    name: Propagation consistency — advisory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate document-control R2 temporal routing
        run: python3 scripts/validate_document_control_r2.py

      - name: Run propagation and canonical claim-surface consistency checker
        run: |
          python3 scripts/propagation_check.py \
            --registry registry/propagation_registry.json \
            --root . \
            --claims evidence/claims.json \
            --card-index docs/evidence/CLAIM_CARD_INDEX.yaml \
            --json > propagation-report.json
          python3 scripts/propagation_check.py \
            --registry registry/propagation_registry.json \
            --root . \
            --claims evidence/claims.json \
            --card-index docs/evidence/CLAIM_CARD_INDEX.yaml

      - name: Upload propagation report
        uses: actions/upload-artifact@v4
        with:
          name: propagation-consistency-report
          path: propagation-report.json

name: Track A Epoch 002 Materialization Receipt

on:
  pull_request:
    paths:
      - '.github/workflows/track-a-epoch-002-materialization.yml'
      - 'docs/experiment/TRACK_A_EPOCH_002_MATERIALIZATION_EVIDENCE_SCHEMA.json'
      - 'docs/experiment/TRACK_A_EPOCH_002_MATERIALIZATION_PROCEDURE.md'
      - 'docs/experiment/TRACK_A_EPOCH_002_DATASET_LOCK_EVIDENCE_SCHEMA.json'
      - 'docs/experiment/TRACK_A_EPOCH_002_RESULT_RECORD_SCHEMA.json'
      - 'docs/experiment/TRACK_A_EPOCH_002_RESULT_RECORD_SEMANTICS.json'
      - 'docs/experiment/track_a_runs/TRACK_A_EPOCH_002_DATASET_LOCK_EVIDENCE.json'
      - 'docs/experiment/track_a_runs/TRACK_A_EPOCH_002_DATASET_LOCK_RECEIPT.json'
      - 'docs/experiment/track_a_runs/TRACK_A_EPOCH_002_UNBLINDING_DECISION_RECORD.json'
      - 'docs/experiment/track_a_runs/TRACK_A_EPOCH_002_MATERIALIZATION_EVIDENCE.json'
      - 'docs/experiment/track_a_runs/TRACK_A_EPOCH_002_MATERIALIZATION_RECEIPT.json'
      - 'scripts/validate_track_a_epoch_002_materialization.py'
      - 'tests/test_track_a_epoch_002_materialization.py'
      - 'tests/test_track_a_epoch_002_materialization_operator_provenance.py'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/track-a-epoch-002-materialization.yml'
      - 'docs/experiment/TRACK_A_EPOCH_002_MATERIALIZATION_EVIDENCE_SCHEMA.json'
      - 'docs/experiment/TRACK_A_EPOCH_002_MATERIALIZATION_PROCEDURE.md'
      - 'docs/experiment/TRACK_A_EPOCH_002_DATASET_LOCK_EVIDENCE_SCHEMA.json'
      - 'docs/experiment/TRACK_A_EPOCH_002_RESULT_RECORD_SCHEMA.json'
      - 'docs/experiment/TRACK_A_EPOCH_002_RESULT_RECORD_SEMANTICS.json'
      - 'docs/experiment/track_a_runs/TRACK_A_EPOCH_002_DATASET_LOCK_EVIDENCE.json'
      - 'docs/experiment/track_a_runs/TRACK_A_EPOCH_002_DATASET_LOCK_RECEIPT.json'
      - 'docs/experiment/track_a_runs/TRACK_A_EPOCH_002_UNBLINDING_DECISION_RECORD.json'
      - 'docs/experiment/track_a_runs/TRACK_A_EPOCH_002_MATERIALIZATION_EVIDENCE.json'
      - 'docs/experiment/track_a_runs/TRACK_A_EPOCH_002_MATERIALIZATION_RECEIPT.json'
      - 'scripts/validate_track_a_epoch_002_materialization.py'
      - 'tests/test_track_a_epoch_002_materialization.py'
      - 'tests/test_track_a_epoch_002_materialization_operator_provenance.py'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Epoch 002 materialization boundary
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact evaluated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact checkout identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'

      - name: Install pinned validation environment
        run: python -m pip install -r requirements-ci.txt

      - name: Compile validator
        run: python -m py_compile scripts/validate_track_a_epoch_002_materialization.py

      - name: Resolve materialization validation mode
        id: mode
        run: |
          set -euo pipefail
          evidence='docs/experiment/track_a_runs/TRACK_A_EPOCH_002_MATERIALIZATION_EVIDENCE.json'
          receipt='docs/experiment/track_a_runs/TRACK_A_EPOCH_002_MATERIALIZATION_RECEIPT.json'
          if test -e "$receipt"; then
            test -e "$evidence"
            echo 'value=receipt_event' >> "$GITHUB_OUTPUT"
          elif test -e "$evidence"; then
            echo 'value=evidence_admission' >> "$GITHUB_OUTPUT"
          else
            echo 'value=tooling_only' >> "$GITHUB_OUTPUT"
          fi

      - name: Validate prospective tooling only
        if: ${{ steps.mode.outputs.value == 'tooling_only' }}
        run: python scripts/validate_track_a_epoch_002_materialization.py --tooling-only

      - name: Validate creation-only evidence admission
        if: ${{ steps.mode.outputs.value == 'evidence_admission' }}
        run: python scripts/validate_track_a_epoch_002_materialization.py --validate-evidence-admission

      - name: Validate one-file materialization receipt event
        if: ${{ steps.mode.outputs.value == 'receipt_event' }}
        run: python scripts/validate_track_a_epoch_002_materialization.py --validate-receipt-event

      - name: Prove corrective tooling PR changes only the dedicated lane
        if: ${{ github.event_name == 'pull_request' && steps.mode.outputs.value == 'tooling_only' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          expected=(
            '.github/workflows/track-a-epoch-002-materialization.yml'
            'docs/experiment/TRACK_A_EPOCH_002_MATERIALIZATION_EVIDENCE_SCHEMA.json'
            'docs/experiment/TRACK_A_EPOCH_002_MATERIALIZATION_PROCEDURE.md'
            'scripts/validate_track_a_epoch_002_materialization.py'
            'tests/test_track_a_epoch_002_materialization.py'
            'tests/test_track_a_epoch_002_materialization_operator_provenance.py'
          )
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" HEAD | sort)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq "${#expected_sorted[@]}"
          diff -u \
            <(printf '%s\n' "${expected_sorted[@]}") \
            <(printf '%s\n' "${changed[@]}")

      - name: Run materialization adversarial tests
        run: |
          python -m pytest \
            tests/test_track_a_epoch_002_materialization.py \
            tests/test_track_a_epoch_002_materialization_operator_provenance.py \
            -q

      - name: Prove validator has no secret, decryption, writer, or analysis surface
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('scripts/validate_track_a_epoch_002_materialization.py').read_text()
          forbidden = (
              '--write',
              '--execute',
              '--private-key',
              '--passphrase',
              '--blinding-secret',
              '--protected-plaintext',
              '--decrypted-mapping',
              'PDMAL_TOPOLOGY_BLINDING_KEY',
              'BEGIN PRIVATE KEY',
              'BEGIN ENCRYPTED PRIVATE KEY',
              'openssl cms -decrypt',
              'openssl cms -encrypt',
              'run_primary_analysis',
          )
          for marker in forbidden:
              assert marker not in source, marker
          print('MATERIALIZATION_VALIDATOR_ONLY=TRUE')
          print('MATERIALIZATION_TOOLING_DECRYPTS_PROTECTED_MAPPING=FALSE')
          print('MATERIALIZATION_TOOLING_AUTHORIZES_PRIMARY_ANALYSIS=FALSE')
          print('MATERIALIZATION_TOOLING_EXECUTES_PRIMARY_ANALYSIS=FALSE')
          PY

      - name: Prove fail-closed scientific boundary
        env:
          MODE: ${{ steps.mode.outputs.value }}
        run: |
          set -euo pipefail
          evidence='docs/experiment/track_a_runs/TRACK_A_EPOCH_002_MATERIALIZATION_EVIDENCE.json'
          receipt='docs/experiment/track_a_runs/TRACK_A_EPOCH_002_MATERIALIZATION_RECEIPT.json'
          analysis_auth='docs/experiment/track_a_runs/TRACK_A_EPOCH_002_PRIMARY_ANALYSIS_AUTHORIZATION_RECORD.json'
          analysis_result='docs/experiment/track_a_runs/TRACK_A_EPOCH_002_LOCKED_ANALYSIS_RESULT_RECORD.json'

          test -e docs/experiment/track_a_runs/TRACK_A_EPOCH_002_DATASET_LOCK_RECEIPT.json
          test -e docs/experiment/track_a_runs/TRACK_A_EPOCH_002_UNBLINDING_DECISION_RECORD.json
          test ! -e "$analysis_auth"
          test ! -e "$analysis_result"

          case "$MODE" in
            tooling_only)
              test ! -e "$evidence"
              test ! -e "$receipt"
              echo 'TRACK_A_EPOCH_002_MATERIALIZATION=NOT_ESTABLISHED'
              ;;
            evidence_admission)
              test -e "$evidence"
              test ! -e "$receipt"
              echo 'TRACK_A_EPOCH_002_MATERIALIZATION_EVIDENCE=ADMITTED_PENDING_RECEIPT'
              ;;
            receipt_event)
              test -e "$evidence"
              test -e "$receipt"
              echo 'TRACK_A_EPOCH_002_MATERIALIZATION_RECEIPT=VALIDATED_PENDING_ACCEPTANCE'
              ;;
            *)
              exit 1
              ;;
          esac

          echo 'TRACK_A_EPOCH_002_DATASET_LOCK=ESTABLISHED'
          echo 'TRACK_A_EPOCH_002_UNBLINDING=AUTHORIZED_BOUNDED'
          echo 'TRACK_A_EPOCH_002_PRIMARY_ANALYSIS=NOT_AUTHORIZED_NOT_RUN'
          echo 'SCIENTIFIC_N_INCREMENT=0'
          echo 'CANONICAL_DGAF_EFFICACY=NOT_ESTABLISHED'

name: Track A Epoch 002 Materialization Receipt

on:
  pull_request:
    paths:
      - '.github/workflows/track-a-epoch-002-materialization.yml'
      - 'docs/experiment/TRACK_A_EPOCH_002_MATERIALIZATION_EVIDENCE_SCHEMA.json'
      - 'docs/experiment/TRACK_A_EPOCH_002_OPERATOR_MATERIALIZATION_EXECUTION_RECEIPT_SCHEMA.json'
      - 'docs/experiment/TRACK_A_EPOCH_002_MATERIALIZATION_PROCEDURE.md'
      - 'docs/experiment/TRACK_A_EPOCH_002_DATASET_LOCK_EVIDENCE_SCHEMA.json'
      - 'docs/experiment/TRACK_A_EPOCH_002_RESULT_RECORD_SCHEMA.json'
      - 'docs/experiment/TRACK_A_EPOCH_002_RESULT_RECORD_SEMANTICS.json'
      - 'docs/experiment/track_a_runs/TRACK_A_EPOCH_002_DATASET_LOCK_EVIDENCE.json'
      - 'docs/experiment/track_a_runs/TRACK_A_EPOCH_002_DATASET_LOCK_RECEIPT.json'
      - 'docs/experiment/track_a_runs/TRACK_A_EPOCH_002_UNBLINDING_DECISION_RECORD.json'
      - 'docs/experiment/track_a_runs/TRACK_A_EPOCH_002_MATERIALIZATION_EVIDENCE.json'
      - 'docs/experiment/track_a_runs/TRACK_A_EPOCH_002_MATERIALIZATION_RECEIPT.json'
      - 'scripts/dgaf_local_operator_bridge.py'
      - 'scripts/prepare_track_a_epoch_002_operator_materialization.py'
      - 'scripts/prepare_track_a_epoch_002_materialization_receipt.py'
      - 'scripts/materialize_track_a_epoch_002_unblinded_input.py'
      - 'scripts/validate_track_a_epoch_002_materialization.py'
      - 'tests/test_dgaf_local_operator_bridge.py'
      - 'tests/test_track_a_epoch_002_materialization.py'
      - 'tests/test_track_a_epoch_002_materialization_receipt_preparer.py'
      - 'tests/test_track_a_epoch_002_materialization_operator_bundle.py'
      - 'tests/test_track_a_epoch_002_materialization_operator_provenance.py'
      - 'tests/test_track_a_epoch_002_operator_materialization_execution_receipt.py'
      - 'tests/test_track_a_epoch_002_unblinded_materializer.py'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/track-a-epoch-002-materialization.yml'
      - 'docs/experiment/TRACK_A_EPOCH_002_MATERIALIZATION_EVIDENCE_SCHEMA.json'
      - 'docs/experiment/TRACK_A_EPOCH_002_OPERATOR_MATERIALIZATION_EXECUTION_RECEIPT_SCHEMA.json'
      - 'docs/experiment/TRACK_A_EPOCH_002_MATERIALIZATION_PROCEDURE.md'
      - 'docs/experiment/TRACK_A_EPOCH_002_DATASET_LOCK_EVIDENCE_SCHEMA.json'
      - 'docs/experiment/TRACK_A_EPOCH_002_RESULT_RECORD_SCHEMA.json'
      - 'docs/experiment/TRACK_A_EPOCH_002_RESULT_RECORD_SEMANTICS.json'
      - 'docs/experiment/track_a_runs/TRACK_A_EPOCH_002_DATASET_LOCK_EVIDENCE.json'
      - 'docs/experiment/track_a_runs/TRACK_A_EPOCH_002_DATASET_LOCK_RECEIPT.json'
      - 'docs/experiment/track_a_runs/TRACK_A_EPOCH_002_UNBLINDING_DECISION_RECORD.json'
      - 'docs/experiment/track_a_runs/TRACK_A_EPOCH_002_MATERIALIZATION_EVIDENCE.json'
      - 'docs/experiment/track_a_runs/TRACK_A_EPOCH_002_MATERIALIZATION_RECEIPT.json'
      - 'scripts/dgaf_local_operator_bridge.py'
      - 'scripts/prepare_track_a_epoch_002_operator_materialization.py'
      - 'scripts/materialize_track_a_epoch_002_unblinded_input.py'
      - 'scripts/validate_track_a_epoch_002_materialization.py'
      - 'tests/test_dgaf_local_operator_bridge.py'
      - 'tests/test_track_a_epoch_002_materialization.py'
      - 'tests/test_track_a_epoch_002_materialization_operator_bundle.py'
      - 'tests/test_track_a_epoch_002_materialization_operator_provenance.py'
      - 'tests/test_track_a_epoch_002_operator_materialization_execution_receipt.py'
      - 'tests/test_track_a_epoch_002_unblinded_materializer.py'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Epoch 002 materialization boundary
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact evaluated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact checkout identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'

      - name: Install pinned validation environment
        run: python -m pip install -r requirements-ci.txt

      - name: Compile materialization tooling
        run: |
          python -m py_compile scripts/validate_track_a_epoch_002_materialization.py
          python -m py_compile scripts/prepare_track_a_epoch_002_operator_materialization.py
          python -m py_compile scripts/prepare_track_a_epoch_002_materialization_receipt.py
          python -m py_compile scripts/materialize_track_a_epoch_002_unblinded_input.py

      - name: Resolve materialization validation mode
        id: mode
        run: |
          set -euo pipefail
          evidence='docs/experiment/track_a_runs/TRACK_A_EPOCH_002_MATERIALIZATION_EVIDENCE.json'
          receipt='docs/experiment/track_a_runs/TRACK_A_EPOCH_002_MATERIALIZATION_RECEIPT.json'

          prior=''
          case "${{ github.event_name }}" in
            pull_request)
              prior="${{ github.event.pull_request.base.sha }}"
              ;;
            push)
              prior="${{ github.event.before }}"
              ;;
          esac

          unchanged_from_prior() {
            local path="$1"
            test -n "$prior" || return 1
            git cat-file -e "$prior:$path" 2>/dev/null || return 1
            git diff --quiet "$prior" HEAD -- "$path"
          }

          if test -e "$receipt"; then
            test -e "$evidence"
            if unchanged_from_prior "$receipt"; then
              echo 'value=post_receipt_tooling' >> "$GITHUB_OUTPUT"
            else
              echo 'value=receipt_event' >> "$GITHUB_OUTPUT"
            fi
          elif test -e "$evidence"; then
            if unchanged_from_prior "$evidence"; then
              echo 'value=post_evidence_tooling' >> "$GITHUB_OUTPUT"
            else
              echo 'value=evidence_admission' >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'value=tooling_only' >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve Stage-1 to Stage-2 binding state
        id: binding
        run: |
          set -euo pipefail
          materializer_commit="$(python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path('scripts/prepare_track_a_epoch_002_operator_materialization.py')
          spec = importlib.util.spec_from_file_location('epoch002_operator_bundle_binding', path)
          assert spec is not None and spec.loader is not None
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          print(module.MATERIALIZER_COMMIT)
          PY
          )"
          if git diff --quiet "$materializer_commit" -- scripts/materialize_track_a_epoch_002_unblinded_input.py; then
            echo 'value=bound' >> "$GITHUB_OUTPUT"
          else
            echo 'value=stage1_candidate_pending_rebind' >> "$GITHUB_OUTPUT"
          fi

      - name: Validate prospective tooling only
        if: ${{ steps.mode.outputs.value == 'tooling_only' }}
        run: python scripts/validate_track_a_epoch_002_materialization.py --tooling-only

      - name: Validate creation-only evidence admission
        if: ${{ steps.mode.outputs.value == 'evidence_admission' }}
        run: python scripts/validate_track_a_epoch_002_materialization.py --validate-evidence-admission

      - name: Validate one-file materialization receipt event
        if: ${{ steps.mode.outputs.value == 'receipt_event' }}
        run: python scripts/validate_track_a_epoch_002_materialization.py --validate-receipt-event

      - name: Validate post-admission immutable materialization state
        if: ${{ steps.mode.outputs.value == 'post_evidence_tooling' || steps.mode.outputs.value == 'post_receipt_tooling' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          MODE: ${{ steps.mode.outputs.value }}
        run: |
          set -euo pipefail
          evidence='docs/experiment/track_a_runs/TRACK_A_EPOCH_002_MATERIALIZATION_EVIDENCE.json'
          receipt='docs/experiment/track_a_runs/TRACK_A_EPOCH_002_MATERIALIZATION_RECEIPT.json'

          test -n "$BASE_SHA"
          git cat-file -e "$BASE_SHA:$evidence"
          git diff --quiet "$BASE_SHA" HEAD -- "$evidence"

          if [ "$MODE" = 'post_receipt_tooling' ]; then
            git cat-file -e "$BASE_SHA:$receipt"
            git diff --quiet "$BASE_SHA" HEAD -- "$receipt"
            test -e "$receipt"
          else
            test ! -e "$receipt"
          fi

      - name: Prove tooling PR stays inside the dedicated materialization lane
        if: ${{ github.event_name == 'pull_request' && (steps.mode.outputs.value == 'tooling_only' || steps.mode.outputs.value == 'post_evidence_tooling' || steps.mode.outputs.value == 'post_receipt_tooling') }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          allowed=(
            '.github/workflows/track-a-epoch-002-materialization.yml'
            'docs/experiment/TRACK_A_EPOCH_002_MATERIALIZATION_EVIDENCE_SCHEMA.json'
            'docs/experiment/TRACK_A_EPOCH_002_OPERATOR_MATERIALIZATION_EXECUTION_RECEIPT_SCHEMA.json'
            'docs/experiment/TRACK_A_EPOCH_002_MATERIALIZATION_PROCEDURE.md'
            'scripts/dgaf_local_operator_bridge.py'
            'scripts/prepare_track_a_epoch_002_operator_materialization.py'
            'scripts/prepare_track_a_epoch_002_materialization_receipt.py'
            'scripts/materialize_track_a_epoch_002_unblinded_input.py'
            'scripts/validate_track_a_epoch_002_materialization.py'
            'tests/test_dgaf_local_operator_bridge.py'
            'tests/test_track_a_epoch_002_materialization.py'
            'tests/test_track_a_epoch_002_materialization_receipt_preparer.py'
            'tests/test_track_a_epoch_002_materialization_operator_bundle.py'
            'tests/test_track_a_epoch_002_materialization_operator_provenance.py'
            'tests/test_track_a_epoch_002_operator_materialization_execution_receipt.py'
            'tests/test_track_a_epoch_002_unblinded_materializer.py'
          )
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" HEAD | sort)
          test "${#changed[@]}" -gt 0
          for path in "${changed[@]}"; do
            printf '%s\n' "${allowed[@]}" | grep -Fxq -- "$path" || {
              echo "out-of-lane materialization tooling path: $path" >&2
              exit 1
            }
          done

      - name: Run Stage-1 materializer and validator tests
        run: |
          python -m pytest \
            tests/test_track_a_epoch_002_materialization.py \
            tests/test_track_a_epoch_002_materialization_receipt_preparer.py \
            tests/test_track_a_epoch_002_unblinded_materializer.py \
            -q

      - name: Run bound Stage-2 operator-bundle tests
        if: ${{ steps.binding.outputs.value == 'bound' }}
        run: |
          python -m pytest \
            tests/test_track_a_epoch_002_materialization_operator_provenance.py \
            tests/test_track_a_epoch_002_materialization_operator_bundle.py \
            tests/test_track_a_epoch_002_operator_materialization_execution_receipt.py \
            -q

      - name: Prove unbound Stage-2 fails closed pending accepted Stage-1 rebind
        if: ${{ steps.binding.outputs.value == 'stage1_candidate_pending_rebind' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path('scripts/prepare_track_a_epoch_002_operator_materialization.py')
          spec = importlib.util.spec_from_file_location('epoch002_operator_bundle_fail_closed', path)
          assert spec is not None and spec.loader is not None
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          try:
              module.load_repository_contracts()
          except SystemExit as error:
              message = str(error)
              assert 'scripts/materialize_track_a_epoch_002_unblinded_input.py drifted from its accepted commit' in message
          else:
              raise AssertionError('Stage-2 unexpectedly accepted unbound Stage-1 materializer bytes')

          print('TRACK_A_EPOCH_002_STAGE1_REPAIR=VALIDATED_PENDING_ACCEPTED_REBIND')
          print('TRACK_A_EPOCH_002_STAGE2_OPERATOR_BUNDLE=FAIL_CLOSED_PENDING_REBIND')
          PY

      - name: Prove validator has no secret, decryption, writer, or analysis surface
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('scripts/validate_track_a_epoch_002_materialization.py').read_text()
          forbidden = (
              '--write',
              '--execute',
              '--private-key',
              '--passphrase',
              '--blinding-secret',
              '--protected-plaintext',
              '--decrypted-mapping',
              'PDMAL_TOPOLOGY_BLINDING_KEY',
              'BEGIN PRIVATE KEY',
              'BEGIN ENCRYPTED PRIVATE KEY',
              'openssl cms -decrypt',
              'openssl cms -encrypt',
              'run_primary_analysis',
          )
          for marker in forbidden:
              assert marker not in source, marker
          print('MATERIALIZATION_VALIDATOR_ONLY=TRUE')
          print('MATERIALIZATION_TOOLING_DECRYPTS_PROTECTED_MAPPING=FALSE')
          print('MATERIALIZATION_TOOLING_AUTHORIZES_PRIMARY_ANALYSIS=FALSE')
          print('MATERIALIZATION_TOOLING_EXECUTES_PRIMARY_ANALYSIS=FALSE')
          PY

      - name: Prove fail-closed scientific boundary
        env:
          MODE: ${{ steps.mode.outputs.value }}
        run: |
          set -euo pipefail
          evidence='docs/experiment/track_a_runs/TRACK_A_EPOCH_002_MATERIALIZATION_EVIDENCE.json'
          receipt='docs/experiment/track_a_runs/TRACK_A_EPOCH_002_MATERIALIZATION_RECEIPT.json'
          analysis_auth='docs/experiment/track_a_runs/TRACK_A_EPOCH_002_PRIMARY_ANALYSIS_AUTHORIZATION_RECORD.json'
          analysis_result='docs/experiment/track_a_runs/TRACK_A_EPOCH_002_LOCKED_ANALYSIS_RESULT_RECORD.json'

          test -e docs/experiment/track_a_runs/TRACK_A_EPOCH_002_DATASET_LOCK_RECEIPT.json
          test -e docs/experiment/track_a_runs/TRACK_A_EPOCH_002_UNBLINDING_DECISION_RECORD.json

          case "$MODE" in
            tooling_only)
              test ! -e "$evidence"
              test ! -e "$receipt"
              test ! -e "$analysis_auth"
              test ! -e "$analysis_result"
              echo 'TRACK_A_EPOCH_002_MATERIALIZATION=NOT_ESTABLISHED'
              echo 'TRACK_A_EPOCH_002_PRIMARY_ANALYSIS=NOT_AUTHORIZED_NOT_RUN'
              ;;
            evidence_admission)
              test -e "$evidence"
              test ! -e "$receipt"
              test ! -e "$analysis_auth"
              test ! -e "$analysis_result"
              echo 'TRACK_A_EPOCH_002_MATERIALIZATION_EVIDENCE=ADMITTED_PENDING_RECEIPT'
              echo 'TRACK_A_EPOCH_002_PRIMARY_ANALYSIS=NOT_AUTHORIZED_NOT_RUN'
              ;;
            receipt_event)
              test -e "$evidence"
              test -e "$receipt"
              test ! -e "$analysis_auth"
              test ! -e "$analysis_result"
              echo 'TRACK_A_EPOCH_002_MATERIALIZATION_RECEIPT=VALIDATED_PENDING_ACCEPTANCE'
              echo 'TRACK_A_EPOCH_002_PRIMARY_ANALYSIS=NOT_AUTHORIZED_NOT_RUN'
              ;;
            post_evidence_tooling)
              test -e "$evidence"
              test ! -e "$receipt"
              echo 'TRACK_A_EPOCH_002_MATERIALIZATION_EVIDENCE=ESTABLISHED_PRESERVED'
              echo 'TRACK_A_EPOCH_002_SUCCESSOR_STATE=OUT_OF_SCOPE_PRESERVED'
              ;;
            post_receipt_tooling)
              test -e "$evidence"
              test -e "$receipt"
              echo 'TRACK_A_EPOCH_002_MATERIALIZATION_RECEIPT=ESTABLISHED_PRESERVED'
              echo 'TRACK_A_EPOCH_002_SUCCESSOR_STATE=OUT_OF_SCOPE_PRESERVED'
              ;;
            *)
              exit 1
              ;;
          esac

          echo 'TRACK_A_EPOCH_002_DATASET_LOCK=ESTABLISHED'
          echo 'TRACK_A_EPOCH_002_UNBLINDING=AUTHORIZED_BOUNDED'
          echo 'SCIENTIFIC_N_INCREMENT=0'
          echo 'CANONICAL_DGAF_EFFICACY=NOT_ESTABLISHED'

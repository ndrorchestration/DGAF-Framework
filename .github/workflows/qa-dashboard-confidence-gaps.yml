name: Orchestrate Dashboard Confidence-Gap QA

on:
  push:
    branches: [qa/1411-confidence-gap-20261020]
    paths:
      - 'dashboard/lib/orchestrate-presentation.mjs'
      - 'dashboard/components/PhiTrajectory.jsx'
      - 'tests/orchestrate-confidence-segments.test.mjs'
      - '.github/workflows/qa-dashboard-confidence-gaps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  presentation-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read-only checkout of isolated candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Install fixed Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify only presentation normalization and regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node --test tests/orchestrate-presentation.test.mjs tests/orchestrate-confidence-segments.test.mjs

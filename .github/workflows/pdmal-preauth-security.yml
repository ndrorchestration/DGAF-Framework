name: PDMAL Pre-Authorization Security

on:
  pull_request:
    paths:
      - 'experiments/pdmal_pilot/**'
      - 'docs/experiment/**'
      - '.github/workflows/pdmal-preauth-security.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/pdmal_pilot/**'
      - 'docs/experiment/**'
      - '.github/workflows/pdmal-preauth-security.yml'

permissions:
  contents: read

jobs:
  security-and-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.0'
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r experiments/pdmal_pilot/requirements-full-lock.txt
      - name: Run adversarial controls
        env:
          PYTHONPATH: experiments/pdmal_pilot
        run: python -m pytest experiments/pdmal_pilot/test_security_controls.py -q
      - name: Run locked P8 analysis tests
        env:
          PYTHONPATH: experiments/pdmal_pilot
        run: python -m pytest experiments/pdmal_pilot/test_analysis.py -q
      - name: Run pilot artifact schema tests
        env:
          PYTHONPATH: .:experiments/pdmal_pilot
        run: python -m pytest experiments/pdmal_pilot/test_pilot_artifact_schema.py -q
      - name: Run execution contract tests
        env:
          PYTHONPATH: experiments/pdmal_pilot
        run: python -m pytest experiments/pdmal_pilot/test_execution_contract.py -q
      - name: Run durable retention tests
        env:
          PYTHONPATH: experiments/pdmal_pilot
        run: python -m pytest experiments/pdmal_pilot/test_durable_retention.py -q
      - name: Verify contract mode remains non-empirical
        env:
          PDMAL_MODE: contract
          PYTHONPATH: experiments/pdmal_pilot
        run: python experiments/pdmal_pilot/run_pilot.py --seeds 2

name: Truth Layer Tests

on:
  push:
  pull_request:

jobs:
  truth-layer-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: '3.12'
      - name: Install evidence-test dependencies
        run: python -m pip install -r requirements-epistemic.txt
      - name: Run evidence-tier and runtime truth tests
        run: pytest -q tests/test_evidence_mode.py tests/test_evidence_card_schema.py tests/test_runtime_truth_contract.py

name: DGAF v1 Control-Plane Contract

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - "pptl/governance_envelope.py"
      - "pptl/state_identity.py"
      - "pptl/budget_ledger.py"
      - "pptl/branch_registry.py"
      - "pptl/control_plane.py"
      - "pptl/commit_gate.py"
      - "pptl/tests/test_v1_control_plane.py"
      - ".github/workflows/control-plane-contract.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  contracts:
    name: V1 Control-Plane Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest

      - name: Run control-plane contracts
        run: python -m pytest -q pptl/tests/test_v1_control_plane.py

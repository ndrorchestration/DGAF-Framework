name: DGAF v1 Control-Plane Contract

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - "pptl/governance_envelope.py"
      - "pptl/state_identity.py"
      - "pptl/budget_ledger.py"
      - "pptl/branch_registry.py"
      - "pptl/control_plane.py"
      - "pptl/commit_gate.py"
      - "pptl/triadic_governance_loop.py"
      - "pptl/tests/test_v1_control_plane.py"
      - "pptl/tests/test_v1_tgl_integration.py"
      - "pptl/tests/test_v1_adversarial_contract.py"
      - "pptl/tests/test_v1_capability_boundaries.py"
      - "pptl/tests/test_v1_seal_verification.py"
      - "docs/architecture/DGAF_V1_AGENT_ROLE_MAPPING.md"
      - "docs/governance/DGAF_V1_FINALIZATION_GATE.md"
      - "docs/architecture/DGAF_V1_EXECUTION_READINESS.md"
      - "requirements-ci.txt"
      - "requirements-ci-control-plane-py312-ubuntu2404-x64.lock"
      - "scripts/bootstrap_ci_pip.sh"
      - "tests/test_ci_lock_contract.py"
      - ".github/workflows/control-plane-contract.yml"
  push:
    branches:
      - "feat/dgaf-v1-control-plane-finalize-20260829"
    paths:
      - "pptl/governance_envelope.py"
      - "pptl/state_identity.py"
      - "pptl/budget_ledger.py"
      - "pptl/branch_registry.py"
      - "pptl/control_plane.py"
      - "pptl/commit_gate.py"
      - "pptl/triadic_governance_loop.py"
      - "pptl/tests/test_v1_control_plane.py"
      - "pptl/tests/test_v1_tgl_integration.py"
      - "pptl/tests/test_v1_adversarial_contract.py"
      - "pptl/tests/test_v1_capability_boundaries.py"
      - "pptl/tests/test_v1_seal_verification.py"
      - "requirements-ci.txt"
      - "requirements-ci-control-plane-py312-ubuntu2404-x64.lock"
      - "scripts/bootstrap_ci_pip.sh"
      - "tests/test_ci_lock_contract.py"
      - ".github/workflows/control-plane-contract.yml"
  workflow_dispatch:

jobs:
  contracts:
    name: V1 Control-Plane Contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Assert exact candidate checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: "3.12"
      - name: Bootstrap exact pip resolver
        run: bash scripts/bootstrap_ci_pip.sh
      - name: Install hash-locked control-plane dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          --require-hashes
          --only-binary=:all:
          -r requirements-ci-control-plane-py312-ubuntu2404-x64.lock
      - name: Assert bound pandas version
        run: python -c "import pandas; assert pandas.__version__ == '3.0.5'"
      - name: Run deterministic contracts
        run: >-
          python -m pytest -q
          pptl/tests/test_v1_control_plane.py
          pptl/tests/test_v1_tgl_integration.py
          pptl/tests/test_v1_adversarial_contract.py
          pptl/tests/test_v1_capability_boundaries.py
          pptl/tests/test_v1_seal_verification.py

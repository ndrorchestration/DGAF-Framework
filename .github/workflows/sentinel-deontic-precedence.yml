name: Sentinel P-29 Deontic Precedence

on:
  pull_request:
    paths:
      - 'components/evaluate_router_v1_1.py'
      - 'tests/test_sentinel_deontic_precedence.py'
      - '.github/workflows/sentinel-deontic-precedence.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: '3.12.0'
      - name: Install focused test dependency
        run: python -m pip install pytest==8.4.2
      - name: Run focused Sentinel precedence tests
        run: python -m pytest tests/test_sentinel_deontic_precedence.py -q

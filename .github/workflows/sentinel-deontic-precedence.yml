name: Sentinel P-29 Deontic Precedence

on:
  pull_request:
    paths:
      - 'components/evaluate_router_v1_1.py'
      - 'tests/test_sentinel_deontic_precedence.py'
      - '.github/workflows/sentinel-deontic-precedence.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.0'
      - name: Run focused Sentinel precedence tests
        run: python -m pytest tests/test_sentinel_deontic_precedence.py -q

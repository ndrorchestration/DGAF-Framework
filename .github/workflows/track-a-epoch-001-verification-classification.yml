name: Track A Epoch 001 Verification Classification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/track-a-epoch-001-verification-classification.yml'
      - 'scripts/validate_track_a_epoch_001_verification_classification.py'
      - 'tests/test_track_a_epoch_001_verification_classification.py'
      - 'docs/experiment/track_a_runs/TRACK_A_EPOCH_001_VERIFICATION_CLASSIFICATION.json'
      - 'docs/experiment/track_a_runs/TRACK_A_EPOCH_001_COLLECTION_AUTHORIZATION.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Prove checkout is exact PR head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Python 3.12.0
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.0'
          check-latest: false

      - name: Run verification-validator mutation tests
        run: python -m unittest -v tests/test_track_a_epoch_001_verification_classification.py

      - name: Validate verification tooling, exact event, or established successor state
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_SHA^{commit}"

          verification='docs/experiment/track_a_runs/TRACK_A_EPOCH_001_VERIFICATION_CLASSIFICATION.json'
          authorization='docs/experiment/track_a_runs/TRACK_A_EPOCH_001_COLLECTION_AUTHORIZATION.json'
          workflow='.github/workflows/track-a-epoch-001-verification-classification.yml'
          validator='scripts/validate_track_a_epoch_001_verification_classification.py'
          tests='tests/test_track_a_epoch_001_verification_classification.py'

          mapfile -t changed < <(git diff --name-only "$BASE_SHA" HEAD | sort)

          if printf '%s\n' "${changed[@]}" | grep -Fxq "$verification"; then
            # Exact verification event: preserve the original one-parent/one-file
            # semantics and require collection authorization to remain absent.
            python "$validator"
            test ! -e "$authorization"
          elif test -e "$verification"; then
            # Verification is already established. Prove its exact immutable
            # blob/content/history/ancestry while successor-specific validators
            # govern later authorization semantics.
            python "$validator" --expect-established

            # Verification-tooling maintenance must stay exactly three-file scoped;
            # never combine this compatibility repair with successor/scientific edits.
            if printf '%s\n' "${changed[@]}" | grep -Fxq "$workflow" || \
               printf '%s\n' "${changed[@]}" | grep -Fxq "$validator" || \
               printf '%s\n' "${changed[@]}" | grep -Fxq "$tests"; then
              expected=("$workflow" "$validator" "$tests")
              mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
              test "${#changed[@]}" -eq "${#expected_sorted[@]}"
              diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")
            fi
          else
            # Historical/tooling-install mode before verification exists.
            python "$validator" --expect-absent
            expected=("$workflow" "$validator" "$tests")
            mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
            test "${#changed[@]}" -eq "${#expected_sorted[@]}"
            diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")
            test ! -e "$authorization"
          fi

      - name: Prove verification gate itself remains non-authorizing
        run: |
          echo 'TRACK_A_CLOSURE = ESTABLISHED'
          echo 'TRACK_A_VERIFICATION = ESTABLISHED_OR_EXACT_EVENT_VALIDATED'
          echo 'TRACK_A_EMPIRICAL_EXECUTION = GOVERNED_BY_COLLECTION_AUTHORIZATION_GATE'
          echo 'VERIFICATION_SCIENTIFIC_N_INCREMENT = 0'
          echo 'CANONICAL_DGAF_EFFICACY = NOT_ESTABLISHED_BY_VERIFICATION'
          echo 'HIGH_ASSURANCE = NOT_AUTHORIZED_BY_VERIFICATION'

name: B1 Semantic Routing Safety Profile

on:
  pull_request:
    paths:
      - 'components/KAPPA/dynamic_weight_router.py'
      - 'components/evaluate_router.py'
      - 'components/evaluate_router_v1_1.py'
      - 'components/ensemble_v17.py'
      - 'experiments/pdmal_pilot/b1_semantic_routing_safety_profile.py'
      - 'experiments/pdmal_pilot/test_b1_semantic_routing_safety_profile.py'
      - 'docs/governance/DGAF_SEMANTIC_ROUTING_SAFETY_PROFILE_V1.json'
      - 'scripts/validate_b1_semantic_routing_safety_profile.py'
      - '.github/workflows/b1-semantic-routing-safety-profile.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.0'
      - name: Install focused test dependency
        run: python -m pip install pytest==9.0.3
      - name: Validate exact source binding
        run: python scripts/validate_b1_semantic_routing_safety_profile.py
      - name: Exercise B1 registered fixtures and negative controls
        run: python -m pytest experiments/pdmal_pilot/test_b1_semantic_routing_safety_profile.py -q

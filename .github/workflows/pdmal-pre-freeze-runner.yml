name: PDMAL Pre-Freeze Runner Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pdmal-pre-freeze-runner.yml'
      - 'docs/experiment/NEW_CANDIDATE_MANIFEST.md'
      - 'experiments/pdmal_pilot/**'
      - 'experiments/pdmal_topology/CONTROL_PLANE_EVIDENCE_TRIGGER.md'
  pull_request:

# Trusted pre-freeze evaluator only. This workflow must not authorize empirical
# work, create a freeze, request unblinding, or mutate repository/workflow state.
permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/experiments/pdmal_pilot
  PDMAL_MODE: contract

jobs:
  runner-contract:
    name: Exact-candidate pre-freeze P3/P5 contract evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control plane for candidate resolution
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Resolve designated candidate and control-plane identity
        shell: bash
        run: |
          set -euo pipefail
          manifest='docs/experiment/NEW_CANDIDATE_MANIFEST.md'
          test -s "$manifest"
          read_field() { awk -F': ' -v key="$1" '$1 == key {print $2; exit}' "$manifest"; }

          candidate_sha="$(read_field candidate_sha)"
          candidate_tree_sha="$(read_field candidate_tree_sha)"
          apparatus_sha="$(read_field apparatus_source_sha)"
          apparatus_tree_sha="$(read_field apparatus_source_tree_sha)"
          control_plane_sha="$(git rev-parse HEAD)"
          workflow_sha256="$(sha256sum .github/workflows/pdmal-pre-freeze-runner.yml | awk '{print $1}')"

          for value in "$candidate_sha" "$candidate_tree_sha" "$apparatus_sha" "$apparatus_tree_sha" "$control_plane_sha"; do
            [[ "$value" =~ ^[0-9a-f]{40}$ ]]
          done
          [[ "$workflow_sha256" =~ ^[0-9a-f]{64}$ ]]

          {
            echo "CANDIDATE_SHA=$candidate_sha"
            echo "CANDIDATE_TREE_SHA=$candidate_tree_sha"
            echo "APPARATUS_SOURCE_SHA=$apparatus_sha"
            echo "APPARATUS_SOURCE_TREE_SHA=$apparatus_tree_sha"
            echo "CONTROL_PLANE_SHA=$control_plane_sha"
            echo "WORKFLOW_CONTENT_SHA256=$workflow_sha256"
          } >> "$GITHUB_ENV"

          printf 'control_plane_sha=%s\n' "$control_plane_sha" >> "$GITHUB_STEP_SUMMARY"
          printf 'designated_candidate_sha=%s\n' "$candidate_sha" >> "$GITHUB_STEP_SUMMARY"
          printf 'designated_candidate_tree_sha=%s\n' "$candidate_tree_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout and verify designated runtime candidate
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${CANDIDATE_SHA}^{commit}"
          git checkout --detach "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.0'

      - name: Bind dependency lock and protocol identity
        shell: bash
        run: |
          set -euo pipefail
          lock='experiments/pdmal_pilot/requirements-full-lock.txt'
          protocol='docs/experiment/PDMAL_EXPERIMENT_PROTOCOL.md'
          test -s "$lock"
          test -s "$protocol"
          grep -Eq '^[[:space:]]*--hash=sha256:' "$lock"
          grep -Eq '^numpy==[0-9]' "$lock"
          grep -Eq '^networkx==[0-9]' "$lock"
          grep -Eq '^pytest==[0-9]' "$lock"
          grep -Eq '^pandas==[0-9]' "$lock"

          lock_sha256="$(sha256sum "$lock" | awk '{print $1}')"
          protocol_blob_sha="$(git rev-parse "HEAD:${protocol}")"
          protocol_sha256="$(sha256sum "$protocol" | awk '{print $1}')"
          [[ "$lock_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$protocol_blob_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$protocol_sha256" =~ ^[0-9a-f]{64}$ ]]
          {
            echo "DEPENDENCY_LOCK_SHA256=$lock_sha256"
            echo "PROTOCOL_BLOB_SHA=$protocol_blob_sha"
            echo "PROTOCOL_CONTENT_SHA256=$protocol_sha256"
          } >> "$GITHUB_ENV"

      - name: Install harness dependencies from full lock only
        run: python -m pip install --require-hashes -r experiments/pdmal_pilot/requirements-full-lock.txt

      - name: Run pre-freeze contract suite
        working-directory: experiments/pdmal_pilot
        run: python -m pytest test_harness_contract.py test_execution_contract.py test_task_engine.py test_dgaf_tgl_adapter.py -q

      - name: Run synthetic pilot artifact matrix contract suite
        working-directory: experiments/pdmal_pilot
        run: python -m pytest test_pilot_artifact_schema.py test_security_controls.py -q

      - name: Prove deterministic contract mode without empirical collection
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pdmal-contract-a /tmp/pdmal-contract-b
          python experiments/pdmal_pilot/run_pilot.py --seeds 2 --output-dir /tmp/pdmal-contract-a > /tmp/pdmal-contract-a.txt
          python experiments/pdmal_pilot/run_pilot.py --seeds 2 --output-dir /tmp/pdmal-contract-b > /tmp/pdmal-contract-b.txt
          diff -u /tmp/pdmal-contract-a.txt /tmp/pdmal-contract-b.txt
          grep -F 'CONTRACT_MODE_PASS: two validation seeds exercised; no empirical data collection performed' /tmp/pdmal-contract-a.txt
          test -z "$(find /tmp/pdmal-contract-a -type f -print -quit)"
          test -z "$(find /tmp/pdmal-contract-b -type f -print -quit)"

      - name: Verify pilot mode fails closed without governance authorization
        shell: bash
        env:
          PDMAL_MODE: pilot
          PDMAL_PROTOCOL_FROZEN: '0'
          PDMAL_PILOT_AUTHORIZED: '0'
        run: |
          set -euo pipefail
          rm -rf /tmp/pdmal-prohibited-pilot
          set +e
          PDMAL_FROZEN_COMMIT_SHA="$CANDIDATE_SHA" python experiments/pdmal_pilot/run_pilot.py --seeds 50 --output-dir /tmp/pdmal-prohibited-pilot > /tmp/pdmal-prohibited-pilot.txt 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -F 'pilot execution prohibited' /tmp/pdmal-prohibited-pilot.txt
          if test -d /tmp/pdmal-prohibited-pilot; then
            test -z "$(find /tmp/pdmal-prohibited-pilot -type f -print -quit)"
          fi

      - name: Build exact-candidate P3/P5 structural evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-artifacts
          python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          from dataclasses import asdict
          from pathlib import Path
          from time import perf_counter

          import networkx as nx
          import numpy as np

          from harness_contract import STREAM_IDS, deterministic_contract_run, stream_fingerprint, validate_artifact_contract
          from run_pilot import CONTRACT_ROOT_SEEDS, _environment_fingerprint

          candidate = os.environ['CANDIDATE_SHA']
          candidate_env = _environment_fingerprint()
          independent_env = hashlib.sha256(
              f"{platform.python_version()}|{np.__version__}|{nx.__version__}".encode()
          ).hexdigest()
          if candidate_env != independent_env:
              raise SystemExit('environment fingerprint mismatch')

          mock_key = b'contract-only-test-key-000000000000000000'
          artifacts = []
          stream_records = {}
          semantic_digests = []

          for seed in CONTRACT_ROOT_SEEDS:
              start = perf_counter()
              first = [asdict(x) for x in deterministic_contract_run(seed, mock_key)]
              elapsed = perf_counter() - start
              second = [asdict(x) for x in deterministic_contract_run(seed, mock_key)]
              if first != second:
                  raise SystemExit(f'contract output changed on repeat for seed {seed}')

              streams = stream_fingerprint(seed)
              spawn_keys = [tuple(streams['spawn_keys'][name]) for name in STREAM_IDS]
              if len(set(spawn_keys)) != len(STREAM_IDS):
                  raise SystemExit(f'RNG child stream collision for seed {seed}')

              artifact = {
                  'experiment_id': 'PDMAL-PRE-FREEZE-CONTRACT',
                  'protocol_commit': candidate,
                  'runner_commit': candidate,
                  'seed_id': seed,
                  'root_seed': seed,
                  'results': first,
                  'runtime_seconds': elapsed,
                  'environment_fingerprint': candidate_env,
                  'protocol_status': 'PRE-FREEZE',
                  'empirical_data_collection': False,
              }
              validate_artifact_contract(artifact)
              artifacts.append(artifact)
              stream_records[str(seed)] = streams
              semantic_digests.append(hashlib.sha256(
                  json.dumps(first, sort_keys=True, separators=(',', ':')).encode()
              ).hexdigest())

          evidence = {
              'schema_version': 1,
              'evidence_class': 'PDMAL_PRE_FREEZE_STRUCTURAL_CONTRACT',
              'epistemic_status': 'STRUCTURAL_CONTRACT_EVIDENCE_NOT_GATE_CLOSURE',
              'candidate_sha': candidate,
              'candidate_tree_sha': os.environ['CANDIDATE_TREE_SHA'],
              'apparatus_source_sha': os.environ['APPARATUS_SOURCE_SHA'],
              'apparatus_source_tree_sha': os.environ['APPARATUS_SOURCE_TREE_SHA'],
              'control_plane_sha': os.environ['CONTROL_PLANE_SHA'],
              'workflow_definition_sha': os.environ['CONTROL_PLANE_SHA'],
              'workflow_definition_content_sha256': os.environ['WORKFLOW_CONTENT_SHA256'],
              'producer_workflow': 'PDMAL Pre-Freeze Runner Validation',
              'producer_workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'producer_event': os.environ['GITHUB_EVENT_NAME'],
              'protocol_blob_sha': os.environ['PROTOCOL_BLOB_SHA'],
              'protocol_content_sha256': os.environ['PROTOCOL_CONTENT_SHA256'],
              'dependency_lock_sha256': os.environ['DEPENDENCY_LOCK_SHA256'],
              'environment': {
                  'python': platform.python_version(),
                  'numpy': np.__version__,
                  'networkx': nx.__version__,
                  'candidate_fingerprint': candidate_env,
                  'independently_recomputed_fingerprint': independent_env,
              },
              'rng_stream_fingerprints': stream_records,
              'deterministic_semantic_sha256': semantic_digests,
              'contract_artifacts': artifacts,
              'assertions': {
                  'candidate_checkout_exact': 'PASS',
                  'candidate_tree_exact': 'PASS',
                  'full_hash_locked_dependencies': 'PASS',
                  'artifact_contract_validation': 'PASS',
                  'pilot_artifact_matrix_contract_validation': 'PASS',
                  'pilot_artifact_adversarial_integrity_validation': 'PASS',
                  'environment_fingerprint_independent_recompute': 'PASS',
                  'rng_child_stream_separation': 'PASS',
                  'topology_fingerprint_determinism': 'PASS',
                  'contract_mode_repeatability': 'PASS',
                  'pilot_mode_fail_closed_without_governance_authorization': 'PASS',
              },
              'controls': {
                  'protocol_frozen': False,
                  'pilot_authorized': False,
                  'empirical_data_collection': False,
                  'unblinding_requested': False,
                  'pilot_artifact_schema_fixture_only': True,
              },
              'gate_interpretation': {
                  'P3': 'EVIDENCE_PRESENT_NOT_CLOSED',
                  'P5': 'EVIDENCE_PRESENT_NOT_CLOSED',
                  'P6': 'OPEN_FAIL_CLOSED',
              },
          }

          path = Path('test-artifacts/pdmal-pre-freeze-p3-p5-evidence.json')
          raw = (json.dumps(evidence, indent=2, sort_keys=True) + '\n').encode()
          path.write_bytes(raw)
          digest = hashlib.sha256(raw).hexdigest()
          path.with_suffix(path.suffix + '.sha256').write_text(f'{digest}  {path.name}\n', encoding='utf-8')
          print(json.dumps(evidence['assertions'], indent=2, sort_keys=True))
          PY

      - name: Verify structural evidence sidecar
        run: cd test-artifacts && sha256sum --check pdmal-pre-freeze-p3-p5-evidence.json.sha256

      - name: Upload exact-candidate structural evidence
        id: source_artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdmal-pre-freeze-contract-evidence
          path: |
            test-artifacts/pdmal-pre-freeze-p3-p5-evidence.json
            test-artifacts/pdmal-pre-freeze-p3-p5-evidence.json.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Emit source-bound P3/P5 registry
        shell: bash
        env:
          SOURCE_ARTIFACT_ID: ${{ steps.source_artifact.outputs.artifact-id }}
          SOURCE_ARTIFACT_DIGEST: ${{ steps.source_artifact.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_ARTIFACT_ID"
          test -n "$SOURCE_ARTIFACT_DIGEST"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          sidecar = Path('test-artifacts/pdmal-pre-freeze-p3-p5-evidence.json.sha256').read_text(encoding='utf-8').split()[0]
          registry = {
              'schema_version': 1,
              'registry_class': 'PDMAL_PRE_FREEZE_P3_P5_SOURCE_BINDING',
              'candidate_sha': os.environ['CANDIDATE_SHA'],
              'candidate_tree_sha': os.environ['CANDIDATE_TREE_SHA'],
              'control_plane_sha': os.environ['CONTROL_PLANE_SHA'],
              'workflow_definition_sha': os.environ['CONTROL_PLANE_SHA'],
              'producer_workflow': 'PDMAL Pre-Freeze Runner Validation',
              'producer_workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'producer_event': os.environ['GITHUB_EVENT_NAME'],
              'source_artifact': {
                  'name': 'pdmal-pre-freeze-contract-evidence',
                  'id': os.environ['SOURCE_ARTIFACT_ID'],
                  'digest': os.environ['SOURCE_ARTIFACT_DIGEST'],
                  'content_sha256': sidecar,
                  'retention_class': 'GITHUB_ACTIONS_30_DAY_NOT_DURABLE_CUSTODY',
              },
              'gate_interpretation': {
                  'P3': 'EVIDENCE_PRESENT_NOT_CLOSED',
                  'P5': 'EVIDENCE_PRESENT_NOT_CLOSED',
                  'P6': 'OPEN_FAIL_CLOSED',
              },
              'controls': {
                  'protocol_frozen': False,
                  'pilot_authorized': False,
                  'empirical_data_collection': False,
                  'unblinding_requested': False,
              },
          }
          Path('test-artifacts/pdmal-pre-freeze-p3-p5-registry.json').write_text(
              json.dumps(registry, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

      - name: Upload source-bound P3/P5 registry
        uses: actions/upload-artifact@v4
        with:
          name: pdmal-pre-freeze-p3-p5-registry
          path: test-artifacts/pdmal-pre-freeze-p3-p5-registry.json
          if-no-files-found: error
          retention-days: 30

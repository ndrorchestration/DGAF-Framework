name: P4/P7 Blinding Noninterference

on:
  pull_request:
    paths:
      - '.github/workflows/p4-blinding-noninterference.yml'
      - 'docs/experiment/PDMAL_BLINDING_NONINTERFERENCE_AMENDMENT_2026-09-06.md'
      - 'docs/experiment/PDMAL_EXPERIMENT_PROTOCOL.md'
      - 'experiments/pdmal_pilot/run_pilot.py'
      - 'experiments/pdmal_pilot/pilot_artifact_schema.py'
      - 'experiments/pdmal_pilot/test_pilot_artifact_schema.py'
      - 'experiments/pdmal_pilot/test_security_controls.py'
      - 'experiments/pdmal_pilot/test_blinding_noninterference.py'
      - 'experiments/pdmal_pilot/analysis.py'
      - 'experiments/pdmal_pilot/requirements-full-lock.txt'
  workflow_dispatch:

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/experiments/pdmal_pilot

jobs:
  noninterference:
    name: Keyed schedule and exact public artifact surface
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EVIDENCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_SHA"

      - name: Set up Python 3.12.0
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.0'
          check-latest: false

      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r experiments/pdmal_pilot/requirements-full-lock.txt

      - name: Run blinding, order-invariance, and schema adversarial tests
        run: |
          python -m pytest \
            experiments/pdmal_pilot/test_pilot_artifact_schema.py \
            experiments/pdmal_pilot/test_security_controls.py \
            experiments/pdmal_pilot/test_blinding_noninterference.py \
            -q

      - name: Static fail-closed assertions
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          runner_path = Path('experiments/pdmal_pilot/run_pilot.py')
          schema_path = Path('experiments/pdmal_pilot/pilot_artifact_schema.py')
          runner = runner_path.read_text(encoding='utf-8')
          schema = schema_path.read_text(encoding='utf-8')

          tree = ast.parse(runner)
          pilot = next(n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name == 'run_pilot')

          calls = {
              n.func.id
              for n in ast.walk(pilot)
              if isinstance(n, ast.Call) and isinstance(n.func, ast.Name)
          }
          if 'blinded_trial_schedule' not in calls:
              raise SystemExit('run_pilot does not use blinded_trial_schedule')

          record_literals = []
          for n in ast.walk(pilot):
              if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == 'record' for t in n.targets):
                  if isinstance(n.value, ast.Dict):
                      keys = [k.value for k in n.value.keys if isinstance(k, ast.Constant) and isinstance(k.value, str)]
                      record_literals.append(set(keys))
          if len(record_literals) != 1:
              raise SystemExit(f'expected one public record literal, found {len(record_literals)}')
          public_fields = record_literals[0]
          forbidden = {'governance_trace', 'runtime_ms', 'condition', 'condition_mapping'}
          leaked = forbidden & public_fields
          if leaked:
              raise SystemExit(f'forbidden public record fields present: {sorted(leaked)}')

          required_runner_contract = (
              'PROTOCOL_VERSION = "0.7.6"',
              'MIN_BLINDING_KEY_CHARS = 32',
              'PDMAL-BLINDED-CONDITION-ID-v1',
              'PDMAL-BLINDED-TRIAL-ORDER-v1',
          )
          for marker in required_runner_contract:
              if marker not in runner:
                  raise SystemExit(f'missing runner security marker: {marker}')

          if 'ARTIFACT_SCHEMA_VERSION = "1.1"' not in schema:
              raise SystemExit('pilot schema is not version 1.1')
          if 'unexpected record fields' not in schema or 'unexpected fields' not in schema:
              raise SystemExit('exact allowlist rejection is not present')
          PY

      - name: Prove test lane does not execute pilot mode
        run: |
          test -z "${PDMAL_PROTOCOL_FROZEN:-}"
          test -z "${PDMAL_PILOT_AUTHORIZED:-}"
          test -z "${PDMAL_BLINDING_KEY:-}"
          test -z "${PDMAL_FROZEN_COMMIT_SHA:-}"
          echo 'PRE-FREEZE / NOT AUTHORIZED / N=0 validation lane only'

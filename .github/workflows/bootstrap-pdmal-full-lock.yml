name: Bootstrap PDMAL Full Lock

on:
  push:
    branches:
      - epistemic/evidence-architecture-v1

permissions:
  contents: write
  actions: write

jobs:
  generate-full-lock:
    name: Generate resolver-complete PDMAL lock
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/epistemic/evidence-architecture-v1'
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.0'

      - name: Install pinned pip-tools resolver
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-tools==7.6.1

      - name: Generate genuine hash-complete lockfile
        run: |
          test -s experiments/pdmal_pilot/requirements.in
          if [ -s experiments/pdmal_pilot/requirements-full-lock.txt ]; then
            echo 'Lockfile is already populated; nothing to generate.'
            exit 0
          fi
          python -m piptools compile \
            --generate-hashes \
            --output-file experiments/pdmal_pilot/requirements-full-lock.txt \
            experiments/pdmal_pilot/requirements.in

      - name: Verify lockfile is populated and hash-complete
        run: |
          test -s experiments/pdmal_pilot/requirements-full-lock.txt
          grep -q '^--hash=sha256:' experiments/pdmal_pilot/requirements-full-lock.txt
          grep -E '^numpy==|^networkx==|^pytest==|^pandas==' experiments/pdmal_pilot/requirements-full-lock.txt

      - name: Verify locked installation
        run: |
          python -m pip install --require-hashes -r experiments/pdmal_pilot/requirements-full-lock.txt
          python -m pytest experiments/pdmal_pilot/test_harness_contract.py -q

      - name: Commit lockfile and remove bootstrap workflow
        run: |
          if git diff --quiet -- experiments/pdmal_pilot/requirements-full-lock.txt; then
            echo 'No lockfile changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/bootstrap-pdmal-full-lock.yml
          git add experiments/pdmal_pilot/requirements-full-lock.txt .github/workflows/bootstrap-pdmal-full-lock.yml
          git commit -m 'chore: add genuine resolver-generated hash lock for PDMAL pilot'
          git push origin HEAD:epistemic/evidence-architecture-v1

      - name: Dispatch fresh PDMAL pre-freeze validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/pdmal-pre-freeze-runner.yml/dispatches" \
            -d '{"ref":"epistemic/evidence-architecture-v1"}'

name: DGAF Operator Self-Test Contract

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/dgaf-operator-selftest.yml'
      - 'scripts/run_dgaf_operator_selftest.py'
      - 'scripts/run_dgaf_operator_selftest.ps1'
      - 'docs/qa/DGAF_OPERATOR_SELFTEST.md'
      - 'scripts/aoss_stage_a/**'
      - 'scripts/run_aoss_v0_6_stage_a.py'
      - 'scripts/quick_check.py'
      - 'tests/test_aoss*.py'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  operator-selftest-contract:
    name: Internal operator self-test contract
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact DGAF candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact DGAF checkout identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: '3.12.3'

      - name: Bootstrap exact pip resolver
        run: bash scripts/bootstrap_ci_pip.sh

      - name: Install hash-locked test dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          --require-hashes
          --only-binary=:all:
          -r requirements-ci-py312-ubuntu2404-x64.lock

      - name: Obtain frozen ACP target independently of DGAF worktree
        env:
          ACP_ROOT: ${{ runner.temp }}/agent-control-plane
          ACP_COMMIT: dbab7c1afafec524ce7c18157de2089cafe79c87
        run: |
          git clone https://github.com/ndrorchestration/agent-control-plane.git "$ACP_ROOT"
          git -C "$ACP_ROOT" checkout --detach "$ACP_COMMIT"
          test "$(git -C "$ACP_ROOT" rev-parse HEAD)" = "$ACP_COMMIT"
          test -z "$(git -C "$ACP_ROOT" status --porcelain=v1 --untracked-files=all)"

      - name: Run bounded operator self-test contract
        env:
          ACP_ROOT: ${{ runner.temp }}/agent-control-plane
          OUTPUT_ROOT: ${{ runner.temp }}/dgaf-operator-selftest-results
        run: |
          python scripts/run_dgaf_operator_selftest.py \
            --dgaf-root "$GITHUB_WORKSPACE" \
            --acp-root "$ACP_ROOT" \
            --output-root "$OUTPUT_ROOT"

      - name: Upload internal self-test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dgaf-operator-selftest-internal-evidence
          path: ${{ runner.temp }}/dgaf-operator-selftest-results/**
          if-no-files-found: warn

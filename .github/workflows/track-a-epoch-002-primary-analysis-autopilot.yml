name: Track A Epoch 002 Primary Analysis Autopilot Tooling

on:
  pull_request:
    paths:
      - '.github/workflows/track-a-epoch-002-primary-analysis-autopilot.yml'
      - 'scripts/run_track_a_epoch_002_primary_analysis_autopilot.ps1'
      - 'tests/test_track_a_epoch_002_primary_analysis_autopilot.py'
      - 'docs/experiment/TRACK_A_EPOCH_002_PRIMARY_ANALYSIS_EXECUTION_PROCEDURE.md'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/track-a-epoch-002-primary-analysis-autopilot.yml'
      - 'scripts/run_track_a_epoch_002_primary_analysis_autopilot.ps1'
      - 'tests/test_track_a_epoch_002_primary_analysis_autopilot.py'
      - 'docs/experiment/TRACK_A_EPOCH_002_PRIMARY_ANALYSIS_EXECUTION_PROCEDURE.md'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Validate local analysis autopilot without execution
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact evaluated head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact checkout identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.0'

      - name: Install test dependency
        run: python -m pip install pytest==9.0.3

      - name: Parse PowerShell syntax only
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/run_track_a_epoch_002_primary_analysis_autopilot.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'EPOCH002_ANALYSIS_AUTOPILOT_POWERSHELL_PARSE=PASS'

      - name: Run static fail-closed contract tests
        run: python -m pytest -q tests/test_track_a_epoch_002_primary_analysis_autopilot.py

      - name: Prove CI does not execute empirical analysis
        run: |
          set -euo pipefail
          workflow='.github/workflows/track-a-epoch-002-primary-analysis-autopilot.yml'
          ! grep -q -- '--input .*unblinded' "$workflow"
          ! grep -q 'DGAF-Epoch002-Materialization' "$workflow"
          ! grep -q 'run_track_a_epoch_002_locked_primary_analysis.py' "$workflow"
          echo 'EPOCH002_ANALYSIS_AUTOPILOT_CI=PASS_NONEXECUTING'
          echo 'PRIMARY_ANALYSIS_EXECUTION=NOT_PERFORMED'
          echo 'SCIENTIFIC_N_INCREMENT=0'
          echo 'CANONICAL_DGAF_EFFICACY=NOT_ESTABLISHED'

  windows-frozen-lock-smoke:
    name: Windows frozen analysis lock smoke
    runs-on: windows-2025
    steps:
      - name: Checkout exact evaluated head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact checkout identity
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ((git rev-parse HEAD) -ne $env:EXPECTED_HEAD) {
            throw "exact checkout identity mismatch"
          }

      - name: Prove frozen requirements blob is unchanged
        shell: pwsh
        run: |
          $blob = (git rev-parse "HEAD:experiments/pdmal_pilot/requirements-full-lock.txt").Trim()
          if ($blob -ne "00c1f779e97030f9b25ae494642edb31b5b09de5") {
            throw "frozen requirements blob drift: $blob"
          }
          Write-Host "EPOCH002_REQUIREMENTS_BLOB=00c1f779e97030f9b25ae494642edb31b5b09de5"

      - name: Set up exact locked Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.0'

      - name: Install exact frozen package set without dependency re-resolution
        shell: pwsh
        run: |
          python -m pip install --require-hashes --no-deps -r experiments/pdmal_pilot/requirements-full-lock.txt

      - name: Verify exact locked runtime
        shell: pwsh
        run: |
          $pythonVersion = (python -c "import platform; print(platform.python_version())").Trim()
          $numpyVersion = (python -c "import numpy; print(numpy.__version__)").Trim()
          if ($pythonVersion -ne "3.12.0") {
            throw "Python mismatch: $pythonVersion"
          }
          if ($numpyVersion -ne "2.5.1") {
            throw "NumPy mismatch: $numpyVersion"
          }
          Write-Host "PYTHON=$pythonVersion"
          Write-Host "NUMPY=$numpyVersion"

      - name: Build isolated governance support overlay
        shell: pwsh
        run: |
          $support = Join-Path $env:RUNNER_TEMP "epoch002-governance-support"
          python -m pip install --target "$support" jsonschema==4.26.0
          $numpyArtifacts = @(Get-ChildItem -LiteralPath $support -Name | Where-Object { $_ -match '^numpy(?:-|$)' })
          if ($numpyArtifacts.Count -ne 0) {
            throw "governance support overlay unexpectedly contains NumPy"
          }
          "EPOCH002_GOVERNANCE_SUPPORT=$support" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run non-executing authorized preflight on Windows
        shell: pwsh
        run: |
          $env:PYTHONPATH = $env:EPOCH002_GOVERNANCE_SUPPORT
          python scripts/run_track_a_epoch_002_locked_primary_analysis.py --preflight-only


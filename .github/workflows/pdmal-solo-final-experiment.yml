name: PDMAL Solo Final Experiment

on:
  pull_request:
    paths:
      - '.github/workflows/pdmal-solo-final-experiment.yml'
      - 'docs/experiment/SOLO_PILOT_QC_ADJUDICATION_2026-09-07.md'
  push:
    branches:
      - 'solo-experiment/run-*'

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12.0'
  FINAL_SEEDS: '50'

jobs:
  validate-workflow-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r experiments/pdmal_pilot/requirements-full-lock.txt
      - name: Validate Solo Pilot governance contract
        run: python scripts/validate_solo_pilot_track.py --self-test
      - name: Run Solo authorization controls
        env:
          PYTHONPATH: experiments/pdmal_pilot
        run: python -m pytest experiments/pdmal_pilot/test_solo_pilot_track.py -q
      - name: Validate final-experiment contract without empirical execution
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/pdmal-solo-final-experiment.yml')
          text = p.read_text(encoding='utf-8')
          required = [
              "FINAL_SEEDS: '50'",
              "'empirical_observations': 9000",
              "'outcomes_inspected_by_collection_workflow': False",
              '--seeds "$FINAL_SEEDS"',
              "solo-experiment/run-*",
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f'missing final-experiment contract token: {token}')
          print('SOLO_FINAL_WORKFLOW_CONTRACT_PASS')
          PY
          test "${PDMAL_MODE:-}" != 'solo_pilot'
          test "${PDMAL_SOLO_PILOT_AUTHORIZED:-}" != '1'
          echo 'NON_EMPIRICAL_PR_VALIDATION_PASS'

  execute-final-solo-experiment:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact run commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact one-file final-run request commit
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")
          if [[ "${#changed[@]}" -ne 1 || "${changed[0]}" != "docs/experiment/solo_runs/SOLO_FINAL_RUN_REQUEST.json" ]]; then
            printf 'Solo final execution prohibited: run commit must change only SOLO_FINAL_RUN_REQUEST.json; changed=%s\n' "${changed[*]:-none}" >&2
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('docs/experiment/solo_runs/SOLO_FINAL_RUN_REQUEST.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          expected = {
              'record_type': 'DGAF_PDMAL_SOLO_FINAL_EXPERIMENT_RUN_REQUEST',
              'schema_version': 1,
              'protocol_version': '0.7.6',
              'execution_mode': 'solo_pilot',
              'authorization': 'GRANTED_BY_DEVELOPER_AFTER_BLINDED_QC',
              'qc_record': 'docs/experiment/SOLO_PILOT_QC_ADJUDICATION_2026-09-07.md',
              'limitations_acknowledged': True,
              'seeds': 50,
              'expected_observations': 9000,
              'outcome_inspection_during_collection': False,
              'unblinding_authorized': False,
          }
          if d != expected:
              raise SystemExit(f'Solo final execution prohibited: request mismatch: {d!r}')
          print('SOLO_FINAL_RUN_REQUEST_PASS')
          PY

      - name: Set up Python 3.12.0
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install hash-locked pilot dependencies
        run: python -m pip install --require-hashes -r experiments/pdmal_pilot/requirements-full-lock.txt

      - name: Generate recoverable final-experiment blinding key
        shell: bash
        run: |
          set -euo pipefail
          KEY="$(python - <<'PY'
          import secrets
          print(secrets.token_hex(32))
          PY
          )"
          echo "::add-mask::$KEY"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/pdmal_solo_final_blinding_key.txt"
          chmod 600 "$RUNNER_TEMP/pdmal_solo_final_blinding_key.txt"
          echo "PDMAL_BLINDING_KEY=$KEY" >> "$GITHUB_ENV"
          test -s "$RUNNER_TEMP/pdmal_solo_final_blinding_key.txt"
          echo 'SOLO_FINAL_CUSTODY_BOUNDARY: recoverable same-system artifact custody; not independent custody'

      - name: Execute blinded 50-seed Solo final experiment
        env:
          PDMAL_MODE: solo_pilot
          PDMAL_PROTOCOL_FROZEN: '1'
          PDMAL_SOLO_PILOT_AUTHORIZED: '1'
          PDMAL_SOLO_LIMITATIONS_ACKNOWLEDGED: '1'
          PDMAL_FROZEN_COMMIT_SHA: ${{ github.sha }}
          PDMAL_ARCHIVE_ROOT: ${{ runner.temp }}/pdmal-solo-final-archive
          PYTHONPATH: experiments/pdmal_pilot
        run: |
          set -euo pipefail
          test "${PDMAL_PILOT_AUTHORIZED:-}" != '1'
          python experiments/pdmal_pilot/run_pilot.py \
            --seeds "$FINAL_SEEDS" \
            --output-dir "$RUNNER_TEMP/pdmal-solo-final-output"

      - name: Lock and structurally verify final dataset without inspecting outcomes
        env:
          PDMAL_FROZEN_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'pdmal-solo-final-output'
          seeds = sorted(root.glob('solo_pilot_seed_*.json'))
          if len(seeds) != 50:
              raise SystemExit(f'expected 50 seed artifacts, found {len(seeds)}')
          expected_names = {f'solo_pilot_seed_{20260819+i}.json' for i in range(50)}
          if {p.name for p in seeds} != expected_names:
              raise SystemExit('final dataset seed identity set mismatch')

          total_records = 0
          seed_digests = {}
          for p in seeds:
              raw = p.read_bytes()
              sidecar = p.with_suffix(p.suffix + '.sha256')
              if not sidecar.is_file():
                  raise SystemExit(f'missing sidecar for {p.name}')
              digest = hashlib.sha256(raw).hexdigest()
              if not sidecar.read_text(encoding='utf-8').startswith(digest + '  '):
                  raise SystemExit(f'sidecar mismatch for {p.name}')
              doc = json.loads(raw)
              records = doc.get('records')
              if not isinstance(records, list) or len(records) != 180:
                  raise SystemExit(f'expected 180 records in {p.name}')
              # Structural-only checks: do not read or aggregate outcome fields.
              if doc.get('frozen_commit_sha') != os.environ['PDMAL_FROZEN_COMMIT_SHA']:
                  raise SystemExit(f'frozen SHA mismatch in {p.name}')
              total_records += len(records)
              seed_digests[p.name] = digest

          if total_records != 9000:
              raise SystemExit(f'expected 9000 records, found {total_records}')

          summary_path = root / 'solo_pilot_summary.json'
          summary = json.loads(summary_path.read_text(encoding='utf-8'))
          required = {
              'validation_track': 'SOLO_DEVELOPER',
              'independent_verification_status': 'NOT_ESTABLISHED_BY_RUNNER',
              'frozen_commit_sha': os.environ['PDMAL_FROZEN_COMMIT_SHA'],
              'total_seeds': 50,
              'trials_per_seed': 180,
              'total_trials': 9000,
          }
          for key, value in required.items():
              if summary.get(key) != value:
                  raise SystemExit(f'summary mismatch for {key}: {summary.get(key)!r} != {value!r}')

          manifest = {
              'record_type': 'DGAF_PDMAL_SOLO_FINAL_DATASET_LOCK',
              'schema_version': 1,
              'source_commit_sha': os.environ['PDMAL_FROZEN_COMMIT_SHA'],
              'github_run_id': os.environ['GITHUB_RUN_ID'],
              'validation_track': 'SOLO_DEVELOPER',
              'independent_verification_status': 'NOT_ESTABLISHED_BY_RUNNER',
              'blinding_key_custody': 'SAME_SYSTEM_GITHUB_ACTIONS_ARTIFACT',
              'seed_count': 50,
              'empirical_observations': 9000,
              'outcomes_inspected_by_collection_workflow': False,
              'unblinding_authorized': False,
              'dataset_status': 'LOCKED_BLINDED',
              'seed_artifact_sha256': seed_digests,
          }
          out = Path(os.environ['RUNNER_TEMP']) / 'SOLO_FINAL_DATASET_LOCK.json'
          out.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print('SOLO_FINAL_DATASET_LOCK_PASS: 50 seeds / 9000 blinded observations; outcomes not inspected')
          PY

      - name: Upload locked blinded final dataset
        uses: actions/upload-artifact@v4
        with:
          name: pdmal-solo-final-dataset-${{ github.sha }}
          path: |
            ${{ runner.temp }}/pdmal-solo-final-output/
            ${{ runner.temp }}/pdmal-solo-final-archive/
            ${{ runner.temp }}/SOLO_FINAL_DATASET_LOCK.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload recoverable final-experiment blinding key
        uses: actions/upload-artifact@v4
        with:
          name: pdmal-solo-final-blinding-key-${{ github.sha }}
          path: ${{ runner.temp }}/pdmal_solo_final_blinding_key.txt
          if-no-files-found: error
          retention-days: 90

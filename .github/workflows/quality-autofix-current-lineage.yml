name: Temporary Current-Lineage Black/isort Autofix

permissions:
  contents: write

on:
  push:
    branches:
      - fix/quality-black-isort-current-lineage-20260905

jobs:
  format:
    if: github.actor == 'ndrorchestration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout formatter branch
        uses: actions/checkout@v4
        with:
          ref: fix/quality-black-isort-current-lineage-20260905
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: pip

      - name: Install repository-pinned CI toolchain
        run: python -m pip install -r requirements-ci.txt

      - name: Verify exact formatter versions
        run: |
          python - <<'PY'
          import black
          import isort

          assert black.__version__ == '26.5.1', black.__version__
          assert isort.__version__ == '8.0.1', isort.__version__
          print(f'black={black.__version__}')
          print(f'isort={isort.__version__}')
          PY

      - name: Apply mechanical import and formatting normalization
        run: |
          isort components/ tests/ --profile=black
          black components/ tests/ --line-length=120

      - name: Verify formatter baseline and preserved type baseline
        run: |
          black --check components/ tests/ --line-length=120
          isort --check-only components/ tests/ --profile=black
          mypy components/ --ignore-missing-imports --no-implicit-optional
          git diff --check

      - name: Remove temporary workflow from proposed repository diff
        run: rm .github/workflows/quality-autofix-current-lineage.yml

      - name: Commit only mechanical formatter output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/ tests/ .github/workflows/quality-autofix-current-lineage.yml
          git status --short
          if git diff --cached --quiet; then
            echo 'No formatter changes produced.'
            exit 1
          fi
          git commit -m 'style: normalize current-lineage Python formatting and imports'
          git push origin HEAD:fix/quality-black-isort-current-lineage-20260905

name: E2b Verifier Lock

on:
  pull_request:
    paths:
      - 'requirements-epistemic.txt'
      - 'requirements-epistemic.lock'
      - 'docs/governance/E2B_VERIFIER_LOCK_POLICY.md'
      - '.github/workflows/e2b-verifier-lock.yml'
  workflow_dispatch:
    inputs:
      expected_target_sha:
        description: 'Exact Git commit SHA required for this verification run'
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact target tree
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Assert checkout matches target
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha=$(git rev-parse HEAD)
          test "$checked_out_sha" = "$TARGET_SHA" || {
            echo "E2b checkout mismatch: expected $TARGET_SHA, found $checked_out_sha"
            exit 1
          }

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify source requirements fingerprint
        shell: bash
        run: |
          set -euo pipefail
          actual=$(sha256sum requirements-epistemic.txt | cut -d' ' -f1)
          expected='3bcac33804dbadca931bf15667b4eb2eade42c0708ed9d0e0831fd842af869fc'
          test "$actual" = "$expected" || {
            echo "E2b source fingerprint mismatch: expected $expected, found $actual"
            exit 1
          }

      - name: Verify hash-pinned installation
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-epistemic.lock

      - name: Assert exact target when manually requested
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$TARGET_SHA" = "${{ inputs.expected_target_sha }}" || {
            echo "E2b target mismatch: expected ${{ inputs.expected_target_sha }}, found $TARGET_SHA"
            exit 1
          }

      - name: Emit exact-tree E2b provenance
        shell: bash
        run: |
          set -euo pipefail
          source_sha=$(sha256sum requirements-epistemic.txt | cut -d' ' -f1)
          lock_sha=$(sha256sum requirements-epistemic.lock | cut -d' ' -f1)
          workflow_sha=$(sha256sum .github/workflows/e2b-verifier-lock.yml | cut -d' ' -f1)
          {
            printf 'target_commit=%s\n' "$TARGET_SHA"
            printf 'source_requirements_sha256=%s\n' "$source_sha"
            printf 'lock_sha256=%s\n' "$lock_sha"
            printf 'workflow_sha256=%s\n' "$workflow_sha"
            printf '%s\n%s\n%s\n%s\n' "$TARGET_SHA" "$source_sha" "$lock_sha" "$workflow_sha" | sha256sum | awk '{print "e2b_dependency_fingerprint=" $1}'
          } | tee e2b-dependency-fingerprint.txt

      - name: Upload dependency fingerprint evidence
        uses: actions/upload-artifact@v4
        with:
          name: e2b-dependency-fingerprint
          path: e2b-dependency-fingerprint.txt

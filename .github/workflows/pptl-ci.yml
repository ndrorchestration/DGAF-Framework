name: PPTL CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pptl-ci:
    name: PPTL CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate dependency-aware metric provenance
        run: python scripts/lint_provenance.py

      - name: Run provenance regression tests
        run: python -m unittest discover -s tests -p 'test_lint_provenance.py' -v

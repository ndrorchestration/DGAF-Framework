name: B2 Stateful Context Closure Profile
on:
  pull_request:
    paths:
      - 'components/ensemble_v17.py'
      - 'experiments/pdmal_pilot/b2_stateful_context_closure_profile.py'
      - 'experiments/pdmal_pilot/test_b2_stateful_context_closure_profile.py'
      - 'docs/governance/DGAF_STATEFUL_CONTEXT_CLOSURE_PROFILE_V1.json'
      - 'scripts/validate_b2_stateful_context_closure_profile.py'
      - '.github/workflows/b2-stateful-context-closure-profile.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.0'
      - run: python -m pip install pytest==9.0.3
      - run: python scripts/validate_b2_stateful_context_closure_profile.py
      - run: python -m pytest experiments/pdmal_pilot/test_b2_stateful_context_closure_profile.py -q

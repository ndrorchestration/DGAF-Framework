name: Ecosystem Registry Audit

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 * * * *"   # hourly
  push:
    paths:
      - "registry/**"
      - "tests/test_ecosystem_registry_projection_hygiene.py"
      - ".github/workflows/ecosystem-audit.yml"
      - "repos/README.md"
      - "docs/ECOSYSTEM_AUDIT_STATUS.md"
  pull_request:
    paths:
      - "registry/**"
      - "tests/test_ecosystem_registry_projection_hygiene.py"
      - ".github/workflows/ecosystem-audit.yml"
      - "repos/README.md"
      - "docs/ECOSYSTEM_AUDIT_STATUS.md"

permissions:
  contents: read

jobs:
  audit-ecosystem:
    runs-on: ubuntu-latest
    env:
      GITHUB_OWNER: ndrorchestration
      REGISTRY_PATH: registry/ecosystem_registry.json
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pytest requests

      - name: Run semantic projection regression tests
        run: pytest -q tests/test_ecosystem_registry_projection_hygiene.py

      - name: Run ecosystem audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_PATH: ${{ env.REGISTRY_PATH }}
          GITHUB_OWNER: ${{ env.GITHUB_OWNER }}
        run: python registry/ecosystem_audit.py

      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecosystem-audit-log-${{ github.run_id }}
          path: registry/
          retention-days: 14

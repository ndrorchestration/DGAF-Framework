name: PDMAL Instrumentation Dry Run

# Experiment evidence workflow: documentation-only changes must not become
# experimental candidates. Resolve the designated runtime candidate from the
# canonical manifest and record the workflow-definition commit separately.
on:
  push:
    paths:
      - 'experiments/pdmal_topology/**'
      - '.github/workflows/pdmal-instrumentation-dry-run.yml'
  pull_request:
    paths:
      - 'experiments/pdmal_topology/**'
      - '.github/workflows/pdmal-instrumentation-dry-run.yml'
  workflow_dispatch:

jobs:
  pdmal-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    env:
      PDMAL_BLINDING_KEY: ${{ secrets.PDMAL_BLINDING_KEY }}
      PYTHONPATH: ${{ github.workspace }}/experiments/pdmal_topology
    steps:
      - name: Checkout control plane for candidate resolution
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Resolve designated runtime candidate
        id: candidate
        env:
          WORKFLOW_DEFINITION_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          manifest="docs/experiment/NEW_CANDIDATE_MANIFEST.md"
          candidate_sha="$(awk '/^candidate_sha:/{print $2; exit}' "$manifest")"
          candidate_tree_sha="$(awk '/^candidate_tree_sha:/{print $2; exit}' "$manifest")"
          apparatus_source_sha="$(awk '/^apparatus_source_sha:/{print $2; exit}' "$manifest")"
          apparatus_source_tree_sha="$(awk '/^apparatus_source_tree_sha:/{print $2; exit}' "$manifest")"
          test "${#candidate_sha}" = 40
          test "${#candidate_tree_sha}" = 40
          test "${#apparatus_source_sha}" = 40
          test "${#apparatus_source_tree_sha}" = 40
          {
            echo "candidate_sha=$candidate_sha"
            echo "candidate_tree_sha=$candidate_tree_sha"
            echo "apparatus_source_sha=$apparatus_source_sha"
            echo "apparatus_source_tree_sha=$apparatus_source_tree_sha"
          } >> "$GITHUB_OUTPUT"
          echo "WORKFLOW_DEFINITION_SHA=$WORKFLOW_DEFINITION_SHA" >> "$GITHUB_ENV"
          {
            echo "designated_candidate_sha=$candidate_sha"
            echo "designated_candidate_tree_sha=$candidate_tree_sha"
            echo "workflow_definition_sha=$WORKFLOW_DEFINITION_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout designated runtime candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.candidate_sha }}
          persist-credentials: false

      - name: Capture executed source identity
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
          EXPECTED_CANDIDATE_TREE_SHA: ${{ steps.candidate.outputs.candidate_tree_sha }}
          APPARATUS_SOURCE_SHA: ${{ steps.candidate.outputs.apparatus_source_sha }}
          APPARATUS_SOURCE_TREE_SHA: ${{ steps.candidate.outputs.apparatus_source_tree_sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          tree_sha="$(git rev-parse HEAD^{tree})"
          test "$tree_sha" = "$EXPECTED_CANDIDATE_TREE_SHA"
          protocol_blob_sha="$(git hash-object docs/experiment/PDMAL_EXPERIMENT_PROTOCOL.md)"
          protocol_content_sha256="$(sha256sum docs/experiment/PDMAL_EXPERIMENT_PROTOCOL.md | awk '{print $1}')"
          execution_timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          test "${#APPARATUS_SOURCE_SHA}" = 40
          test "${#APPARATUS_SOURCE_TREE_SHA}" = 40
          test "${#protocol_blob_sha}" = 40
          {
            echo "CANDIDATE_SHA=$CANDIDATE_SHA"
            echo "EXECUTED_TREE_SHA=$tree_sha"
            echo "APPARATUS_SOURCE_SHA=$APPARATUS_SOURCE_SHA"
            echo "APPARATUS_SOURCE_TREE_SHA=$APPARATUS_SOURCE_TREE_SHA"
            echo "WORKFLOW_RUN_ID=$WORKFLOW_RUN_ID"
            echo "WORKFLOW_EVENT=$WORKFLOW_EVENT"
            echo "PROTOCOL_BLOB_SHA=$protocol_blob_sha"
            echo "PROTOCOL_CONTENT_SHA256=$protocol_content_sha256"
            echo "EXECUTION_TIMESTAMP=$execution_timestamp"
          } >> "$GITHUB_ENV"
          {
            echo "executed_candidate_sha=$CANDIDATE_SHA"
            echo "executed_tree_sha=$tree_sha"
            echo "apparatus_source_sha=$APPARATUS_SOURCE_SHA"
            echo "apparatus_source_tree_sha=$APPARATUS_SOURCE_TREE_SHA"
            echo "workflow_run_id=$WORKFLOW_RUN_ID"
            echo "workflow_event=$WORKFLOW_EVENT"
            echo "protocol_blob_sha=$protocol_blob_sha"
            echo "protocol_content_sha256=$protocol_content_sha256"
            echo "execution_timestamp=$execution_timestamp"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install experiment dependencies from hash-pinned requirements
        working-directory: experiments/pdmal_topology
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Fail fast if blinding secret is unavailable
        run: |
          python - <<'PY'
          import os
          key = os.getenv("PDMAL_BLINDING_KEY", "")
          if len(key) < 32:
              raise SystemExit("PDMAL_BLINDING_KEY missing or shorter than 32 characters; refusing to run unblinded")
          print("PDMAL_BLINDING_KEY is present (value withheld)")
          PY
      - name: Run deterministic smoke case twice
        working-directory: experiments/pdmal_topology
        run: |
          python determinism.py --seed 42 --topology pdmal --failures 0 --output /tmp/pdmal-a.json > /tmp/pdmal-a.sha
          python determinism.py --seed 42 --topology pdmal --failures 0 --output /tmp/pdmal-b.json > /tmp/pdmal-b.sha
          cmp /tmp/pdmal-a.json /tmp/pdmal-b.json
          cmp /tmp/pdmal-a.sha /tmp/pdmal-b.sha
      - name: Run structural invariants and artifact tests
        working-directory: experiments/pdmal_topology
        run: pytest -q test_manifest.py test_graph_harness.py test_semantics.py test_experiment.py test_determinism.py test_artifacts.py
      - name: Generate one-seed masked dry-run CSV
        working-directory: experiments/pdmal_topology
        run: |
          python - <<'PY'
          from experiment import run_structural_pilot
          from artifacts import blind_rows, environment_commit_short, write_csv
          import os
          rows = run_structural_pilot(1)
          masked = blind_rows(rows, os.environ["PDMAL_BLINDING_KEY"])
          path, digest = write_csv(masked, environment_commit_short(), "/tmp/pdmal-artifact")
          print(path)
          print(digest)
          PY
      - name: Validate dry-run CSV schema
        working-directory: experiments/pdmal_topology
        run: python output_schema.py /tmp/pdmal-artifact/raw_pilot_*.csv
      - name: Verify checksum sidecar
        working-directory: experiments/pdmal_topology
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          files = list(Path('/tmp/pdmal-artifact').glob('raw_pilot_*.csv'))
          assert len(files) == 1, f"expected one CSV, found {files}"
          csv_path = files[0]
          expected = csv_path.with_suffix(csv_path.suffix + '.sha256').read_text().split()[0]
          actual = hashlib.sha256(csv_path.read_bytes()).hexdigest()
          assert expected == actual, 'SHA-256 sidecar mismatch'
          print(f'checksum: PASS {actual}')
          PY
      - name: Upload dry-run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdmal-instrumentation-dry-run
          path: /tmp/pdmal-artifact/raw_pilot_*.csv*
          if-no-files-found: error
          retention-days: 14
      - name: Resolve exact source artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifacts_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${WORKFLOW_RUN_ID}/artifacts?per_page=100")"
          artifact_count="$(jq -r '[.artifacts[] | select(.name == "pdmal-instrumentation-dry-run" and .expired == false)] | length' <<<"$artifacts_json")"
          test "$artifact_count" = "1"
          artifact_id="$(jq -r '[.artifacts[] | select(.name == "pdmal-instrumentation-dry-run" and .expired == false)][0].id' <<<"$artifacts_json")"
          artifact_digest="$(jq -r '[.artifacts[] | select(.name == "pdmal-instrumentation-dry-run" and .expired == false)][0].digest // empty' <<<"$artifacts_json")"
          test -n "$artifact_id"
          test "$artifact_id" != "null"
          test -n "$artifact_digest"
          echo "SOURCE_ARTIFACT_NAME=pdmal-instrumentation-dry-run" >> "$GITHUB_ENV"
          echo "SOURCE_ARTIFACT_ID=$artifact_id" >> "$GITHUB_ENV"
          echo "SOURCE_ARTIFACT_DIGEST=$artifact_digest" >> "$GITHUB_ENV"
          {
            echo "source_artifact_name=pdmal-instrumentation-dry-run"
            echo "source_artifact_id=$artifact_id"
            echo "source_artifact_digest=$artifact_digest"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Compute source artifact content digest
        run: |
          set -euo pipefail
          csv_path="$(find /tmp/pdmal-artifact -maxdepth 1 -type f -name 'raw_pilot_*.csv' -print -quit)"
          test -n "$csv_path"
          content_digest="$(sha256sum "$csv_path" | awk '{print $1}')"
          echo "SOURCE_ARTIFACT_CONTENT_DIGEST=$content_digest" >> "$GITHUB_ENV"
          echo "source_artifact_content_digest=$content_digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Emit exact-candidate evidence registry
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          candidate = os.environ["CANDIDATE_SHA"]
          tree_sha = os.environ["EXECUTED_TREE_SHA"]
          apparatus_source_sha = os.environ["APPARATUS_SOURCE_SHA"]
          apparatus_source_tree_sha = os.environ["APPARATUS_SOURCE_TREE_SHA"]
          workflow_definition_sha = os.environ["WORKFLOW_DEFINITION_SHA"]
          run_id = os.environ["WORKFLOW_RUN_ID"]
          event = os.environ["WORKFLOW_EVENT"]
          protocol_blob_sha = os.environ["PROTOCOL_BLOB_SHA"]
          protocol_content_sha256 = os.environ["PROTOCOL_CONTENT_SHA256"]
          execution_timestamp = os.environ["EXECUTION_TIMESTAMP"]
          source_artifact = {
              "name": os.environ["SOURCE_ARTIFACT_NAME"],
              "id": os.environ["SOURCE_ARTIFACT_ID"],
              "digest": os.environ["SOURCE_ARTIFACT_DIGEST"],
              "content_digest": os.environ["SOURCE_ARTIFACT_CONTENT_DIGEST"],
          }
          predicate_defaults = {
              "candidate_sha": candidate,
              "producer_workflow_definition_sha": workflow_definition_sha,
              "producer_workflow_run_id": run_id,
              "producer_artifact_id": source_artifact["id"],
              "producer_artifact_digest": source_artifact["digest"],
              "epistemic_status": "TESTED",
          }
          registry = {
              "schema_version": 2,
              "candidate_sha": candidate,
              "candidate_tree_sha": tree_sha,
              "apparatus_source_sha": apparatus_source_sha,
              "apparatus_source_tree_sha": apparatus_source_tree_sha,
              "protocol_identity": "docs/experiment/PDMAL_EXPERIMENT_PROTOCOL.md",
              "protocol_blob_sha": protocol_blob_sha,
              "protocol_content_sha256": protocol_content_sha256,
              "source_workflow": "PDMAL Instrumentation Dry Run",
              "workflow_definition_sha": workflow_definition_sha,
              "workflow_run_id": run_id,
              "workflow_event": event,
              "workflow_action": "completed",
              "workflow_conclusion": "success",
              "artifact_name": source_artifact["name"],
              "artifact_id": source_artifact["id"],
              "artifact_digest": source_artifact["digest"],
              "artifact_content_digest": source_artifact["content_digest"],
              "execution_timestamp": execution_timestamp,
              "controls": {
                  "freeze_authorized": False,
                  "pilot_authorized": False,
                  "empirical_execution_requested": False,
              },
              "registry_class": "STRUCTURAL_CANDIDATE_EVIDENCE",
              "epistemic_status": "TESTED",
              "predicates": [
                  {**predicate_defaults, "id": "P2", "name": "runtime verification", "required": True, "status": "OPEN",
                   "notes": "Requires separate exact-candidate authenticated runtime verification."},
                  {**predicate_defaults, "id": "P3", "name": "artifact contract", "required": True, "status": "OPEN",
                   "notes": "Dry-run artifact checks are structural evidence; current closure requires the governing acceptance predicate."},
                  {**predicate_defaults, "id": "P4", "name": "blinding/security", "required": True, "status": "OPEN",
                   "notes": "Dry run confirms secret presence and blinded output generation; operational custody closure remains required."},
                  {**predicate_defaults, "id": "P5", "name": "provenance/reproducibility", "required": True, "status": "OPEN",
                   "notes": "Deterministic smoke and structural tests pass; full current-candidate reproducibility closure remains required."},
                  {**predicate_defaults, "id": "P6", "name": "durable evidence custody", "required": True, "status": "OPEN",
                   "notes": "GitHub Actions artifact retention is not durable research custody; archive/retrieval/hash proof remains required."},
                  {**predicate_defaults, "id": "P7", "name": "scientific decision", "required": True, "status": "OPEN",
                   "notes": "No scientific superiority or efficacy conclusion is produced by this structural dry run."},
                  {**predicate_defaults, "id": "P8", "name": "analysis lock", "required": True, "status": "FAIL_CLOSED",
                   "notes": "Analysis lock remains fail-closed until its prerequisites are satisfied."},
                  {**predicate_defaults, "id": "P9", "name": "independent verification", "required": True, "status": "NOT_EXECUTED",
                   "notes": "Independent verification is a separate exact-candidate workflow."},
              ],
              "structural_checks": {
                  "deterministic_smoke": "PASS",
                  "artifact_schema": "PASS",
                  "checksum_sidecar": "PASS",
                  "masked_dry_run_csv": "PASS",
                  "dependency_install": "HASH_LOCKED",
              },
          }
          Path("/tmp/dgaf-evidence-registry.json").write_text(
              json.dumps(registry, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print("emitted designated-candidate registry for", candidate)
          PY
      - name: Upload exact-candidate evidence registry
        uses: actions/upload-artifact@v4
        with:
          name: dgaf-evidence-registry
          path: /tmp/dgaf-evidence-registry.json
          if-no-files-found: error
          retention-days: 14
      - name: One-seed structural dry run
        working-directory: experiments/pdmal_topology
        run: python -c "from graph_harness import build_topologies, apply_node_failures, random_node_failures, structural_metrics; g=build_topologies(1)['pdmal']; f=random_node_failures(1,1); print(structural_metrics(apply_node_failures(g,f)))"

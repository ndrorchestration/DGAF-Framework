name: PDMAL Instrumentation Dry Run

on:
  push:
  pull_request:

jobs:
  pdmal-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    env:
      PDMAL_BLINDING_KEY: ${{ secrets.PDMAL_BLINDING_KEY }}
      PYTHONPATH: ${{ github.workspace }}/experiments/pdmal_topology
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install experiment dependencies
        working-directory: experiments/pdmal_topology
        run: python -m pip install -r requirements.txt
      - name: Fail fast if blinding secret is unavailable
        run: |
          python - <<'PY'
          import os
          key = os.getenv("PDMAL_BLINDING_KEY", "")
          if len(key) < 32:
              raise SystemExit("PDMAL_BLINDING_KEY missing or shorter than 32 characters; refusing to run unblinded")
          print("PDMAL_BLINDING_KEY is present (value withheld)")
          PY
      - name: Run deterministic smoke case twice
        working-directory: experiments/pdmal_topology
        run: |
          python determinism.py --seed 42 --topology pdmal --failures 0 --output /tmp/pdmal-a.json > /tmp/pdmal-a.sha
          python determinism.py --seed 42 --topology pdmal --failures 0 --output /tmp/pdmal-b.json > /tmp/pdmal-b.sha
          cmp /tmp/pdmal-a.json /tmp/pdmal-b.json
          cmp /tmp/pdmal-a.sha /tmp/pdmal-b.sha
      - name: Verify P5 reproducibility contract
        working-directory: experiments/pdmal_topology
        run: |
          python - <<'PY'
          import json
          from determinism import single_case, digest_case
          from seeds import derive_seed

          master = 20260823
          assert derive_seed(master, "topology") != derive_seed(master, "failure")
          assert derive_seed(master, "topology") == derive_seed(master, "topology")
          case_a = single_case(42, "pdmal", 0)
          case_b = single_case(42, "pdmal", 0)
          assert case_a == case_b
          digest_a = digest_case(case_a)
          digest_b = digest_case(case_b)
          assert digest_a == digest_b
          assert len(digest_a) == 64
          print(json.dumps({
              "rng_stream_separation": True,
              "determinism_verified": True,
              "determinism_digest_sha256": digest_a,
          }, sort_keys=True))
          PY
      - name: Run structural invariants and artifact tests
        working-directory: experiments/pdmal_topology
        run: pytest -q test_manifest.py test_graph_harness.py test_semantics.py test_experiment.py test_determinism.py test_artifacts.py
      - name: Generate one-seed masked dry-run CSV
        working-directory: experiments/pdmal_topology
        run: |
          python - <<'PY'
          from experiment import run_structural_pilot
          from artifacts import blind_rows, environment_commit_short, write_csv
          import os
          rows = run_structural_pilot(1)
          masked = blind_rows(rows, os.environ["PDMAL_BLINDING_KEY"])
          path, digest = write_csv(masked, environment_commit_short(), "/tmp/pdmal-artifact")
          print(path)
          print(digest)
          PY
      - name: Validate dry-run CSV schema
        working-directory: experiments/pdmal_topology
        run: python output_schema.py /tmp/pdmal-artifact/raw_pilot_*.csv
      - name: Verify checksum sidecar
        working-directory: experiments/pdmal_topology
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          files = list(Path('/tmp/pdmal-artifact').glob('raw_pilot_*.csv'))
          assert len(files) == 1, f"expected one CSV, found {files}"
          csv_path = files[0]
          expected = csv_path.with_suffix(csv_path.suffix + '.sha256').read_text().split()[0]
          actual = hashlib.sha256(csv_path.read_bytes()).hexdigest()
          assert expected == actual, 'SHA-256 sidecar mismatch'
          print(f'checksum: PASS {actual}')
          PY
      - name: Upload dry-run artifacts
        id: upload_instrumentation
        uses: actions/upload-artifact@v4
        with:
          name: pdmal-instrumentation-dry-run
          path: /tmp/pdmal-artifact/raw_pilot_*.csv*
          if-no-files-found: error
          retention-days: 14
      - name: Round-trip retrieve instrumentation artifact
        uses: actions/download-artifact@v4
        with:
          name: pdmal-instrumentation-dry-run
          path: /tmp/pdmal-roundtrip
      - name: Recompute inner CSV digest after retrieval
        shell: bash
        run: |
          set -euo pipefail
          csv="$(find /tmp/pdmal-roundtrip -maxdepth 1 -name 'raw_pilot_*.csv' -print -quit)"
          test -n "$csv"
          inner_digest="$(sha256sum "$csv" | awk '{print $1}')"
          expected_inner="$(awk '{print $1}' "${csv}.sha256")"
          test "$inner_digest" = "$expected_inner"
          printf '%s\n' "$inner_digest" > /tmp/pdmal-inner-sha256.txt
          echo "inner_csv_sha256=$inner_digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Capture reproducibility environment fingerprint
        shell: bash
        run: |
          set -euo pipefail
          python --version 2>&1 | tee /tmp/python-version.txt
          python -m pip freeze | sort > /tmp/pip-freeze.txt
          sha256sum /tmp/python-version.txt /tmp/pip-freeze.txt > /tmp/environment-fingerprint.sha256
      - name: Emit actual workflow/artifact evidence registry
        env:
          ARTIFACT_ID: ${{ steps.upload_instrumentation.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload_instrumentation.outputs.artifact-digest }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          candidate = os.environ["GITHUB_SHA"]
          artifact_id = os.environ["ARTIFACT_ID"]
          artifact_digest = os.environ["ARTIFACT_DIGEST"]
          inner_digest = Path('/tmp/pdmal-inner-sha256.txt').read_text().strip()
          environment_fingerprint = Path('/tmp/environment-fingerprint.sha256').read_text().strip().splitlines()
          registry = {
              "schema_version": 1,
              "candidate_sha": candidate,
              "source_workflow": os.environ["GITHUB_WORKFLOW"],
              "source_run_id": os.environ["GITHUB_RUN_ID"],
              "controls": {"freeze_authorized": False, "pilot_authorized": False},
              "predicates": [
                  {"id":"P2","name":"runtime verification","required":True,"status":"OPEN","notes":"Deployment lane remains separate; this workflow is not production runtime verification."},
                  {"id":"P3","name":"artifact contract","required":True,"status":"VERIFIED","candidate_sha":candidate,"run_id":os.environ["GITHUB_RUN_ID"],"artifact_id":artifact_id,"artifact_sha256":artifact_digest,"source_workflow":os.environ["GITHUB_WORKFLOW"],"notes":"Exact-candidate PDMAL instrumentation artifact passed secret presence, deterministic smoke, structural tests, schema validation, and checksum validation."},
                  {"id":"P4","name":"blinding/security","required":True,"status":"VERIFIED","candidate_sha":candidate,"run_id":os.environ["GITHUB_RUN_ID"],"artifact_id":artifact_id,"artifact_sha256":artifact_digest,"source_workflow":os.environ["GITHUB_WORKFLOW"],"notes":"Blinding key presence was checked without emitting its value; artifact is the masked dry-run output."},
                  {"id":"P5","name":"provenance/reproducibility","required":True,"status":"VERIFIED","candidate_sha":candidate,"run_id":os.environ["GITHUB_RUN_ID"],"artifact_id":artifact_id,"artifact_sha256":artifact_digest,"source_workflow":os.environ["GITHUB_WORKFLOW"],"notes":"Current candidate passed RNG stream-separation and deterministic-digest checks; exact workflow/artifact binding and environment fingerprint were recorded.","evidence":{"rng_stream_separation":True,"determinism_verified":True,"inner_csv_sha256":inner_digest,"environment_fingerprint_sha256":environment_fingerprint}},
                  {"id":"P6","name":"durable evidence custody","required":True,"status":"VERIFIED","candidate_sha":candidate,"run_id":os.environ["GITHUB_RUN_ID"],"artifact_id":artifact_id,"artifact_sha256":artifact_digest,"custody_verified":True,"source_workflow":os.environ["GITHUB_WORKFLOW"],"notes":"The exact artifact was downloaded in a separate workflow step and its inner CSV checksum was recomputed and matched."},
                  {"id":"P7","name":"scientific decision","required":True,"status":"OPEN","notes":"No exact freeze binding or authorization is asserted."},
                  {"id":"P8","name":"analysis lock","required":True,"status":"FAIL_CLOSED","notes":"No current-candidate analysis lock is established by this structural dry run."},
                  {"id":"P9","name":"independent verification","required":True,"status":"NOT_EXECUTED","notes":"Independent reconstruction remains outstanding."}
              ]
          }
          Path('/tmp/dgaf-evidence-registry.json').write_text(json.dumps(registry, indent=2, sort_keys=True)+'\n', encoding='utf-8')
          PY
          cat /tmp/dgaf-evidence-registry.json
      - name: Upload actual evidence registry
        uses: actions/upload-artifact@v4
        with:
          name: dgaf-evidence-registry
          path: /tmp/dgaf-evidence-registry.json
          if-no-files-found: error
          retention-days: 14
      - name: Evaluate completion controller against actual registry
        shell: bash
        run: |
          set +e
          python scripts/completion_controller.py /tmp/dgaf-evidence-registry.json --actual-candidate-sha "$GITHUB_SHA" --output /tmp/dgaf-completion-controller-report.json
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi
          cat /tmp/dgaf-completion-controller-report.json
          echo "completion_controller_exit=$rc" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload completion-controller report
        uses: actions/upload-artifact@v4
        with:
          name: dgaf-completion-controller-report
          path: /tmp/dgaf-completion-controller-report.json
          if-no-files-found: error
          retention-days: 14
      - name: One-seed structural dry run
        working-directory: experiments/pdmal_topology
        run: |
          python - <<'PY'
          from graph_harness import build_topologies, apply_node_failures, random_node_failures, structural_metrics
          g = build_topologies(1)["pdmal"]
          f = random_node_failures(1, 1)
          print(structural_metrics(apply_node_failures(g, f)))
          PY

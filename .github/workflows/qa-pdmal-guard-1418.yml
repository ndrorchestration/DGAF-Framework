name: PDMAL guard behavioral QA (#1418)

on:
  push:
    branches:
      - qa/1418-behavioral-publication-guard-20261020
    paths:
      - tests/test_pdmal_guard_behavior_1418.py
      - .github/workflows/qa-pdmal-guard-1418.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact QA branch without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Verify unchanged security-candidate workflow blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .github/workflows/pdmal-instrumentation-dry-run.yml)" = "51f9ad44ebab640c7015685903a5cddf0e48bc08"
      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: '3.12'
      - name: Bootstrap pinned Python dependency resolver
        run: bash scripts/bootstrap_ci_pip.sh
      - name: Install repository's exact hash-locked CI toolchain
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-ci-py312-ubuntu2404-x64.lock
      - name: Execute synthetic guard-denial QA only
        run: python -m pytest -q -p no:cacheprovider tests/test_pdmal_guard_behavior_1418.py

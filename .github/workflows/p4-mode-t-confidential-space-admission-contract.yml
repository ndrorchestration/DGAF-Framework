name: P4 Mode T Confidential Space Admission Contract

on:
  pull_request:
    paths:
      - '.github/workflows/p4-mode-t-confidential-space-admission-contract.yml'
      - 'docs/governance/P4_MODE_T_CONFIDENTIAL_SPACE_ADMISSION_2026-09-06.md'
      - 'experiments/pdmal_pilot/mode_t_confidential_space_attestation.py'
      - 'experiments/pdmal_pilot/test_mode_t_confidential_space_attestation.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  admission-contract:
    name: Synthetic fail-closed attestation contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EVIDENCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_SHA"

      - name: Set up Python 3.12.0
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.0'
          check-latest: false

      - name: Run synthetic admission-contract negative controls
        shell: bash
        run: |
          set -euo pipefail
          cd experiments/pdmal_pilot
          python test_mode_t_confidential_space_attestation.py -v

      - name: Static scientific-boundary assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('experiments/pdmal_pilot/mode_t_confidential_space_attestation.py').read_text(encoding='utf-8')
          required = (
              'GCP_INTEL_TDX',
              'disabled-since-boot',
              'REQUIRED_RESTART_POLICY = "Never"',
              'REQUIRED_SUPPORT_ATTRIBUTE = "STABLE"',
              'cryptographic token signature is not verified',
              'attestation nonce binding mismatch',
              '"freeze_established": False',
              '"pilot_authorized": False',
              '"empirical_data_collection": False',
              '"empirical_n": 0',
          )
          for marker in required:
              if marker not in source:
                  raise SystemExit(f'missing fail-closed admission marker: {marker}')

          forbidden = (
              'PDMAL_PROTOCOL_FROZEN=1',
              'PDMAL_PILOT_AUTHORIZED=1',
              'PDMAL_BLINDING_KEY=',
          )
          workflow = Path('.github/workflows/p4-mode-t-confidential-space-admission-contract.yml').read_text(
              encoding='utf-8'
          )
          for marker in forbidden:
              if marker in workflow:
                  raise SystemExit(f'forbidden execution marker in synthetic workflow: {marker}')
          PY

      - name: Report bounded interpretation
        run: |
          echo 'PASS: synthetic Confidential Space claim contract only'
          echo 'P4 custody remains OPEN / NOT EXECUTED'
          echo 'PRE-FREEZE / FAIL-CLOSED / NOT AUTHORIZED / N=0'

<title>Research Program Architecture Map</title>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.t{font-size:26px;font-weight:700}.s{font-size:14px}.l{font-size:14px;font-weight:600}.x{font-size:12px}.z{font-size:10px}.b{fill:#fff;stroke:#111;stroke-width:1.5}.m{fill:#f5f5f5;stroke:#555}.f{fill:#fff;stroke:#111;stroke-width:4}.e{stroke:#222;stroke-width:1;fill:none}.d{stroke:#555;stroke-dasharray:5 5;fill:none}.n{fill:#fff;stroke:#111;stroke-width:1}</style>
<text x="600.0" y="38.0" class="t" text-anchor="middle">Research Program Architecture Map</text><text x="600.0" y="64.0" class="s" text-anchor="middle">Research lanes are separated by evidence and authorization boundaries · Source snapshot last_verified: 2026-09-14</text><rect x="60.0" y="95.0" width="1080.0" height="90.0" rx="8" class="m"/><text x="90.0" y="125.0" class="l" text-anchor="start">DGAF governance / evidence control plane</text><text x="90" y="150" class="x" text-anchor="start"><tspan x="90" dy="0">High-Assurance: PRE-FREEZE / FAIL-CLOSED / NOT AUTHORIZED</tspan><tspan x="90" dy="17">Canonical empirical N: 0 · efficacy: NOT ESTABLISHED</tspan></text><rect x="70.0" y="235.0" width="325.0" height="145.0" rx="8" class="b"/><text x="88.0" y="265.0" class="l" text-anchor="start">Track A Epoch 001</text><text x="88" y="293" class="x" text-anchor="start"><tspan x="88" dy="0">Historical exact-scope boundary</tspan><tspan x="88" dy="17">Completed blinded collection is not transferable</tspan><tspan x="88" dy="17">Primary outcome status remains source-bound</tspan></text><rect x="438.0" y="235.0" width="325.0" height="145.0" rx="8" class="b"/><text x="456.0" y="265.0" class="l" text-anchor="start">Track A Epoch 002</text><text x="456" y="293" class="x" text-anchor="start"><tspan x="456" dy="0">Controlling successor scientific lane</tspan><tspan x="456" dy="17">Collection: COMPLETE</tspan><tspan x="456" dy="17">50 paired seed units / 2,250 blinded observations</tspan><tspan x="456" dy="17">Primary analysis: NOT AUTHORIZED / NOT RUN</tspan></text><rect x="805.0" y="235.0" width="325.0" height="145.0" rx="8" class="b"/><text x="823.0" y="265.0" class="l" text-anchor="start">Canonical High-Assurance</text><text x="823" y="293" class="x" text-anchor="start"><tspan x="823" dy="0">Separate candidate / freeze / authorization lane</tspan><tspan x="823" dy="17">No state inheritance from Track A</tspan><tspan x="823" dy="17">N=0</tspan></text><rect x="150.0" y="445.0" width="390.0" height="125.0" rx="8" class="b"/><text x="168.0" y="475.0" class="l" text-anchor="start">B1 / B2 / B3</text><text x="168" y="503" class="x" text-anchor="start"><tspan x="168" dy="0">Standalone non-empirical lanes</tspan><tspan x="168" dy="17">Engineering/formal evidence only</tspan><tspan x="168" dy="17">No empirical efficacy transfer</tspan></text><rect x="660.0" y="445.0" width="390.0" height="125.0" rx="8" class="b"/><text x="678.0" y="475.0" class="l" text-anchor="start">Track C composition</text><text x="678" y="503" class="x" text-anchor="start"><tspan x="678" dy="0">Integrated composition proposal lane</tspan><tspan x="678" dy="17">Execution/efficacy requires its own authority</tspan><tspan x="678" dy="17">Adjacency is not evidence transfer</tspan></text><line x1="600.0" y1="185.0" x2="600.0" y2="225.0" class="e"/><path d="M600.0,225.0 L595.7,218.2 L604.3,218.2Z" fill="#111"/><line x1="232.0" y1="220.0" x2="968.0" y2="220.0" class="d"/><text x="600.0" y="210.0" class="z" text-anchor="middle">shared governance discipline; evidence remains lane-scoped</text><line x1="600.0" y1="380.0" x2="600.0" y2="430.0" class="d"/><text x="600.0" y="418.0" class="z" text-anchor="middle">non-empirical lanes do not establish Track A or High-Assurance efficacy</text><text x="24.0" y="700.0" class="z" text-anchor="start">Generated from canonical repository sources; visualization does not create scientific state.</text><text x="1176.0" y="700.0" class="z" text-anchor="end">sha256:72ca4e4ebe1f4bd30fafdc5bbb3544e9c89b260629dded3895130549e77368ab</text>
</svg>

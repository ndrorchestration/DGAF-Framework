<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="790" viewBox="0 0 1320 790" data-figure-id="FIG-005" data-epistemic-class="PROVENANCE" data-source-digest="sha256:72ca4e4ebe1f4bd30fafdc5bbb3544e9c89b260629dded3895130549e77368ab">
<title>Evidence and Provenance DAG</title>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.t{font-size:26px;font-weight:700}.s{font-size:14px}.l{font-size:14px;font-weight:600}.x{font-size:12px}.z{font-size:10px}.b{fill:#fff;stroke:#111;stroke-width:1.5}.m{fill:#f5f5f5;stroke:#555}.f{fill:#fff;stroke:#111;stroke-width:4}.e{stroke:#222;stroke-width:1;fill:none}.d{stroke:#555;stroke-dasharray:5 5;fill:none}.n{fill:#fff;stroke:#111;stroke-width:1}</style>
<text x="660.0" y="38.0" class="t" text-anchor="middle">Evidence and Provenance DAG</text><text x="660.0" y="64.0" class="s" text-anchor="middle">Claim strength is bounded by identity, provenance, authorization, and analysis lineage</text><rect x="80.0" y="135.0" width="250.0" height="78.0" rx="8" class="b"/><text x="205.0" y="165.0" class="l" text-anchor="middle">Protocol + source code</text><text x="205.0" y="190.0" class="z" text-anchor="middle">Defines intended mechanism</text><rect x="400.0" y="135.0" width="250.0" height="78.0" rx="8" class="b"/><text x="525.0" y="165.0" class="l" text-anchor="middle">Exact commit / candidate</text><text x="525.0" y="190.0" class="z" text-anchor="middle">Binds implementation identity</text><rect x="720.0" y="135.0" width="250.0" height="78.0" rx="8" class="b"/><text x="845.0" y="165.0" class="l" text-anchor="middle">CI / predicate evidence</text><text x="845.0" y="190.0" class="z" text-anchor="middle">Supports only tested predicates</text><rect x="1040.0" y="135.0" width="220.0" height="78.0" rx="8" class="b"/><text x="1150.0" y="165.0" class="l" text-anchor="middle">Governance decision</text><text x="1150.0" y="190.0" class="z" text-anchor="middle">Can authorize bounded next step</text><rect x="1040.0" y="320.0" width="220.0" height="78.0" rx="8" class="b"/><text x="1150.0" y="350.0" class="l" text-anchor="middle">Authorized execution</text><text x="1150.0" y="375.0" class="z" text-anchor="middle">Produces scoped observations</text><rect x="720.0" y="320.0" width="250.0" height="78.0" rx="8" class="b"/><text x="845.0" y="350.0" class="l" text-anchor="middle">Collected artifacts</text><text x="845.0" y="375.0" class="z" text-anchor="middle">Require provenance + custody</text><rect x="400.0" y="320.0" width="250.0" height="78.0" rx="8" class="b"/><text x="525.0" y="350.0" class="l" text-anchor="middle">Custody / lock receipts</text><text x="525.0" y="375.0" class="z" text-anchor="middle">Bind retained data state</text><rect x="80.0" y="320.0" width="250.0" height="78.0" rx="8" class="b"/><text x="205.0" y="350.0" class="l" text-anchor="middle">Materialization receipt</text><text x="205.0" y="375.0" class="z" text-anchor="middle">Binds controlled readable data</text><rect x="80.0" y="505.0" width="250.0" height="78.0" rx="8" class="b"/><text x="205.0" y="535.0" class="l" text-anchor="middle">Analysis authorization</text><text x="205.0" y="560.0" class="z" text-anchor="middle">Separate human-controlled gate</text><rect x="400.0" y="505.0" width="250.0" height="78.0" rx="8" class="b"/><text x="525.0" y="535.0" class="l" text-anchor="middle">Locked analysis output</text><text x="525.0" y="560.0" class="z" text-anchor="middle">Applies preregistered method</text><rect x="720.0" y="505.0" width="250.0" height="78.0" rx="8" class="b"/><text x="845.0" y="535.0" class="l" text-anchor="middle">Scoped research claim</text><text x="845.0" y="560.0" class="z" text-anchor="middle">May not exceed evidence</text><line x1="205.0" y1="174.0" x2="525.0" y2="174.0" class="e"/><path d="M525.0,174.0 L518.2,178.3 L518.2,169.7Z" fill="#111"/><text x="365.0" y="167.0" class="z" text-anchor="middle">bound to</text><line x1="525.0" y1="174.0" x2="845.0" y2="174.0" class="e"/><path d="M845.0,174.0 L838.2,178.3 L838.2,169.7Z" fill="#111"/><text x="685.0" y="167.0" class="z" text-anchor="middle">tested at</text><line x1="845.0" y1="174.0" x2="1150.0" y2="174.0" class="e"/><path d="M1150.0,174.0 L1143.2,178.3 L1143.2,169.7Z" fill="#111"/><text x="997.5" y="167.0" class="z" text-anchor="middle">supports decision</text><line x1="1150.0" y1="174.0" x2="1150.0" y2="359.0" class="e"/><path d="M1150.0,359.0 L1145.7,352.2 L1154.3,352.2Z" fill="#111"/><text x="1150.0" y="259.5" class="z" text-anchor="middle">authorizes</text><line x1="1150.0" y1="359.0" x2="845.0" y2="359.0" class="e"/><path d="M845.0,359.0 L851.8,354.7 L851.8,363.3Z" fill="#111"/><text x="997.5" y="352.0" class="z" text-anchor="middle">generates</text><line x1="845.0" y1="359.0" x2="525.0" y2="359.0" class="e"/><path d="M525.0,359.0 L531.8,354.7 L531.8,363.3Z" fill="#111"/><text x="685.0" y="352.0" class="z" text-anchor="middle">bound by</text><line x1="525.0" y1="359.0" x2="205.0" y2="359.0" class="e"/><path d="M205.0,359.0 L211.8,354.7 L211.8,363.3Z" fill="#111"/><text x="365.0" y="352.0" class="z" text-anchor="middle">permits controlled</text><line x1="205.0" y1="359.0" x2="205.0" y2="544.0" class="e"/><path d="M205.0,544.0 L200.7,537.2 L209.3,537.2Z" fill="#111"/><text x="205.0" y="444.5" class="z" text-anchor="middle">precedes</text><line x1="205.0" y1="544.0" x2="525.0" y2="544.0" class="e"/><path d="M525.0,544.0 L518.2,548.3 L518.2,539.7Z" fill="#111"/><text x="365.0" y="537.0" class="z" text-anchor="middle">authorizes</text><line x1="525.0" y1="544.0" x2="845.0" y2="544.0" class="e"/><path d="M845.0,544.0 L838.2,548.3 L838.2,539.7Z" fill="#111"/><text x="685.0" y="537.0" class="z" text-anchor="middle">supports</text><rect x="1010.0" y="505.0" width="250.0" height="105.0" rx="8" class="m"/><text x="1135.0" y="535.0" class="l" text-anchor="middle">Non-transfer rule</text><text x="1135" y="560" class="z" text-anchor="middle"><tspan x="1135" dy="0">Historical or adjacent evidence</tspan><tspan x="1135" dy="15">does not silently bind a new</tspan><tspan x="1135" dy="15">candidate, epoch, or claim.</tspan></text><line x1="970.0" y1="545.0" x2="1010.0" y2="545.0" class="d"/><text x="24.0" y="770.0" class="z" text-anchor="start">Generated from canonical repository sources; visualization does not create scientific state.</text><text x="1296.0" y="770.0" class="z" text-anchor="end">sha256:72ca4e4ebe1f4bd30fafdc5bbb3544e9c89b260629dded3895130549e77368ab</text>
</svg>

[project]
name = "pdmal-experiment-harness"
version = "0.1.0"
description = "Pre-freeze validation harness for the PDMAL empirical experiment"
requires-python = "==3.12.0"
dependencies = [
  "numpy==2.5.1",
  "networkx==3.6.1",
]

[build-system]
requires = ["setuptools==82.0.0"]
build-backend = "setuptools.build_meta"

[tool.pdmal]
protocol_status = "PRE-FREEZE"
empirical_data_collection = false
